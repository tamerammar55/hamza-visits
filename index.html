function honorsCompute(m) {
  const w = S.settings.honorW; const tw = (+w.l + +w.a + +w.c) || 1;
  const depts = DEPTS.map(d => { const s = deptSummary(d.k); const cls = classesInMonth(m).filter(c => c.dept === d.k && c.status === 'منفذ').length; const score = ((+w.l) * (s.lp ?? 0) + (+w.a) * (s.ap ?? 0) + (+w.c) * (cls ? 100 : 0)) / tw; return { k: d.k, n: d.n, lp: s.lp, ap: s.ap, cls, score }; }).sort((a, b) => b.score - a.score);
  const teachers = teachersIndex().map(t => { const s = teacherSummary(t); const cls = S.classes.filter(c => c.status === 'منفذ' && nameMatch(c.teacher, t.name) && new Date(c.date).getMonth() + 1 === m).length; const sc = (s.lp ?? 0) + (s.ap ?? 0) + (s.neoCount ? (s.lq ?? 0) + (s.aq ?? 0) : 0) / 2 + Math.min(100, s.sp ?? 0) / 4 + cls * 15; return { t, s, cls, sc }; }).filter(x => x.s.ok).sort((a, b) => b.sc - a.sc).slice(0, 10);
  const students = [7, 8, 9].map(g => ({ g, list: S.studentLB.filter(x => String(x.grade).includes(String(g))).sort((a, b) => b.points - a.points).slice(0, 3) }));
  return { depts, teachers, students };

    const d = r.data || {};
    if (Array.isArray(d.school) && d.school.length) R.school = d.school.filter(x => x && x.axis).map(x => ({ prio: PRIO[x.prio] ? x.prio : 'مهم', axis: String(x.axis), detail: String(x.detail || '') }));
    if (d.depts) R.depts.forEach(dp => { const add = d.depts[dp.n]; if (Array.isArray(add)) add.filter(x => x && x.axis).forEach(x => { if (!dp.general.some(g => g.axis === x.axis)) dp.general.splice(Math.max(0, dp.general.length - 1), 0, { axis: String(x.axis), detail: String(x.detail || '') }); }); });
    R.aiAt = new Date().toISOString(); R.aiSrc = r.src; delete R.pagesHtml; save(); rerender(); toast(r.src === 'claude' ? 'صاغ Claude التوصيات العامة' : 'استُخدمت صياغة المحرك المحلي', 'ok');
  };
  $('#mrMail', box).onclick = async () => {
    const z = new JSZip();
    for (const d of R.depts) {
      const c = S.coordinators.find(x => x.dept === d.k); if (!c) continue; toast('قسم ' + d.n);
      const blocks = [{ html: mrDeptSummary(d), newPage: true }, ...d.teachers.map(t => ({ html: mrTeacherBlock(t, R.cfg) })), { html: mrDeptRecs(d) + mrSigs(R) }];
      const pdf = await pdfBlob(mrPaginate(blocks));
      const body = `الأستاذ/ ${c.name} المحترم — منسق ${d.n}\nالسلام عليكم ورحمة الله وبركاته،\n\nنرفق لكم صفحات قسم ${d.n} من التقرير الشامل لمتابعة أداء الأقسام على نظام قطر للتعليم (${R.cfg.monthName}).\n\nنسبة اكتمال الدروس: ${p1(d.sum.lp)}\nنسبة اكتمال التقييمات: ${p1(d.sum.ap)}\nنسبة حل التقييمات: ${p1(d.sum.sp)}\nالمعلمون المكتملون: ${d.teachers.filter(t => t.ok).length} من ${d.teachers.length}\n\nنأمل متابعة التوصيات الواردة مع معلمي القسم.\n\n${S.settings.coordinator}\nمنسق المشاريع الإلكترونية`;
      z.file('مسودة_قسم_' + safeName(d.n) + '.eml', await buildEml({ to: c.email, cc: S.settings.deputyEmail, subject: `التقرير الشامل لمتابعة أداء الأقسام — قسم ${d.n} — ${R.cfg.monthName}`, body, attachments: [{ name: 'تقرير_قسم_' + safeName(d.n) + '.pdf', blob: pdf }] }));
    }
    saveFile(await z.generateAsync({ type: 'blob' }), 'مسودات_التقرير_الشامل_للأقسام_' + AR_MONTHS[mm - 1] + '.zip');
  };
  // المحرر المنظم
  const ed = $('#mrEd', box);
  const window_open = window.__mrOpen = window.__mrOpen || {};
  ed.innerHTML = `<div class="seg" id="mrSeg">${[['depts', 'الأقسام والمعلمون'], ['school', 'توصيات المدرسة'], ['hon', 'التكريم']].map(([k, l]) => `<button data-k="${k}" aria-selected="${(window.__mrEdTab || 'depts') === k}">${l}</button>`).join('')}</div><div id="mrEdBody"></div>`;
  $$('#mrSeg button', ed).forEach(b => b.onclick = () => { window.__mrEdTab = b.dataset.k; rerender(); });
  const body = $('#mrEdBody', ed); const etab = window.__mrEdTab || 'depts';
  const commit = () => { delete R.pagesHtml; save(); };
  if (etab === 'depts') {
    body.innerHTML = R.depts.map((d, di) => `<details ${window_open[d.k] ? 'open' : ''} data-dk="${d.k}" class="card" style="margin-bottom:8px;padding:10px 14px"><summary class="row" style="cursor:pointer"><b>${esc(d.n)}</b><span class="chip">${d.teachers.filter(t => t.ok).length}/${d.teachers.length} مكتمل</span><span class="chip">دروس ${p1(d.sum.lp)}</span><span class="chip">تقييمات ${p1(d.sum.ap)}</span><span class="chip">حل ${p1(d.sum.sp)}</span></summary>
      <div class="list" style="margin-top:10px">${d.teachers.map((t, ti) => `<div class="item ${t.ok ? 'stripe-ok' : 'stripe-bad'}"><div class="grow"><div class="row"><b class="small">${esc(t.name)}</b><span class="small muted">${secList(t.sections)}</span><label class="row small" style="margin-inline-start:auto"><input type="checkbox" data-tok="${di}|${ti}" ${t.ok ? 'checked' : ''}> مكتمل</label></div>${t.ok ? `<textarea class="inp" data-tth="${di}|${ti}" style="min-height:56px;margin-top:6px">${esc(t.thanks)}</textarea>` : `<textarea class="inp" data-trc="${di}|${ti}" style="min-height:${40 + t.recs.length * 22}px;margin-top:6px" placeholder="التوصية | التفاصيل — سطر لكل توصية">${esc(t.recs.map(r => r.type + ' | ' + r.detail).join('\n'))}</textarea>`}</div></div>`).join('')}</div>
      <div class="field" style="margin-top:10px"><label>جدول التوصيات الخاصة بالقسم (نوع التوصية | التفاصيل)</label><textarea class="inp" data-drc="${di}" style="min-height:110px">${esc(d.deptRecs.map(r => r.type + ' | ' + r.detail).join('\n'))}</textarea></div>
      <div class="field" style="margin-top:8px"><label>التوصيات العامة على مستوى القسم (المحور | التفاصيل)</label><textarea class="inp" data-dgn="${di}" style="min-height:110px">${esc(d.general.map(r => r.axis + ' | ' + r.detail).join('\n'))}</textarea></div></details>`).join('');
    $$('details[data-dk]', body).forEach(x => x.ontoggle = () => { window_open[x.dataset.dk] = x.open; });
    const pairs = v => v.split('\n').map(l => l.split('|')).filter(a => a[0].trim()).map(a => [a[0].trim(), a.slice(1).join('|').trim()]);
    $$('[data-trc]', body).forEach(a => a.onchange = () => { const [di, ti] = a.dataset.trc.split('|').map(Number); R.depts[di].teachers[ti].recs = pairs(a.value).map(([type, detail]) => ({ type, detail })); commit(); });
    $$('[data-tth]', body).forEach(a => a.onchange = () => { const [di, ti] = a.dataset.tth.split('|').map(Number); R.depts[di].teachers[ti].thanks = a.value; commit(); });
    $$('[data-tok]', body).forEach(c => c.onchange = () => { const [di, ti] = c.dataset.tok.split('|').map(Number); const t = R.depts[di].teachers[ti]; t.ok = c.checked; if (t.ok && !t.thanks) t.thanks = mrThanks(t.name, R.cfg); commit(); rerender(); });
    $$('[data-drc]', body).forEach(a => a.onchange = () => { R.depts[+a.dataset.drc].deptRecs = pairs(a.value).map(([type, detail]) => ({ type, detail })); commit(); });
    $$('[data-dgn]', body).forEach(a => a.onchange = () => { R.depts[+a.dataset.dgn].general = pairs(a.value).map(([axis, detail]) => ({ axis, detail })); commit(); });
  }
  if (etab === 'school') {
    body.innerHTML = `<div class="tbl-wrap"><table class="t"><tr><th>م</th><th>الأولوية</th><th>محور التوصية</th><th>التفاصيل والإجراءات المقترحة</th><th></th></tr>${R.school.map((r, i) => `<tr><td>${i + 1}</td><td><select class="inp" data-sp="${i}" style="width:96px">${Object.keys(PRIO).map(p => `<option ${p === r.prio ? 'selected' : ''}>${p}</option>`).join('')}</select></td><td><input class="inp" data-sa="${i}" value="${esc(r.axis)}"></td><td><textarea class="inp" data-sd="${i}" style="min-height:64px">${esc(r.detail)}</textarea></td><td><button class="btn sm danger" data-sx="${i}">حذف</button></td></tr>`).join('')}</table></div><button class="btn sm" id="sAdd" style="margin-top:8px">إضافة توصية</button>`;
    $$('[data-sp]', body).forEach(x => x.onchange = () => { R.school[+x.dataset.sp].prio = x.value; commit(); });
    $$('[data-sa]', body).forEach(x => x.onchange = () => { R.school[+x.dataset.sa].axis = x.value; commit(); });
    $$('[data-sd]', body).forEach(x => x.onchange = () => { R.school[+x.dataset.sd].detail = x.value; commit(); });
    $$('[data-sx]', body).forEach(x => x.onclick = () => { R.school.splice(+x.dataset.sx, 1); commit(); rerender(); });
    $('#sAdd', body).onclick = () => { R.school.push({ prio: 'مهم', axis: '', detail: '' }); commit(); rerender(); };
  }
  if (etab === 'hon') {
    const h = R.honors;
    body.innerHTML = `<div class="grid g2"><div><div class="small b" style="margin-bottom:6px">إتقان نظام قطر للتعليم — أعلى 10 معلمين (الاسم | النسبة)</div><textarea class="inp" id="hT" style="min-height:240px">${esc(h.teachers.map(t => t.name + ' | ' + (+t.v).toFixed(2)).join('\n'))}</textarea></div>
    <div><div class="small b" style="margin-bottom:6px">أفضل الأقسام — إتقان (القسم | النسبة)</div><textarea class="inp" id="hD" style="min-height:130px">${esc(h.depts.map(d => d.n + ' | ' + (+d.v).toFixed(2)).join('\n'))}</textarea><div class="small b" style="margin:8px 0 6px">أفضل حصة إلكترونية (المعلم | التفاصيل)</div><input class="inp" id="hC" value="${esc(h.bestClass ? h.bestClass.teacher + ' | ' + h.bestClass.detail : '')}"></div>
    <div style="grid-column:1/-1"><div class="small b" style="margin-bottom:6px">الطلاب المتميزون — أعلى 10 (الاسم | الشعبة) — تبقى في هذا المتصفح فقط</div><textarea class="inp" id="hS" style="min-height:160px">${esc(h.students.map(s => s.name + ' | ' + (s.sec || '')).join('\n'))}</textarea></div></div>
    <p class="small muted">نِسب الإتقان مأخوذة من «بطاقة أداء المعلمين» في ملف المتابعة 04، ويمكن تعديلها هنا.</p>`;
    const pairs = v => v.split('\n').map(l => l.split('|').map(s => s.trim())).filter(a => a[0]);
    $('#hT', body).onchange = e => { h.teachers = pairs(e.target.value).map(a => ({ name: a[0], v: parseFloat(a[1]) || 0 })); commit(); };
    $('#hD', body).onchange = e => { h.depts = pairs(e.target.value).map(a => ({ n: a[0], v: parseFloat(a[1]) || 0 })); commit(); };
    $('#hC', body).onchange = e => { const a = e.target.value.split('|').map(s => s.trim()); h.bestClass = a[0] ? { teacher: a[0], detail: a[1] || '' } : null; commit(); };
    $('#hS', body).onchange = e => { h.students = pairs(e.target.value).map(a => ({ name: a[0], sec: a[1] || '' })); commit(); };
  }
}
function mrPreview(R, fileBase) {
  const pages = mrPages(R);
  modal({
    title: 'التقرير الشامل — معاينة وتحرير مباشر', wide: true,
    body: `<div class="banner info small">انقر على أي نص في الصفحات لتعديله مباشرة (العناوين، التفاصيل، الأرقام)، ثم اضغط «حفظ التعديلات» قبل التصدير.</div><div style="overflow:auto;background:#ece7dc;padding:14px;border-radius:8px"><div style="zoom:.8"><div class="pdoc" id="mrPvDoc" style="margin:auto">${pages.map(p => `<div class="pg mrep" contenteditable="true" spellcheck="false" style="margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);outline:none">${p}</div>`).join('')}</div></div></div>`,
    actions: [{ label: 'حفظ التعديلات', cls: 'pri', onClick: b => { R.pagesHtml = $$('#mrPvDoc .pg', b).map(p => p.innerHTML); save(); toast('حُفظت التعديلات على الصفحات', 'ok'); return false; } },
    { label: 'حفظ PDF', onClick: b => { const P = $$('#mrPvDoc .pg', b).map(p => p.innerHTML); savePdf(P, fileBase + '.pdf', { mrep: true }); return false; } },
    { label: 'تصدير Word', onClick: b => { const P = $$('#mrPvDoc .pg', b).map(p => p.innerHTML); saveFile(mrWordBlob(P), fileBase + '.doc'); return false; } }]
  });
}


(function boot(){
  document.documentElement.setAttribute('dir', 'rtl'); document.documentElement.setAttribute('lang', 'ar');
  S = loadState();
  try { const th = localStorage.getItem('hamza_theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (e) {}
  try { const m = neoSource().match(/const HEADER_IMG_SRC = '([^']+)'/); HEADER_IMG = m ? m[1] : ''; } catch (e) {}
  window.saveFile = saveFile;
  S.signatures = S.signatures || {};
  if ($('#brandIcon')) $('#brandIcon').src = window.__ICON;
  sampleCap().then(updateAiDot);
  buildNav();
  $('#menuBtn').onclick = () => $('.app').classList.toggle('nav-open');
  $('#themeBtn').onclick = toggleTheme; $('#backupBtn').onclick = () => render('settings');
  const route = () => { const x = location.hash.slice(1); if (x === 'teacher') { document.body.classList.add('solo'); render('portal'); return true; } if (MODULES.some(m => m.id === x)) { if (x !== CUR || !$('#content').children.length) render(x); return true; } return false; };
  if (!route()) render('dashboard');
  window.addEventListener('hashchange', route);
  save();
})();
</script>
