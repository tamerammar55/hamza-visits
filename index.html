<style>
@font-face{font-family:"Lusail";font-weight:300 500;font-display:swap;src:local("Lusail"),local("Lusail Regular"),local("Lusail-Regular"),url("fonts/Lusail-Regular.woff2") format("woff2"),url("fonts/Lusail-Regular.woff") format("woff"),url("fonts/Lusail-Regular.ttf") format("truetype"),url("fonts/Lusail-Regular.otf") format("opentype")}
@font-face{font-family:"Lusail";font-weight:600 900;font-display:swap;src:local("Lusail Bold"),local("Lusail-Bold"),url("fonts/Lusail-Bold.woff2") format("woff2"),url("fonts/Lusail-Bold.woff") format("woff"),url("fonts/Lusail-Bold.ttf") format("truetype"),url("fonts/Lusail-Bold.otf") format("opentype")}
/* Layout: maroon masthead band + scrollable tab rail; content column max 1240px; cards only for distinct objects (forms, charts) */
:root{
  --bg:#F6F3F2; --surface:#FFFFFF; --surface-2:#F0EAE8; --ink:#2A1B1E; --ink-2:#6E5D60; --line:#E3D9D6;
  --maroon:#7A1F2B; --maroon-2:#962B3A; --on-maroon:#FFFFFF; --gold:#C9A13B; --gold-soft:#F5ECD3; --gold-ink:#7A5C12;
  --l1:#2F7D57; --l2:#7E9F34; --l3:#C98123; --l4:#B5403A; --na:#9C9093;
  --l1-bg:#E3F1E9; --l2-bg:#EEF3DD; --l3-bg:#FAEEDB; --l4-bg:#F8E1DF; --na-bg:#EEEAEA;
  --shadow:0 1px 2px rgba(60,20,28,.06),0 4px 14px rgba(60,20,28,.06);
  --f-display:"Lusail","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-body:"Lusail","IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161112; --surface:#201819; --surface-2:#2A2022; --ink:#F2E9E7; --ink-2:#BBAAA9; --line:#3B2F31;
  --maroon:#B84A5C; --maroon-2:#CC5D6F; --on-maroon:#FFFFFF; --gold:#DDBA5E; --gold-soft:#3A3020; --gold-ink:#E9CF86;
  --l1:#55B583; --l2:#A8C65A; --l3:#E3A04B; --l4:#E06A63; --na:#8E8285;
  --l1-bg:#1D3328; --l2-bg:#2B3319; --l3-bg:#3A2C17; --l4-bg:#3D1F1D; --na-bg:#2C2526;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161112; --surface:#201819; --surface-2:#2A2022; --ink:#F2E9E7; --ink-2:#BBAAA9; --line:#3B2F31;
  --maroon:#B84A5C; --maroon-2:#CC5D6F; --on-maroon:#FFFFFF; --gold:#DDBA5E; --gold-soft:#3A3020; --gold-ink:#E9CF86;
  --l1:#55B583; --l2:#A8C65A; --l3:#E3A04B; --l4:#E06A63; --na:#8E8285;
  --l1-bg:#1D3328; --l2-bg:#2B3319; --l3-bg:#3A2C17; --l4-bg:#3D1F1D; --na-bg:#2C2526;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html{direction:rtl}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--maroon)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.35}
h2{font-size:1.35rem} h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,.kpi b{font-variant-numeric:tabular-nums}
a{color:var(--maroon-2)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* masthead */
.mast{background:var(--maroon);color:var(--on-maroon);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:3px solid var(--gold)}
.mast .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:50%;background:var(--on-maroon);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--maroon);font-family:var(--f-display);font-weight:700}
.logo img{width:100%;height:100%;object-fit:contain}
.brand{min-width:0;flex:1}
.brand h1{font-size:1.15rem;color:var(--on-maroon)}
.brand small{opacity:.85;font-size:.8rem;display:block}
.who{display:flex;align-items:center;gap:8px;font-size:.85rem;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap;line-height:1.8}
.mast .chip{background:rgba(255,255,255,.14);color:var(--on-maroon)}
.mast .chip.mode-db{background:var(--gold);color:#2A1B1E}
.yr-sel{width:auto;padding:3px 8px;font-size:.82rem;font-weight:600}
.mast .yr-sel{background:rgba(255,255,255,.14);color:var(--on-maroon);border-color:rgba(255,255,255,.4)}
.mast .yr-sel option{color:#2A1B1E;background:#fff}

.mast-in{display:flex;align-items:center;gap:12px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap;max-width:1440px;margin:0 auto}
.qs{flex:1 1 220px;max-width:320px}
.qs input{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:var(--on-maroon);padding:6px 10px}
.qs input::placeholder{color:rgba(255,255,255,.75)}
.bell{position:relative;background:transparent;border:1px solid rgba(255,255,255,.4);color:var(--on-maroon);border-radius:8px;width:38px;height:32px;display:grid;place-items:center;cursor:pointer}
.badge{position:absolute;top:-7px;left:-7px;background:var(--gold);color:#2A1B1E;border-radius:99px;font-size:.68rem;font-weight:700;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.userchip{cursor:pointer;border:0}
.layout{display:grid;grid-template-columns:256px minmax(0,1fr);max-width:1440px;margin:0 auto;align-items:start;transition:grid-template-columns .2s}
html.side-mini .layout{grid-template-columns:76px minmax(0,1fr)}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--mastH,64px));height:calc(100vh - var(--mastH,64px));height:calc(100dvh - var(--mastH,64px));display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line);z-index:5}
.side-scroll{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.side-new{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 10px;padding:11px 12px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--maroon),var(--maroon-2));color:#fff;font-weight:700;cursor:pointer;box-shadow:0 4px 12px color-mix(in srgb,var(--maroon) 30%,transparent)}
.side-new svg{color:var(--gold)}
.side-new:hover{filter:brightness(1.08)}
.side-new[aria-current="page"]{outline:2px solid var(--gold);outline-offset:2px}
.side-g{font-size:.72rem;font-weight:700;color:var(--gold-ink);padding:12px 12px 4px;white-space:nowrap}
.side-g:first-child{padding-top:2px}
.side .nav-b{position:relative;display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:10px;padding:6px 8px;font-weight:600;color:var(--ink-2);cursor:pointer;text-align:right;font-size:.92rem;width:100%;transition:background .15s,color .15s}
.side .nav-b .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);flex:none;transition:background .15s,color .15s}
.side .nav-b span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .nav-b:hover{background:var(--surface-2);color:var(--ink)}
.side .nav-b:hover .ic{background:var(--surface);color:var(--maroon-2)}
.side .nav-b[aria-current="page"]{background:color-mix(in srgb,var(--maroon) 10%,var(--surface));color:var(--maroon-2)}
.side .nav-b[aria-current="page"] .ic{background:var(--maroon);color:var(--gold)}
.side .nav-b[aria-current="page"]::before{content:"";position:absolute;right:-12px;top:8px;bottom:8px;width:4px;border-radius:4px 0 0 4px;background:var(--gold)}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.side-foot .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.side-mini-b{background:var(--surface-2);border:0;border-radius:8px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:none}
.side-mini-b:hover{color:var(--maroon-2)}
html.side-mini .side-g,html.side-mini .nav-b span.t,html.side-mini .side-new span,html.side-mini .side-foot .grow{display:none}
html.side-mini .side-g{display:block;height:1px;padding:0;margin:8px 6px;background:var(--line);font-size:0}
html.side-mini .side .nav-b{justify-content:center;padding:6px 0}
html.side-mini .side-new{padding:11px 0}
html.side-mini .side-mini-b svg{transform:scaleX(-1)}
.side-qs,.side-yr{display:none}
.burger{display:none;background:transparent;border:1px solid rgba(255,255,255,.4);color:var(--on-maroon);border-radius:8px;width:38px;height:34px;place-items:center;cursor:pointer;flex:none}
.side-bg{display:none}
.bnav{display:none}
.ws-list{display:grid;gap:10px;margin-top:12px}.ws{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface)}
.ws-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.ws-n{width:30px;height:30px;border-radius:50%;background:var(--maroon);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.ws-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px;font-size:.88rem}.ws-k{display:block;font-size:.74rem;color:var(--gold-ink);font-weight:700;margin-bottom:2px}
.imp-need{background:var(--gold-soft);border:1px solid var(--gold);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:.88rem}.imp-done{border-color:var(--l1);background:color-mix(in srgb,var(--l1-bg) 60%,var(--surface))}
.imp-drop{border:2px dashed var(--line);transition:border-color .15s,background .15s}.imp-drop.on{border-color:var(--gold);background:var(--gold-soft)}
.imp-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface-2);padding:8px 10px;border-radius:8px}.imp-bar select,.imp-bar input{width:auto;min-width:150px;flex:1 1 150px}
.imp-tbl td{vertical-align:middle}.imp-tbl select,.imp-tbl input{font-size:.82rem;padding:5px 8px}tr.imp-warn td{background:color-mix(in srgb,var(--l4-bg) 45%,transparent)}
.show-sm{display:none}
.tbl-auto{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
main#main{padding:22px max(18px,env(safe-area-inset-right,0px)) 60px max(18px,env(safe-area-inset-left,0px));min-width:0}
@media (max-width:1000px){
  .layout,html.side-mini .layout{grid-template-columns:minmax(0,1fr)}
  .burger{display:grid}
  .side{position:fixed;top:0;right:0;bottom:0;height:100%;width:min(300px,86vw);z-index:45;transform:translateX(105%);transition:transform .25s ease;box-shadow:-10px 0 30px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px)}
  html.nav-open .side{transform:none}
  html.nav-open .side-bg{display:block;position:fixed;inset:0;background:rgba(20,8,10,.45);z-index:44}
  html.side-mini .side-g{display:block;height:auto;margin:0;background:none;font-size:.72rem;padding:12px 12px 4px}
  html.side-mini .nav-b span.t,html.side-mini .side-new span,html.side-mini .side-foot .grow{display:revert}
  html.side-mini .side .nav-b{justify-content:flex-start;padding:6px 8px}
  .side-mini-b{display:none}
  .side-qs{display:block;margin-bottom:10px}
  .side-yr{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
  .side-yr select{width:100%;padding:8px 10px;font-size:.9rem}
  .side-qs input{padding:9px 10px}
  .qs{display:none}
  .side-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--maroon);color:#fff;border-bottom:3px solid var(--gold)}
  .side-head b{flex:1;font-family:var(--f-display)}
  .side-head button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
}
@media (min-width:1001px){.side-head{display:none}}
@media (max-width:760px){
  body{padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(60,20,28,.08)}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--ink-2);font-size:.68rem;font-weight:600;padding:5px 2px;cursor:pointer;min-width:0}
  .bnav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .bnav button[aria-current="page"]{color:var(--maroon-2)}
  .bnav button[aria-current="page"] svg{color:var(--maroon-2)}
  .bnav .fab{flex:none;width:54px;height:54px;margin-top:-22px;border-radius:50%;background:linear-gradient(135deg,var(--maroon),var(--maroon-2));color:#fff;justify-content:center;box-shadow:0 6px 16px color-mix(in srgb,var(--maroon) 40%,transparent);border:3px solid var(--surface)}
  .bnav .fab svg{color:var(--gold)}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .mast-in{gap:8px;padding-block:7px;flex-wrap:nowrap}
  .brand h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who{flex-wrap:nowrap;flex:none}
  .logo{width:36px;height:36px}
  .brand h1{font-size:.98rem}
  .brand small{display:none}
  .who{gap:6px}
  .who .yr-sel{display:none}
  .hide-sm{display:none}
  .show-sm{display:inline-grid}
  .userchip{padding:0;width:36px;height:34px;justify-content:center;border-radius:8px}
  .userchip{max-width:24vw;overflow:hidden;text-overflow:ellipsis}
  main#main{padding:14px 12px 30px}
  h2{font-size:1.15rem}
  .sec-head{align-items:flex-start}
  .sec-head>.row{width:100%}
  .card{padding:12px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpi{padding:10px}
  .kpi b{font-size:1.35rem}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .chart-box{height:220px}
  input,select,textarea{font-size:16px}
  .pill-tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .pill-tabs button{white-space:nowrap}
  .modal-bg{place-items:end center;padding:0}
  .modal{max-width:none;border-radius:16px 16px 0 0;max-height:92vh;max-height:92dvh;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
  .mfoot{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:var(--surface);padding-block:10px}
  .login{margin:18px auto}
  .login-banner{background:#fff;border-radius:12px;padding:10px 14px;margin-bottom:18px;text-align:center;border:1px solid var(--line)}.login-banner img{max-width:100%;height:auto;max-height:96px}
.login .hero{flex-direction:column;text-align:center}
  .ind{padding:10px}
  .seg{width:100%}
  .seg button{flex:1;min-width:0;padding:8px 4px}
  .tbl-wrap>table{min-width:600px}
  .tbl-wrap{-webkit-overflow-scrolling:touch}
}
.ntf{list-style:none;margin:0;padding:0}.ntf li{padding:8px 10px;border-right:4px solid var(--line);margin-bottom:6px;background:var(--surface-2);border-radius:6px}.ntf li.warn{border-right-color:var(--l3)}.ntf li.bad{border-right-color:var(--l4)}.ntf a{color:var(--ink);text-decoration:none;font-weight:600}
.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--mastH,67px));z-index:19}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tabs button{background:none;border:0;padding:12px 14px;font-weight:600;color:var(--ink-2);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--maroon-2);border-bottom-color:var(--gold)}
.tabs button:hover{color:var(--ink)}
main{padding-block:22px 60px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-head p{margin:2px 0 0;color:var(--ink-2);font-size:.9rem}
.eyebrow{font-size:.75rem;letter-spacing:.04em;color:var(--gold-ink);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi span{display:block;color:var(--ink-2);font-size:.8rem;font-weight:600}
.kpi b{font-family:var(--f-display);font-size:1.7rem;line-height:1.3;display:block}
.kpi small{color:var(--ink-2);font-size:.78rem}
.kpi.click{cursor:pointer;transition:border-color .15s,box-shadow .15s}.kpi.click:hover{border-color:var(--maroon-2);box-shadow:var(--shadow)}
.kpi.warn b{color:var(--l3)} .kpi.bad b{color:var(--l4)} .kpi.good b{color:var(--l1)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:600;cursor:pointer;font-size:.9rem;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--maroon-2)}
.btn.pri{background:var(--maroon);border-color:var(--maroon);color:var(--on-maroon)}
.btn.pri:hover{background:var(--maroon-2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2A1B1E}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 10px;font-size:.8rem}
.btn.danger{color:var(--l4);border-color:var(--l4)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--ink-2);min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{border-color:var(--maroon-2);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--maroon-2) 18%,transparent)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{background:var(--surface-2);font-weight:700;font-size:.8rem;color:var(--ink-2);white-space:nowrap;position:sticky;top:0}
.tbl-wrap>table{min-width:680px} .pd-st{min-width:150px}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
td.c,th.c{text-align:center}
.muted{color:var(--ink-2)} .small{font-size:.82rem}
.empty{padding:28px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:var(--r);background:var(--surface)}
.lv{display:inline-flex;align-items:center;justify-content:center;min-width:26px;padding:0 8px;border-radius:6px;font-weight:700;font-size:.78rem;line-height:1.9}
.lv1{background:var(--l1-bg);color:var(--l1)} .lv2{background:var(--l2-bg);color:var(--l2)} .lv3{background:var(--l3-bg);color:var(--l3)} .lv4{background:var(--l4-bg);color:var(--l4)} .lv0{background:var(--na-bg);color:var(--na)}
.st{font-size:.75rem}
.st-draft{background:var(--na-bg);color:var(--ink-2)} .st-planned{background:var(--gold-soft);color:var(--gold-ink)} .st-closed{background:var(--l2-bg);color:var(--l2)} .st-sent{background:var(--l1-bg);color:var(--l1)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--maroon-2);border-radius:99px}
.bar.ok>i{background:var(--l1)} .bar.mid>i{background:var(--l3)} .bar.low>i{background:var(--l4)}
/* login */
.login{max-width:880px;margin:40px auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login .hero{display:flex;gap:16px;align-items:center;margin-bottom:22px}
.login .hero .logo{width:72px;height:72px;font-size:1.4rem;border:3px solid var(--gold)}
.login h1{font-size:1.6rem;color:var(--maroon-2)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;margin-bottom:16px}
.role{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:right;cursor:pointer}
.role b{display:block;font-family:var(--f-display);font-size:1.05rem}
.role span{font-size:.8rem;color:var(--ink-2)}
.role[aria-pressed="true"]{border-color:var(--maroon-2);box-shadow:inset 0 0 0 1px var(--maroon-2);background:var(--surface-2)}
/* visit form */
.vf{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.vf aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--mastH,67px) + 60px)}
@media (max-width:960px){.vf{grid-template-columns:1fr}.vf aside{position:static;order:-1}}
.dom{margin-top:14px}
.dom-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:var(--maroon);color:var(--on-maroon);border-radius:var(--r) var(--r) 0 0}
.dom-h h3{color:var(--on-maroon);font-size:1rem}
.dom-h .chip{background:rgba(255,255,255,.18);color:var(--on-maroon)}
.ind{border:1px solid var(--line);border-top:0;background:var(--surface);padding:10px 14px}
.ind:last-child{border-radius:0 0 var(--r) var(--r)}
.ind-top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ind-t{flex:1 1 280px;min-width:0;font-weight:500}
.ind-t .k{color:var(--gold-ink);font-weight:700;margin-left:6px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);padding:6px 10px;font-size:.78rem;font-weight:700;cursor:pointer;color:var(--ink-2);border-left:1px solid var(--line);min-width:40px}
.seg button:last-child{border-left:0}
.seg button[aria-pressed="true"].b1{background:var(--l1);color:#fff} .seg button[aria-pressed="true"].b2{background:var(--l2);color:#fff}
.seg button[aria-pressed="true"].b3{background:var(--l3);color:#fff} .seg button[aria-pressed="true"].b4{background:var(--l4);color:#fff}
.seg button[aria-pressed="true"].b0{background:var(--na);color:#fff}
.ind-more{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
@media (max-width:640px){.ind-more{grid-template-columns:1fr}}
div.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--ink-2);min-width:0}div.f>label{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rbank{margin-top:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.rbank summary{cursor:pointer;padding:7px 10px;font-size:.8rem;font-weight:700;color:var(--maroon-2);display:flex;align-items:center;gap:6px;list-style:none;user-select:none}
.rbank summary::-webkit-details-marker{display:none}.rbank .rb-arr{margin-inline-start:auto;transition:transform .15s}.rbank[open] .rb-arr{transform:rotate(180deg)}
.rbank[open] summary{border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:8px 8px 0 0}
.rb-pop{max-height:420px;overflow:auto;padding:4px 8px 0}
.rb-g{font-size:.72rem;color:var(--gold-ink);font-weight:700;margin:8px 4px 2px}
.rb-it{display:flex;gap:8px;align-items:flex-start;padding:6px;border-radius:6px;font-weight:500;color:var(--ink);font-size:.84rem;cursor:pointer;line-height:1.6}
.rb-it:hover{background:var(--surface-2)}.rb-it input{width:auto;margin-top:5px;flex:none;accent-color:var(--maroon)}.rb-it span{flex:1}
.rb-it[hidden]{display:none}.rb-tags{display:block;color:var(--gold-ink);font-size:.72rem;font-weight:600;margin-top:2px}.rb-q{margin:6px 0 2px;padding:6px 10px;font-size:.84rem}.rb-morebtn{margin:4px 0;color:var(--maroon-2)}
.rb-del{border:0;background:none;color:var(--l4);cursor:pointer;font-size:1.1rem;line-height:1;padding:0 4px}
.rb-foot{position:sticky;bottom:0;background:var(--surface);padding:6px 0;border-top:1px dashed var(--line);margin-top:6px;display:flex;justify-content:flex-end}
.ind-more textarea{min-height:58px;font-size:.86rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--ink-2)}
.sum-row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.88rem}
.big-score{font-family:var(--f-display);font-size:2.2rem;line-height:1.2}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.steps a{font-size:.8rem;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);text-decoration:none;font-weight:600}
.cycle{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;counter-reset:c}
.cycle div{border-top:3px solid var(--gold);background:var(--surface);padding:10px 12px;border-radius:0 0 8px 8px;font-size:.85rem}
.cycle div b{display:block;font-family:var(--f-display);color:var(--maroon-2)}
.cycle div b::before{counter-increment:c;content:counter(c) ". ";color:var(--gold-ink)}
.heat td{text-align:center;font-weight:700;font-size:.8rem;min-width:42px}
.heat th.rot{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;height:150px;vertical-align:bottom;font-weight:500;font-size:.72rem}
.chart-box{position:relative;height:260px}
.modal-bg{position:fixed;inset:0;background:rgba(20,8,10,.5);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;max-width:760px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{margin-bottom:10px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:60;font-weight:600;max-width:calc(100% - 32px)}
.form-sheet{background:#fff;color:#111;padding:20px;border-radius:8px;border:1px solid var(--line);overflow-x:auto}
.note{background:var(--gold-soft);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:.86rem}
.pill-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pill-tabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;font-weight:600;cursor:pointer;font-size:.85rem}
.pill-tabs button[aria-pressed="true"]{background:var(--maroon);color:var(--on-maroon);border-color:var(--maroon)}
.list-plain{margin:0;padding-inline-start:18px}
.list-plain li{margin-bottom:4px}
.ref-tbl td:first-child{font-weight:700;white-space:nowrap}
.hidden-print{}
@media print{.mast,.tabs,.hidden-print,.btn{display:none!important}body{background:#fff}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const BANK = {"items": [{"d": "التخطيط", "t": "خطة الدرس متوفرة وبنودها مستكملة ومناسبة ومعلنة على منصة التعلم الإلكتروني", "s": "خطة الدرس متوفرة وبنودها مستكملة ومناسبة ومعلنة على منصة التعلم الإلكتروني", "r2": "", "r3": "يوصى بتوقيع خطة الدرس واعتمادها قبل تنفيذ الحصة، والتأكد من استيفائها جميع البنود المطلوبة على نظام قطر للتعليم.", "r4": "يوصى بإعداد خطة الدرس مستكملة البنود ورفعها في مكانها المخصص بشجرة الملفات على نظام قطر للتعليم قبل تنفيذ الحصة، مع توقيعها واعتمادها.", "g": "يوصى بإدراج خطة الدرس على نظام قطر للتعليم مستكملة البنود مع مناسبة إجراءاتها للطلاب.", "m": "خطة الدرس متوفرة ومستكملة في معظم بنودها، مع حاجة بعض البنود إلى الاستكمال."}, {"d": "التخطيط", "t": "أهداف التعلم مناسبة ودقيقة الصياغة وقابلة للقياس.", "s": "أهداف التعلم متدرجة وسليمة الصياغة وتراعي مهارات التفكير العليا", "r2": "يوصى بتضمين معيار الأداء في جميع أهداف التعلم مع الحفاظ على جودة صياغتها", "r3": "يوصى بمراجعة صياغة أهداف الدرس، وتضمين كل هدف معيار أداء محددًا قابلًا للقياس (فعل سلوكي + محتوى + معيار أداء).", "r4": "يوصى بإعادة صياغة أهداف الدرس صياغة سلوكية إجرائية قابلة للقياس تتضمن معيار أداء لكل هدف، مع مراعاة تدرجها من المستويات الدنيا إلى العليا.", "g": "يوصى بالاهتمام بحسن صياغة الأهداف ومراعاة تدرجها ووجود معيار أداء مناسب يمثل معيارا للقياس.", "m": ""}, {"d": "التخطيط", "t": "أنشطة الدرس الرئيسة واضحة ومتدرجة ومرتبطة", "s": "", "r2": "", "r3": "يوصى بتوضيح تعليمات أنشطة الدرس، وربط كل نشاط بهدف محدد، وترتيبها تدريجيًا من البسيط إلى المركب.", "r4": "يوصى بإعادة تصميم أنشطة الدرس بحيث تكون واضحة التعليمات ومرتبطة بالأهداف ومتدرجة، مع تحديد زمن ومخرج متوقع لكل نشاط.", "g": "يوصى بالمزيد من الاهتمام بوضوح أنشطة الدرس ومراعاة تدرجها مع ارتباطها بالأهداف.", "m": "أنشطة الدرس الرئيسة واضحة ومرتبطة بالأهداف في معظمها، مع حاجة بعضها إلى مزيد من التدرج."}, {"d": "التنفيذ", "t": "أهداف التعلم معروضة ويتم مناقشتها.", "s": "أهداف التعلم معروضة وتمت مناقشتها مع الطلاب بصورة مناسبة", "r2": "يوصى بالتأكد من فهم الطلاب للأهداف المعروضة وللمطلوب منهم بعد مناقشتها", "r3": "يوصى بمناقشة أهداف التعلم مع الطلاب بعد عرضها، والتحقق من فهمهم للمتوقع منهم، والعودة إليها في الغلق لقياس مدى تحققها.", "r4": "يوصى بعرض أهداف التعلم على الطلاب في بداية الحصة ومناقشتها معهم، والتحقق من فهمهم لها، والعودة إليها في الغلق.", "g": "يوصى بالتأكد من عرض الأهداف ومناقشتها مع الطلاب وتأكد المعلم من فهم الطلاب للمتوقع تحقيقه.", "m": ""}, {"d": "التنفيذ", "t": "أنشطة التمهيد مفعّلة بشكل مناسب.", "s": "التمهيد كان متميزا وأسهم في تهيئة الطلاب للدرس", "r2": "يوصى بالالتزام بالمدة الزمنية المخطط لها للتمهيد مع مراعاة مناسبته للطلاب", "r3": "يوصى باختيار تمهيد مناسب لمستوى الطلاب وموضوع الدرس، يستثير اهتمامهم ويربط خبراتهم السابقة بالتعلم الجديد، مع الالتزام بزمنه.", "r4": "يوصى بتنفيذ التمهيد وفق ما ورد في الخطة، باستخدام مدخل مشوق مناسب للطلاب ومرتبط بموضوع الدرس.", "g": "يوصى بتفعيل التمهيد كالمخطط له مع مراعاة مناسبته للطلاب", "m": ""}, {"d": "التنفيذ", "t": "محتوى الدرس، واضح، والعرض منظم، ومترابط.", "s": "", "r2": "", "r3": "يوصى بتنظيم عرض المحتوى في تسلسل منطقي، وربط كل جزء منه بالهدف الذي يخدمه.", "r4": "يوصى بإعادة تنظيم المحتوى وتقسيمه إلى أجزاء واضحة مترابطة وفق الأهداف، وتقديمه بأسلوب جاذب يحفز تفاعل الطلاب.", "g": "يوصى بالاهتمام بوضوح المحتوى وتنظيمه وارتباطه المباشر بالأهداف مع مراعاة ان يكون جذابا في الوقت نفسه ومثيرا لتفاعل الطلاب.", "m": "محتوى الدرس واضح والعرض منظم في معظم أجزائه، مع حاجة بعض المواضع إلى مزيد من الترابط."}, {"d": "التنفيذ", "t": "طرائق التدريس واستراتيجياته متنوعة وتتمحور حول الطالب.", "s": "طرائق التدريس متنوعة وفاعلة وتدعم تعلم الطلاب", "r2": "", "r3": "يوصى بتقليص الدور الإلقائي للمعلم، وتوسيع مساحة الطرائق المتمحورة حول الطالب كالتعلم التعاوني والحوار والمناقشة.", "r4": "يوصى بتوظيف طرائق تدريس متنوعة متمحورة حول الطالب (التعلم التعاوني، الحوار والمناقشة، حل المشكلات، التعلم بالاكتشاف) بما يناسب الأهداف والمحتوى.", "g": "يوصى بالمزيد من تنويع طرائق التدريس المتمحورة حول الطالب بما يدعم تعلم الطلاب.", "m": "طرائق التدريس متنوعة وتتمحور حول الطالب في معظم مراحل الدرس."}, {"d": "التنفيذ", "t": "مصادر التعلم الرئيسة والمساندة موظّفة بصورة واضحة وسليمة.", "s": "مصادر التعلم مفعلة بصورة مناسبة وداعمة لتعلم الطلاب", "r2": "يوصى بتفعيل المصدر المساند بصورة مناسبة إلى جانب المصدر الرئيس", "r3": "يوصى بتفعيل المصادر المساندة (المنصات التعليمية، المواقع الإلكترونية، المكتبة) وتوجيه الطلاب إلى الإفادة منها بما يخدم أهداف الدرس.", "r4": "يوصى بتوظيف مصادر التعلم الأساسية والمساندة توظيفًا مخططًا يخدم أهداف الدرس، وتوجيه الطلاب إلى كيفية الإفادة منها.", "g": "يوصى بمزيد من الاهتمام بتفعيل المصادر مع مراعاة تنوعها وكونها داعمة لتعلم الطلاب.", "m": ""}, {"d": "التنفيذ", "t": "الوسائل التعليميّة والتكنولوجيا موظّفة بصورة مناسبة.", "s": "", "r2": "", "r3": "يوصى بالمحافظة على حسن توظيف الوسائل التعليمية، مع تفعيل الوسائل التكنولوجية (العروض التقديمية، التطبيقات التفاعلية، المنصات الرقمية) بما يخدم أهداف الدرس.", "r4": "يوصى باختيار وسائل تعليمية وتكنولوجية متنوعة مناسبة لطبيعة الدرس، وتوظيفها في المواضع التي تخدم الأهداف، وإشراك الطلاب في استخدامها.", "g": "يوصى بمزيد من تنويع الأدوات والوسائل التعليمية والتكنولوجية وتوظيفها بصورة تدعم تعلم الطلاب.", "m": "الوسائل التعليمية موظفة بصورة جيدة، مع محدودية توظيف الوسائل التكنولوجية."}, {"d": "التنفيذ", "t": "الأسئلة الصفية ذات صياغة سليمة ومتدرجة ومثيرة للتفكير.", "s": "الأسئلة الصفية مناسبة ومتدرجة وتراعي مهارات التفكير العليا", "r2": "", "r3": "يوصى بترتيب الأسئلة الصفية تدريجيًا وفق مستويات التفكير، وتضمينها أسئلة تستهدف مهارات التفكير العليا (التحليل، التقويم، الإبداع).", "r4": "يوصى بإعداد أسئلة صفية متدرجة وفق مستويات التفكير، تتضمن أسئلة تستهدف مهارات التفكير العليا، وتوزيعها بما يناسب مستويات الطلاب.", "g": "يوصى بمراعاة طرح أسئلة تستهدف مهارات التفكير العليا مع مراعاة تدرجها ومناسبتها لمستويات الطلاب ولما تقيسه من معارف ومهارات.", "m": "الأسئلة الصفية سليمة الصياغة ومتدرجة في معظمها، مع قلة الأسئلة المثيرة لمهارات التفكير العليا."}, {"d": "التنفيذ", "t": "المادة العلمية دقيقة ومناسبة.", "s": "", "r2": "", "r3": "يوصى بمراجعة المادة العلمية قبل الحصة، ومراعاة العمق المعرفي المناسب لمستوى الطلاب والمرحلة الدراسية.", "r4": "يوصى بمراجعة المادة العلمية قبل الحصة للتحقق من دقتها وصحتها وتوافقها مع المصدر الرئيس.", "g": "يوصى بالاهتمام بالمادة العلمية ومراعاة توافقها مع المصدر الرئيس ومراعاة مدى العمق المعرفي الذي يقدم للطلاب.", "m": "المادة العلمية دقيقة ومناسبة في معظمها، مع حاجة بعض الجوانب إلى مزيد من العمق."}, {"d": "التنفيذ", "t": "الكفايات الأساسية متضمنة في السياق المعرفي للدرس", "s": "", "r2": "", "r3": "يوصى بتحديد الكفايات المستهدفة في خطة الدرس، وتصميم أنشطة تحققها بوصفها مخرجات أساسية للتعلم.", "r4": "يوصى بتضمين الكفايات الأساسية في السياق المعرفي للدرس من خلال الأنشطة والمواقف التعليمية بصورة صريحة تنعكس على مخرجات التعلم.", "g": "يوصى بتضمين الكفايات الأساسية في السياق المعرفي للدرس بحيث تنعكس إيجابا على المخرجات.", "m": "الكفايات الأساسية متضمنة في معظم مواقف الدرس."}, {"d": "التنفيذ", "t": "القيم الأساسيّة متضمنة في السياق المعرفي للدرس", "s": "يولي المعلم اهتماما بالقيم بشكل متميز", "r2": "", "r3": "يوصى بتضمين القيمة في سياق الدرس وربطها بمحتواه وبمواقف حياتية واقعية، وعدم الاكتفاء بعرضها.", "r4": "يوصى بتحديد القيمة التربوية في الخطة، وعرضها على الطلاب ومناقشتها معهم، وتضمينها في سياق الدرس.", "g": "يوصى بالاهتمام بالجانب القيمي لدى الطلاب وتفعيل القيمة التربوية ومناقشتها مع الطلاب ومحاولة ربطها بسياق الدرس قدر المستطاع.", "m": "القيم الأساسية متضمنة في سياق الدرس في معظم مواقفه."}, {"d": "التنفيذ", "t": "التكامل بين محاور المادة ومع المواد الأخرى يتم بشكل مناسب.", "s": "التكامل تم تفعيله بصورة مناسبة وداعمة لتعلم الطلاب", "r2": "يوصى بتوضيح التكامل للطلاب وعدم الاكتفاء بتفعيله فقط", "r3": "يوصى بتوظيف التكامل في مواضع محددة من الدرس، وتوضيح أوجه الترابط للطلاب وأثرها في فهم الموضوع.", "r4": "يوصى بتفعيل التكامل الأفقي مع المواد الأخرى والرأسي مع موضوعات المادة، وتوضيحه للطلاب أثناء الحصة.", "g": "يوصى بتفعيل التكامل بين المواد أو داخل المادة بصورة تدعم تعلم الطلاب مع توضيحه لهم.", "m": ""}, {"d": "التنفيذ", "t": "الفروق الفردية بين الطلبة يتم مراعاتها.", "s": "يوجد مراعاة الفروق الفردية بين الطلاب بصورة واضحة", "r2": "تتطلب مراعاة الفروق الفردية الأكاديمية إشراك كل طالب في كل نشاط، ولو بطريقة غير مباشرة؛ مثل توجيه سؤال لطالب محدد، ثم إعادة طرح إجابته على بقية الطلاب مع الاستفسار: \"من يتفق أو يختلف مع إجابة زميلكم؟\"، ويُوصى بتطبيق ذلك في جميع الأنشطة.", "r3": "تتطلب مراعاة الفروق الفردية الأكاديمية إشراك كل طالب في كل نشاط، ولو بطريقة غير مباشرة؛ مثل توجيه سؤال لطالب محدد، ثم إعادة طرح إجابته على بقية الطلاب مع الاستفسار: \"من يتفق أو يختلف مع إجابة زميلكم؟\"، ويُوصى بتطبيق ذلك في جميع الأنشطة.", "r4": "تتطلب مراعاة الفروق الفردية الأكاديمية إشراك كل طالب في كل نشاط، ولو بطريقة غير مباشرة؛ مثل توجيه سؤال لطالب محدد، ثم إعادة طرح إجابته على بقية الطلاب مع الاستفسار: \"من يتفق أو يختلف مع إجابة زميلكم؟\"، ويُوصى بتطبيق ذلك في جميع الأنشطة.", "g": "تتطلب مراعاة الفروق الفردية الأكاديمية إشراك كل طالب في كل نشاط، ولو بطريقة غير مباشرة؛ مثل توجيه سؤال لطالب محدد، ثم إعادة طرح إجابته على بقية الطلاب مع الاستفسار: \"من يتفق أو يختلف مع إجابة زميلكم؟\"، ويُوصى بتطبيق ذلك في جميع الأنشطة.", "m": ""}, {"d": "التنفيذ", "t": "غلق الدرس يتم بشكل مناسب.", "s": "", "r2": "يوصى بمزيد من العناية بغلق الدرس بما يسهم في تثبيت معارف الدرس ومهاراته", "r3": "يوصى بتنفيذ الغلق بصورة وافية تتضمن تلخيص أبرز ما تم تعلمه، والتحقق من تحقق الأهداف بأسئلة ختامية أو بطاقة خروج.", "r4": "يوصى بتخصيص الدقائق الأخيرة من الحصة لتنفيذ الغلق وفق المخطط له، والالتزام بالزمن بما يتيح تنفيذه.", "g": "يوصى بتفعيل الغلق كالمخطط له.", "m": ""}, {"d": "التقويم", "t": "أساليب التقويم (القبلي والبنائي والختامي) مناسبة ومتنوعة.", "s": "أساليب التقييم متنوعة ومناسبة", "r2": "يوصى بمزيد من التنويع في أساليب التقويم (القبلي والبنائي والختامي) ومناسبتها لمستويات الطلاب", "r3": "يوصى بتنويع أساليب التقويم (التكويني، الذاتي، تقويم الأقران) وأدواته (الأسئلة الشفهية، أوراق العمل، بطاقات الخروج) خلال مراحل الحصة.", "r4": "يوصى باختيار أساليب وأدوات تقييم متنوعة ومناسبة لمستويات الطلاب، وتوزيعها على مراحل الحصة المختلفة.", "g": "يوصى بمزيد من الاهتمام بتنويع أساليب وأدوات التقييم مع مراعاة مناسبتها لمستويات الطلاب.", "m": ""}, {"d": "التقويم", "t": "التغذية الراجعة متنوعة ومستمرة.", "s": "التغذية الراجعة متنوعة ووافية وتدعم تعلم الطلاب", "r2": "يوصى بتنويع مصادر التغذية الراجعة وزيادتها على مدار الحصة", "r3": "يوصى بتقديم تغذية راجعة لجميع الطلاب في كل مراحل الدرس، فورية ومحددة توضح جوانب القوة والتحسين.", "r4": "يوصى بتقديم تغذية راجعة فورية وبنّاءة ومستمرة على مدار الحصة، توضح للطالب نقاط قوته وجوانب التحسين وكيفية تطويرها.", "g": "يوصى بتقديم تغذية راجعة متنوعة ومستمرة ووافية على مدار الحصة وفي جميع مناشطها.", "m": "التغذية الراجعة متنوعة ومستمرة في معظم مراحل الدرس، مع محدودية تنوع مصادرها."}, {"d": "التقويم", "t": "أعمال الطلبة متابعة، ومصححة بدقة، ورقيًا، وإلكترونيًا", "s": "متابعة أعمال الطلاب تتم بصورة نموذجية", "r2": "يوصى بمتابعة جميع أعمال الطلاب وتصحيحها بدقة ورقيا وإلكترونيا", "r3": "يوصى باستكمال متابعة أعمال جميع الطلاب وتصحيحها بصورة دورية، مع تدوين تغذية راجعة مكتوبة.", "r4": "يوصى بوضع جدول دوري لمتابعة أعمال الطلاب التحريرية وتصحيحها وفق التعليمات، وتدوين تغذية راجعة مكتوبة تناسب مستوى كل طالب.", "g": "يوصى بمتابعة أعمال الطلاب التحريرية بصورة دورية مع الالتزام بالتعليمات في هذا الشأن مع منح الطلاب التغذية الراجعة المناسبة لمستوياتهم الأكاديمية.", "m": ""}, {"d": "الإدارة الصفية وبيئة التعلم", "t": "البيئة الصفيّة إيجابيّة وآمنة وداعمة للتعلُّم.", "s": "", "r2": "يوصى بتعليق أعمال للطلاب في الصف تتصف بالجودة والتعدد والتنوع", "r3": "يوصى بتطوير بيئة التعلم بتعليق أعمال متميزة ومحدثة للطلاب وعرضها بطريقة جذابة، ومتابعتها وتقديم تغذية راجعة عنها.", "r4": "يوصى بتهيئة بيئة صفية آمنة وجاذبة، وتعليق أعمال متميزة للطلاب في الصف، ومتابعتها وتقديم تغذية راجعة عنها.", "g": "يوصى بمزيد من الاهتمام بتوفير بيئة تعلم آمنة وجاذبة وداعمة لتعلم الطلاب وتعليق أعمال متميزة محدثة للطلاب في الصف مع مراعاة متابعتها من المعلم ومنح تغذية راجعة عنها وعرضها بطريقة جذابة.", "m": "البيئة الصفية إيجابية وآمنة وداعمة للتعلم، مع محدودية أعمال الطلاب المعلقة في الصف."}, {"d": "الإدارة الصفية وبيئة التعلم", "t": "إدارة أنشطة التعلُّم والمشاركات الصفيّة تتم بصورة منظمة.", "s": "", "r2": "يوصى بالحد من المشاركات الجماعية والمشاركة دون إذن", "r3": "يوصى بتنظيم مشاركات الطلاب بتطبيق قواعد واضحة ل function migrate(c){
  if(!c) return null; c=clone(c);
  if(c.years){ if(!c.activeYear) c.activeYear=Object.keys(c.years)[0]; if(!c.baseYear) c.baseYear=c.activeYear; return c; }
  const y=c.year||"2026/2027"; const yr={}; YKEYS.forEach(k=>{ if(c[k]!==undefined) yr[k]=c[k]; }); yr.year=y;
  const r={}; Object.keys(c).forEach(k=>{ if(!YKEYS.includes(k)) r[k]=c[k]; }); r.years={[y]:yr}; r.activeYear=y; r.baseYear=y; r.v=2; return r;
}

const py = p=>p.year||(S.visits[p.visitId]?vy(S.visits[p.visitId]):S.root.baseYear);

function applyYear(){
  const R=S.root; if(Array.isArray(R.th)&&R.th[0]<=4) R.th=[90,80,70]; if(!R.years[S.year]) S.year=R.activeYear;

}

function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
async function sha(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("hamza|"+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return "p:"+s}}
function toast(msg){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function modal(title,html,buttons=[]){
  const bg=document.createElement("div");bg.className="modal-bg";
  bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><div class="mb">${html}</div><div class="row mfoot" style="margin-top:14px;justify-content:flex-end"></div></div>`;
  const row=bg.querySelector(".mfoot");
  const close=()=>bg.remove();
  buttons.concat([{t:"إغلاق",cls:"ghost"}]).forEach(b=>{const x=document.createElement("button");x.className="btn "+(b.cls||"");x.textContent=b.t;x.onclick=async()=>{ if(b.fn){const r=await b.fn(bg); if(r===false) return;} close(); };row.appendChild(x)});
  bg.addEventListener("click",e=>{if(e.target===bg)close()});
  document.body.appendChild(bg); return bg;
}
function confirmBox(msg,fn,label="تأكيد"){modal("تأكيد الإجراء",`<p>${esc(msg)}</p>`,[{t:label,cls:"pri danger",fn}])}

const S = { log:[], root: migrate(DEFAULT_CFG), year:"", cfg: clone(DEFAULT_CFG), visits:{}, pd:{}, mode:"local", user:null, view:"dash", arg:null, ready:false, db:null, dl:null, cfgFromStore:false };
const LKEY="hamza-visits-v1";
function loadLocal(){ const d=lsGet(LKEY,null); if(d){ if(d.cfg){S.root=migrate(d.cfg);S.cfgFromStore=true;} S.visits=d.visits||{}; S.pd=d.pd||{}; S.log=d.log||[]; } S.year=lsGet("hamza-year",null)||S.root.activeYear; applyYear(); }
function saveLocal(){ if(S.mode!=="local") return; if(!lsSet(LKEY,{cfg:S.cfgFromStore?S.root:null,visits:S.visits,pd:S.pd,log:S.log})) toast("تعذّر الحفظ في هذا المتصفح – صدّر نسخة احتياطية"); }
async function put(kind,obj){
  obj.updatedAt=new Date().toISOString(); if(!obj.year) obj.year=S.year;
  S[kind][obj.id]=obj;
  if(S.mode==="fb"){ if(kind==="visits"){ obj.tv=(obj.status==="closed"||obj.status==="sent")&&obj.purpose!=="calib"; if(!obj.recordedByUid&&obj.recordedBy===S.user.key&&FB.udoc) obj.recordedByUid=FB.udoc.uid; }
    try{ await FB.db.collection(kind).doc(obj.id).set(clone(obj)); }catch(e){ toast(fbErr(e)); throw e; } }
  else if(S.mode==="db"){ try{ await S.db.collection(kind).doc(obj.id).set(clone(obj)); }catch(e){ handleDbErr(e); throw e; } }
  else saveLocal();
}
async function del(kind,id){
  delete S[kind][id];
  if(S.mode==="fb"){ try{ await FB.db.collection(kind).doc(id).delete(); }catch(e){ toast(fbErr(e)); } }
  else if(S.mode==="db"){ try{ await S.db.collection(kind).doc(id).delete(); }catch(e){ handleDbErr(e); } }
  else saveLocal();
}
async function saveCfg(){ splitBack(); return persistRoot(); }
async function persistRoot(){
  S.cfgFromStore=true;
  if(S.mode==="fb"){ const r=clone(S.root); delete r.accounts; delete r.pins; try{ await FB.db.doc("cfg/main").set(r); }catch(e){ toast(fbErr(e)); throw e; } }

function handleDbErr(e){

  else if(c==="quota_exceeded") toast("امتلأت سعة قاعدة البيانات – صدّر نسخة واحذف المسودات القديمة");
  else toast("تعذّر الحفظ الآن، حاول مرة أخرى");
}

function can(c){ const u=S.user; if(!u) return false; if(u.role==="admin") return true; if(c==="visit.editClosed") c="visit.editOthers"; if(c==="users.manage"&&!acctMode()&&(u.role==="principal"||u.role==="deputy")) return true; const P=(S.root.perms||DEFAULT_PERMS)[u.role]||DEFAULT_PERMS[u.role]||[]; return P.includes(c); }

function resolveAcct(a){
  const b={key:"u:"+a.u.toLowerCase(),role:a.role,name:a.name,email:a.email||"",uname:a.u};
  if(a.role==="coord"||a.role==="teacher"){
    const ts=allTeachers(); const t=ts.find(t=>t.email&&tLocal(t)===a.u.toLowerCase())||ts.find(t=>normAr(t.name)===normAr(a.name));
    if(t){ b.teacherId=t.id; b.deptId=t.deptId; b.email=t.email; }
    else { const d=S.cfg.depts.find(d=>normAr(d.name)===normAr(a.dept)); if(d) b.deptId=d.id; }

function users(){
  if(acctMode()) return ACC().filter(a=>!a.disabled).map(resolveAcct);

  S.cfg.deputies.forEach((d,i)=>u.push({key:"dp"+i,role:"deputy",name:d.name,email:d.email}));
  S.cfg.depts.forEach(d=>{const c=coordOf(d); if(c) u.push({key:"c"+d.id,role:"coord",name:c.name,email:c.email,deptId:d.id,teacherId:c.id});});
  allTeachers().forEach(t=>u.push({key:"t"+t.id,role:"teacher",name:t.name,email:t.email,deptId:t.deptId,teacherId:t.id}));

}

function canSeeTeacher(tid){ const u=S.user; if(!u) return false; if(isLead()) return true; const t=T(tid); if(!t) return false; if(u.role==="coord"&&u.deptId) return t.deptId===u.deptId; return u.teacherId===tid; }

function visitorRolesFor(u){
  if(!u) return []; const own={admin:"deputy",principal:"principal",deputy:"deputy",coord:"coord"}[u.role]; const out=[];

function nameMatch(a,b){ const A=normAr(a).split(" ").filter(Boolean), B=normAr(b).split(" ").filter(Boolean); if(!A.length||!B.length) return false; const [x,y]=A.length<=B.length?[A,B]:[B,A]; return x.length>=2&&x.every(t=>y.includes(t)); }

function myIdentity(){ const u=S.user; if(!u) return {keys:new Set(),names:[]}; const sig=u.key+"|"+S.year; if(_idc&&_idc.sig===sig) return _idc;
  const keys=new Set([u.key]), names=[u.name];
  if(u.teacherId){ keys.add("t"+u.teacherId); const t=T(u.teacherId); if(t) names.push(t.name); }
  if(u.role==="coord"&&u.deptId) keys.add("c"+u.deptId);
  if(u.role==="principal"||u.role==="admin"){ if(u.role==="principal"||nameMatch(u.name,S.cfg.principal.name)){ keys.add("p"); names.push(S.cfg.principal.name); } }
  if(u.role==="deputy"||u.role==="admin"||u.role==="principal"){ S.cfg.deputies.forEach((d,i)=>{ if(nameMatch(u.name,d.name)){ keys.add("dp"+i); names.push(d.name); } }); }
  // الحسابات القديمة لنفس الشخص (بالاسم) قبل رفع ملف المستخدمين
  ACC().forEach(a=>{ if(nameMatch(a.name,u.name)) keys.add("u:"+a.u.toLowerCase()); });

async function fbUpsertUser(acc,pass){ // ينشئ حساب الدخول (أو يتحقق منه) ثم يكتب ملف الصلاحيات
  const ca=fbCreator(); let uid;

  try{ await ca.signOut(); }catch(_){}

const FB_RULES = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() { return request.auth != null; }
    function uref() { return /databases/$(database)/documents/users/$(request.auth.uid); }
    function me() { return get(uref()).data; }
    function active() { return signedIn() && exists(uref()) && me().get('disabled', false) != true; }
    function role() { return me().role; }
    function lead() { return active() && role() in ['admin', 'principal', 'deputy']; }
    function staff() { return active() && role() in ['admin', 'principal', 'deputy', 'coord']; }
    function admin() { return active() && role() == 'admin'; }
    function coordOf(d) { return active() && role() == 'coord' && d.deptId == me().deptId; }
    function teacherOf(d) { return active() && role() == 'teacher' && d.teacherId == me().teacherId; }

    match /meta/bootstrap {
      allow read: if signedIn();
      allow create: if signedIn() && request.resource.data.by == request.auth.uid;
    }
    match /users/{uid} {
      allow read: if active() && (uid == request.auth.uid || role() != 'teacher');
      allow create: if admin() || (signedIn() && uid == request.auth.uid && request.resource.data.role == 'admin'
        && !exists(/databases/$(database)/documents/meta/bootstrap)
        && getAfter(/databases/$(database)/documents/meta/bootstrap).data.by == request.auth.uid);
      allow update, delete: if admin();
    }
    match /cfg/{doc} {
      allow read: if active();
      allow write: if staff();
    }
    match /visits/{id} {
      allow read: if lead() || coordOf(resource.data) || (teacherOf(resource.data) && resource.data.tv == true);
      allow create: if lead() || coordOf(request.resource.data);
      allow update: if lead() || coordOf(resource.data)
        || (teacherOf(resource.data) && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['reflection', 'ack', 'ackAt', 'updatedAt']));
      allow delete: if (active() && role() in ['admin', 'principal']) || (staff() && resource.data.recordedByUid == request.auth.uid);
    }
    match /pd/{id} {
      allow read: if lead() || coordOf(resource.data) || teacherOf(resource.data);
      allow create: if lead() || coordOf(request.resource.data);
      allow update: if lead() || coordOf(resource.data)
        || (teacherOf(resource.data) && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['progress', 'status', 'updatedAt']));
      allow delete: if lead() || coordOf(resource.data);
    }
    match /log/{id} {
      allow create: if active();
      allow read: if admin();
    }
  }
}`;

function termOf(iso){ const t=S.cfg.terms.find(t=>iso>=t.from&&iso<=t.to); return t?t.name:"خارج الفصول"; }
function scoreOf(v){
  const r=v.ratings||{}; let s=0,n=0; const dom=[0,0,0,0].map(()=>({s:0,n:0})); const cnt={1:0,2:0,3:0,4:0,0:0};
  IND.forEach(x=>{ const l=(r[x.i]||{}).l||0; cnt[l]++; if(l>=1&&l<=4){ s+=PTS[l]; n++; dom[x.d].s+=PTS[l]; dom[x.d].n++; } });
  return {avg:n?s/n:null, n, dom:dom.map(d=>d.n?d.s/d.n:null), cnt};
}
function labelOf(avg){ if(avg==null) return {t:"لم يُقس",c:0}; const th=S.cfg.th; if(avg>=th[0]) return {t:LABELS[0],c:1}; if(avg>=th[1]) return {t:LABELS[1],c:2}; if(avg>=th[2]) return {t:LABELS[2],c:3}; return {t:LABELS[3],c:4}; }
const counted = v=>(v.status==="closed"||v.status==="sent")&&v.purpose!=="peer"&&v.purpose!=="calib";
function inPeriod(v,per){ if(!per||per==="year") return true; return termOf(v.date)===per; }
function teacherVisits(tid,per){ return VIS().filter(v=>v.teacherId===tid&&inPeriod(v,per)&&seeV(v)).sort((a,b)=>(a.date||"").localeCompare(b.date||"")); }
function teacherAgg(tid,per,roles){
  const vs=teacherVisits(tid,per).filter(counted).filter(v=>!roles||roles.includes(v.visitorRole)); const sc=vs.map(scoreOf).filter(s=>s.avg!=null);
  const avg=sc.length?sc.reduce((a,b)=>a+b.avg,0)/sc.length:null;
  const visitors=new Set(vs.map(v=>v.visitorName));
  const rel = vs.length>=2&&visitors.size>=2?"موثوقة":vs.length?"قراءة أولية":"—";
  return {vs,avg,lab:labelOf(avg),visitors:visitors.size,rel,last:vs.length?vs[vs.length-1]:null};
}
function needRate(vs,i){ let n=0,k=0; vs.forEach(v=>{const l=((v.ratings||{})[i]||{}).l; if(l>=1&&l<=4){n++; if(l>=3)k++;}}); return n?{p:k/n*100,n}:{p:null,n:0}; }
function indAvg(vs,i){ let s=0,n=0; vs.forEach(v=>{const l=((v.ratings||{})[i]||{}).l; if(l>=1&&l<=4){s+=PTS[l];n++}}); return n?s/n:null; }
const seeV = v=>!S.user||S.user.role!=="teacher"||((v.status==="closed"||v.status==="sent")&&v.purpose!=="calib");
function scopeVisits(per){ const ids=new Set(visibleTeachers().map(t=>t.id)); return VIS().filter(v=>ids.has(v.teacherId)&&inPeriod(v,per)&&seeV(v)); }
function targetFor(role,per){ const y=S.cfg.targets[role]||0; return per&&per!=="year"?Math.ceil(y/S.cfg.terms.length):y; }

const recNorm = s=>String(s||"").replace(/^[\s\-–•]+/,"").trim();

function recRank(i){ const r=F.ratings[i]||{}; const l=r.l; const x=IND[i]; const items=[];
  const add=(t,src)=>{ t=String(t||"").trim(); if(!t||items.some(o=>o.t===t)) return; items.push({t,src,s:0,tags:[]}); };
  add(l===2?(x.r2||x.m):l===3?x.r3:l===4?x.r4:"","sug"); (OLDRECS[i]||[]).forEach(t=>add(t,"old")); ((S.cfg.recx||{})[i]||[]).forEach(t=>add(t,"cus"));
  if(l===2) add(x.r3,"alt"); if(l===3) add(x.r4,"alt"); if(l===4) add(x.r3,"alt");
  const ev=new Set(normAr(r.n||"").split(/[^ء-ي]+/).filter(w=>w.length>3).map(recStem));
  const stemsOf=t=>[...new Set(normAr(t).split(/[^ء-ي]+/).filter(w=>w.length>3).map(recStem))]; const df={}; items.forEach(o=>stemsOf(o.t).forEach(w=>{ df[w]=(df[w]||0)+1; }));
  const use={}, mine={}; Object.values(S.visits).forEach(v=>{ if(v.id===F.id) return; const q=(v.ratings||{})[i]; if(!q||!q.rec) return;
    String(q.rec).split("\n").map(recNorm).forEach(s=>{ if(!s) return; use[s]=(use[s]||0)+1; if(v.teacherId===F.teacherId&&(!mine[s]||v.date>mine[s])) mine[s]=v.date; }); });
  items.forEach(o=>{ if(o.src==="sug"){ o.s+=60; o.tags.push("مقترحة للمستوى "+l); } if(o.src==="alt") o.s+=4; if(o.src==="cus"){ o.s+=8; o.tags.push("أضافها زائر"); }
    const u=use[o.t]||0; if(u){ o.s+=Math.min(u,10)*3; o.tags.push(`استُخدمت ${u} مرة`); }
    if(ev.size){ const m=stemsOf(o.t).filter(w=>ev.has(w)&&(df[w]||0)<=Math.max(1,items.length*0.35)).length; if(m){ o.s+=m*15; o.tags.push("تطابق ما سجّلته في الأدلة"); } }
    if(mine[o.t]){ o.s+=3; o.tags.unshift(`سبق تقديمها للمعلم ${fmtD(mine[o.t])}`); } });
  return items.sort((a,b)=>b.s-a.s); }

async function saveForm(close){
  readForm();

  if(!F.date){ toast("أدخل تاريخ الزيارة"); return; }

    const s=scoreOf(F);
    if(F.purpose!=="peer"&&!s.n){ toast("قدّر مؤشرًا واحدًا على الأقل قبل الاعتماد"); return; }
    if(!F.strengths.trim()) F.strengths=compileStrengths();
    if(!F.devs.trim()) F.devs=compileDevs();
  }
  const t=T(F.teacherId);
  const v=clone(F); delete v._dirty; delete v._existing; delete v._fromPlan;
  v.deptId=t.deptId; v.term=termOf(v.date);

  if(close){ if(v.closedAt) v.editedAt=new Date().toISOString(); else v.closedAt=new Date().toISOString(); v.status="closed"; v.score=scoreOf(v).avg; }
  try{ await put("visits",v); }catch(e){ return; }

    // تحويل التوصيات إلى خطة تطوير فردية
    const due=v.nextDate||addDays(v.date,21);

    for(const w of want){ const ex=existing.find(p=>!used.has(p.id)&&p.priority===w.priority&&(w.priority||p.ind===w.ind));
      if(ex){ used.add(ex.id); Object.assign(ex,{level:w.level,text:w.text}); if(ex.status==="open"&&!ex.progress) ex.due=due; await put("pd",ex); }
      else await put("pd",{id:uid(),type:"ind",teacherId:v.teacherId,deptId:v.deptId,visitId:v.id,ind:w.ind,level:w.level,text:w.text,priority:w.priority,due,status:"open",progress:"",createdBy:S.user.key,createdAt:now}); }
    for(const p of existing){ if(used.has(p.id)) continue; if(p.status==="open"&&!(p.progress||"").trim()) await del("pd",p.id); else { p.note="لم تعد ضمن توصيات الزيارة بعد إعادة تحريرها"; await put("pd",p); } }
    for(const [pid,k] of Object.entries(v.follow||{})){ const p=S.pd[pid]; if(p){ p.follow=k; p.followVisit=v.id; if(k===4) p.status="verified"; else if(p.status==="open") p.status="prog"; await put("pd",p); } }
    logAct("اعتماد زيارة",`${t.name} – ${ROLES[v.visitorRole]} – ${fix1(scoreOf(v).avg)}`); F=null; toast("اعتُمدت الزيارة وأُنشئت خطة التطوير"); S.view="visit"; S.arg=v.id; render(); sendDialog(v);
  } else { F._dirty=false; F._existing=true; toast("حُفظت المسودة"); render(); }
}

async function saveFile(filename,data,mime){

  try{ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000); }catch(e){ toast("تعذّر التنزيل"); }

const OFF = {
  maroon:"#8E2B33", pink:"#F2DCDB", line:"#5A2A2E", soft:"#FBF3F2", gold:"#B8902F", ink:"#1E1416", gray:"#6B5E60",
  lv:{1:["#2F7D57","#E1F0E7"],2:["#6E8F27","#EDF3DC"],3:["#B9741C","#FBEBD5"],4:["#A93A34","#F7DEDC"],0:["#8A7F81","#ECE8E8"]}

function visitRef(v){ const y=String(vy(v)).replace(/\D/g,"").slice(2,4)+String(vy(v)).replace(/\D/g,"").slice(6,8); const t=T(v.teacherId)||{}; const all=Object.values(S.visits).filter(x=>vy(x)===vy(v)&&x.status!=="planned").sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||"")); const n=all.findIndex(x=>x.id===v.id)+1; return `HMZ-${y}-${String(n||all.length+1).padStart(4,"0")}`; }
function docHead(big){ const src=bannerSrc(); const h=big?84:62; if(!src) return `<div class="doc-head" style="text-align:center;padding:4px 0 8px;border-bottom:3px solid ${OFF.gold};margin-bottom:8px"><b style="font-size:16px;color:${OFF.maroon}">${esc(S.cfg.school)}</b></div>`;
  return `<div class="doc-head" style="text-align:center;padding:2px 0 6px;border-bottom:3px solid ${OFF.gold};margin-bottom:8px"><img src="${src}" height="${h}" width="${Math.round(h*6.39)}" alt="${esc(S.cfg.school)}" style="height:${h}px;width:auto;max-width:100%"></div>`; }
function formSheet(v){
  const t=T(v.teacherId)||{}; const s=scoreOf(v); const lab=labelOf(s.avg); const yr=vy(v);
  const B=`border:1px solid ${OFF.line};`;
  const td=(x="")=>`style="${B}padding:4px 6px;vertical-align:middle;${x}"`;
  const lb=(x="")=>`style="${B}padding:4px 6px;background:${OFF.pink};font-weight:bold;vertical-align:middle;${x}"`;
  const bar=(txt)=>`<table width="100%" style="border-collapse:collapse;margin-top:8px"><tr><td style="background:${OFF.maroon};color:#fff;font-weight:bold;font-size:15px;padding:5px 10px;border:1px solid ${OFF.line}">${txt}</td></tr></table>`;
  const lvTxt=k=>({1:"مستكملة<br>وفاعلة",2:"معظم<br>الأدلة",3:"بعض<br>الأدلة",4:"محدودة/<br>غير متوفرة",0:"لم<br>يُقس"}[k]);
  const head=`<tr><th ${lb("text-align:center")}>المجال</th><th ${lb("text-align:center")}>معايير الأداء</th>${[1,2,3,4,0].map(k=>`<th ${lb(`text-align:center;font-size:9.5px;line-height:1.25;white-space:normal;padding:3px 2px;color:${OFF.lv[k][0]}`)}>${lvTxt(k)}</th>`).join("")}<th ${lb("text-align:center")}>التوصيات<br><span style="font-weight:normal;font-size:10.5px">(تتضمن توجيهات لزيادة أثر الممارسات في تعلم الطلاب)</span></th></tr>`;
  const mark=(r,k)=>{ const on=r&&r.l===k; return `<td ${td(`text-align:center;font-size:14px;font-weight:bold;${on?`background:${OFF.lv[k][1]};color:${OFF.lv[k][0]}`:""}`)}>${on?"✔":""}</td>`; };
  let rows="";
  DOMAINS.forEach((dn,di)=>{ const items=IND.filter(x=>x.d===di);
    items.forEach((x,j)=>{ const r=v.ratings[x.i]; const l=r&&r.l;
      const rec = l===1?`<span style="color:${OFF.lv[1][0]}">✦ نقطة قوة: ${esc(r.rec||x.s)}</span>`:(l!=null&&l!==0)?esc(r.rec||"").replace(/\n/g,"<br>"):l===0&&r.rec?`<span style="color:${OFF.gray}">${esc(r.rec)}</span>`:"";
      rows+=`<tr style="page-break-inside:avoid"><td style="border-right:1px solid ${OFF.line};border-left:1px solid ${OFF.line};${j===0?`border-top:1px solid ${OFF.line};`:"border-top:0;"}${j===items.length-1?"":"border-bottom:0;"}background:${OFF.pink};text-align:center;font-weight:bold;font-size:12.5px;vertical-align:top;padding:4px 3px">${j===0?dn:""}</td><td ${td("font-size:11.5px;word-wrap:break-word;white-space:normal")}>${esc(x.t)}</td>${[1,2,3,4,0].map(k=>mark(r,k)).join("")}<td ${td("font-size:11px;line-height:1.45;word-wrap:break-word")}>${rec}${r&&r.n?`<div style="color:${OFF.gray};font-size:10px;margin-top:2px">الشاهد: ${esc(r.n)}</div>`:""}</td></tr>`; });
    const da=s.dom[di]; const dl=labelOf(da);
    rows+=`<tr style="page-break-inside:avoid"><td colspan="8" ${td(`background:${OFF.soft};font-size:11px;text-align:right;color:${OFF.gray}`)}>خلاصة مجال «${dn}»: <b style="color:${OFF.lv[dl.c][0]}">${da==null?"لم يُقس":`${fix1(da)} – ${dl.t}`}</b></td></tr>`;
  });
  if(v.pdr&&Object.values(v.pdr).some(x=>x!=null)) PD_ITEMS.forEach((p,k)=>{ const r={l:v.pdr[k]}; rows+=`<tr>${k===0?`<td ${td(`text-align:center;font-weight:bold;background:${OFF.pink};font-size:11px`)} rowspan="3">التنمية المهنية والتأمل الذاتي</td>`:""}<td ${td("font-size:11.5px")}>${esc(p)}</td>${[1,2,3,4,0].map(q=>mark(r.l==null?null:r,q)).join("")}${k===0?`<td ${td("font-size:11px")} rowspan="3">${esc(v.pdrec||"")}</td>`:""}</tr>`; });
  const list=txt=>{ const a=String(txt||"").split(/\n+/).map(x=>x.replace(/^\s*[-•–]\s*/,"").trim()).filter(Boolean); return a.length?a.map(x=>`<div style="margin:2px 0">• ${esc(x)}</div>`).join(""):`<span style="color:${OFF.gray}">—</span>`; };
  const tot=totPct(v);
  const others=[v.general?esc(v.general):"", v.conf&&v.conf.date?`عُقد لقاء التغذية الراجعة بتاريخ ${fmtD(v.conf.date)}${v.conf.pre?"، وسبقه لقاء قبلي لتحديد محور التركيز":""}.${v.conf.notes?" "+esc(v.conf.notes):""}`:"", tot!=null?`نسبة انشغال الطلاب بمهام التعلّم في لقطات الملاحظة: ${pct(tot)}.`:"", v.reflection?`تأمل المعلم: ${esc(v.reflection)}`:""].filter(Boolean);

const PDFK = { pxW:760, mm:{w:210,h:297,m:10} };
PDFK.hdr = 17; // ترويسة المدرسة أعلى كل صفحة
PDFK.pxH = Math.floor((PDFK.mm.h-2*PDFK.mm.m-6-PDFK.hdr)*PDFK.pxW/(PDFK.mm.w-2*PDFK.mm.m)); // يترك 6مم للتذييل
function pdfReady(){ return !!(window.html2canvas&&window.jspdf&&window.jspdf.jsPDF); }
function newPdf(){ return new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:"portrait",compress:true}); }
async function renderBlock(pdf,html,opt={}){
  // يضيف المحتوى إلى pdf بدءًا من صفحة جديدة (إلا إذا كان أول محتوى)
  const box=document.createElement("div");
  box.setAttribute("dir","rtl");
  box.style.cssText=`position:fixed;left:-30000px;top:0;width:${PDFK.pxW}px;background:#fff;color:#111;z-index:-1;padding:0;margin:0`;
  box.innerHTML=html; box.querySelectorAll(".doc-head").forEach(e=>e.remove()); document.body.appendChild(box);
  try{
    await new Promise(r=>setTimeout(r,30));
    const imgs=[...box.querySelectorAll("img")]; await Promise.all(imgs.map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;})));
    const top=box.getBoundingClientRect().top; const H=box.scrollHeight;
    const bps=new Set([H]); const forced=new Set();
    box.querySelectorAll("tr,p,table,h1,h2,h3,.pdf-blk,li").forEach(el=>{ const r=el.getBoundingClientRect(); bps.add(Math.round(r.bottom-top)); });
    box.querySelectorAll(".pdf-break").forEach(el=>{ const r=el.getBoundingClientRect(); forced.add(Math.round(r.top-top)); });
    const keeps=[]; box.querySelectorAll(".pdf-keep").forEach(el=>{ const r=el.getBoundingClientRect(); const t=Math.round(r.top-top), bt=Math.round(r.bottom-top); if(bt-t<PDFK.pxH*0.9){ keeps.push([t,bt]); bps.add(t); } });
    const sorted=[...bps].filter(x=>x>0&&x<=H&&!keeps.some(([t,bt])=>x>t+2&&x<bt-2)).sort((a,b)=>a-b); const fs=[...forced].filter(x=>x>0&&x<H).sort((a,b)=>a-b);
    const scale=opt.scale||2; const q=opt.q||0.9;
    const canvas=await window.html2canvas(box,{scale,backgroundColor:"#ffffff",useCORS:true,logging:false,windowWidth:PDFK.pxW+40});
    let y=0; let first=!opt.continueFirst;
    while(y<H-2){
      let limit=y+PDFK.pxH; let cut;
      const f=fs.find(x=>x>y+5&&x<=limit);
      if(f){ cut=f; }
      else if(limit>=H){ cut=H; }
      else { const c=sorted.filter(x=>x>y+120&&x<=limit); cut=c.length?c[c.length-1]:limit; }
      const sh=Math.max(1,Math.round((cut-y)*scale)); const pc=document.createElement("canvas"); pc.width=canvas.width; pc.height=sh;
      const ctx=pc.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,pc.width,pc.height); ctx.drawImage(canvas,0,Math.round(y*scale),canvas.width,sh,0,0,canvas.width,sh);
      if(!(first&&opt.isFirstInDoc)) pdf.addPage();
      first=false; opt.isFirstInDoc=false;
      const wmm=PDFK.mm.w-2*PDFK.mm.m; pdf.addImage(pc.toDataURL("image/jpeg",q),"JPEG",PDFK.mm.m,PDFK.mm.m+PDFK.hdr,wmm,(cut-y)*wmm/PDFK.pxW,undefined,"FAST");
      y=cut;
    }
  } finally { box.remove(); }
}
function pdfFooter(pdf,label){

  const src=bannerSrc(); const bh=14, bw=src?bh*6.39:0;
  for(let i=1;i<=n;i++){ pdf.setPage(i);
    if(src){ try{ pdf.addImage(src,/^data:image\/png/.test(src)?"PNG":"JPEG",(PDFK.mm.w-bw)/2,PDFK.mm.m-4,bw,bh,"schoolBanner","FAST"); }catch(_){} }
    pdf.setDrawColor(201,161,59); pdf.setLineWidth(0.6); pdf.line(PDFK.mm.m,PDFK.mm.m+PDFK.hdr-5,PDFK.mm.w-PDFK.mm.m,PDFK.mm.m+PDFK.hdr-5);
    pdf.setFontSize(8); pdf.setTextColor(120); pdf.text(`${i} / ${n}`,PDFK.mm.w/2,PDFK.mm.h-5,{align:"center"}); if(label) pdf.text(label,PDFK.mm.m,PDFK.mm.h-5); }

async function htmlListToPdf(blocks,label,onProg,ro){

      <td class="c">${!tea?`<select class="pd-st" data-id="${p.id}">${Object.entries(PD_ST).map(([k,v])=>`<option value="${k}" ${p.status===k?"selected":""}>${v}</option>`).join("")}</select>`:`<span class="chip st st-${p.status==="verified"||p.status==="done"?"sent":p.status==="prog"?"closed":"draft"}">${PD_ST[p.status]}</span>${p.status==="open"?` <button class="btn sm" data-mark="${p.id}">بدأت التنفيذ</button>`:""}`}</td></tr>`).join("")}</tbody></table></div></div>`}).join("") : `<div class="empty">تتكوّن الخطط الفردية تلقائيًا من توصيات المستويين الثالث والرابع والخطوة ذات الأولوية عند اعتماد أي زيارة.</div>`;
  } else if(PDT==="needs"){
    body = visibleDepts().map(d=>{ const latest=d.teachers.map(t=>teacherAgg(t.id,PER).vs).flat(); const rows=IND.map(x=>({x,...needRate(latest,x.i)})).filter(o=>o.p!=null&&o.p>0).sort((a,b)=>b.p-a.p).slice(0,5);

}

/* ============ نتائج الطلاب وربطها بالزيارات ============ */
const ASSESS=["منتصف الفصل الأول","نهاية الفصل الأول","منتصف الفصل الثاني","نهاية الفصل الثاني","النتيجة النهائية"];
const SUBJ_STEMS=[/حوسب|تكنولوج|حاسب|computing|ict/i,/اسلام|شرعي|قران/,/عربي/,/انجليز|english/i,/بدني|physical/i,/رياضيات|math/i,/اجتماع|social/i,/فنون|art/i,/مهارات|حياتي/,/علوم|science|فيزياء|كيمياء|احياء/i];
const stemIdx=n=>SUBJ_STEMS.findIndex(r=>r.test(n));
function deptForSubject(subj){ const n=normAr(subj); const si=stemIdx(n); if(si<0) return S.cfg.depts.find(d=>normAr(d.name)===n)||null; return S.cfg.depts.find(d=>stemIdx(normAr(d.name))===si)||null; }
const GRADE_W={"سابع":7,"ثامن":8,"تاسع":9,"السابع":7,"الثامن":8,"التاسع":9};
function normSection(x){ const s=String(x||"").trim(); let m=s.match(/(\d{1,2})\s*[\/\-_.]\s*(\d{1,2})/); if(m) return `${+m[1]}/${+m[2]}`;
  const w=Object.keys(GRADE_W).find(k=>s.includes(k)); m=s.match(/(\d{1,2})\s*$/); if(w&&m) return `${GRADE_W[w]}/${+m[1]}`; return s; }
const roundMax=v=>[10,15,20,25,30,40,50,60,70,80,100].find(x=>x>=v-1e-9)||Math.ceil(v);
function resultsFromRows(rows,maxIn){
  if(!rows.length) throw new Error("الملف لا يحتوي صفوفًا.");
  const keys=Object.keys(rows[0]); const find=(...w)=>{ for(const x of w){ const k=keys.find(k=>normAr(k).includes(normAr(x))); if(k) return k; } return undefined; };
  const kSec=find("الشعبه","section","الفصل","الصف"); const kSub=find("الماده","subject");
  const kAvg=find("المتوسط","التحصيل","نسبه التحصيل","average"); const kPass=find("نسبه النجاح","النجاح","pass"); const kN=find("عدد الطلاب","المختبرون","العدد");
  if(!kSec) throw new Error("لم أجد عمود الشعبة في الملف.");
  const out={};
  if(kSub&&kAvg){ // ملف مجمّع: مادة × شعبة
    rows.forEach(r=>{ const d=deptForSubject(r[kSub]); const sec=normSection(r[kSec]); const a=parseFloat(String(r[kAvg]).replace("%","")); if(!d||!sec||isNaN(a)) return;
      const p=kPass?parseFloat(String(r[kPass]).replace("%","")):null; out[d.id+"|"+sec]={deptId:d.id,section:sec,avg:a<=1?a*100:a,pass:p==null||isNaN(p)?null:(p<=1?p*100:p),n:kN?(+r[kN]||null):null}; });
  } else { // ملف طلاب عريض: عمود لكل مادة
    const subjCols=keys.filter(k=>k!==kSec&&deptForSubject(k)&&!/رقم|اسم|name|id/i.test(normAr(k)));
    if(!subjCols.length) throw new Error("لم أتعرّف على أعمدة المواد (مثل: التربية الإسلامية، الرياضيات…) أو على عمودي «المادة» و«المتوسط».");
    subjCols.forEach(col=>{ const d=deptForSubject(col); const vals=rows.map(r=>parseFloat(r[col])).filter(v=>!isNaN(v)); if(!vals.length) return; const mx=maxIn||roundMax(Math.max(...vals));
      const by={}; rows.forEach(r=>{ const v=parseFloat(r[col]); const sec=normSection(r[kSec]); if(isNaN(v)||!sec) return; (by[sec]=by[sec]||[]).push(v/mx*100); });
      Object.entries(by).forEach(([sec,a])=>{ const k=d.id+"|"+sec; const prev=out[k]; const all=(prev?prev._a:[]).concat(a); out[k]={deptId:d.id,section:sec,_a:all,avg:all.reduce((x,y)=>x+y,0)/all.length,pass:all.filter(x=>x>=50).length/all.length*100,n:all.length}; }); });
    Object.values(out).forEach(o=>delete o._a);
  }
  const list=Object.values(out); if(!list.length) throw new Error("لم تُستخرج أي نتائج صالحة من الملف."); return list;
}
async function readAllSheets(file){
  const buf=await file.arrayBuffer();
  if(/\.csv$/i.test(file.name)||!window.XLSX) return [{name:file.name,rows:await readRows(file)}];
  const wb=XLSX.read(buf,{type:"array"}); return wb.SheetNames.map(n=>({name:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:"",raw:false})})).filter(x=>x.rows.length);
}
function resultsFromBook(sheets,maxIn){ // يجرّب كل الأوراق: المجمّعة أولًا ثم ملفات الطلاب، ويدمج النتائج
  const agg=[], wide=[], errs=[];
  sheets.forEach(sh=>{ try{ const keys=Object.keys(sh.rows[0]||{}).map(normAr); const isAgg=keys.some(k=>k.includes("الماده"))&&keys.some(k=>/المتوسط|التحصيل|average/.test(k));
    const r=resultsFromRows(sh.rows,maxIn); (isAgg?agg:wide).push({name:sh.name,r}); }catch(e){ errs.push(sh.name); } });
  const pick=agg.length?agg:wide; if(!pick.length) throw new Error("لم أتعرّف على أي ورقة في الملف. المطلوب: عمود الشعبة مع عمود لكل مادة، أو الأعمدة: المادة · الشعبة · المتوسط (أو نسبة التحصيل) · نسبة النجاح.");
  const out={}; pick.forEach(x=>x.r.forEach(o=>{ out[o.deptId+"|"+o.section]=o; })); return {rows:Object.values(out),used:pick.map(x=>x.name)};
}
function resultsOf(assess){ return ((S.cfg.results||{})[assess]||{}).rows||[]; }
function teacherResult(tid,assess){ const t=T(tid); if(!t||!t.sections||!t.sections.length) return null; const secs=new Set(t.sections.map(normSection));
  const rs=resultsOf(assess).filter(r=>r.deptId===t.deptId&&secs.has(r.section)); if(!rs.length) return null;
  const w=r=>r.n||1; const W=rs.reduce((a,r)=>a+w(r),0); const avg=rs.reduce((a,r)=>a+r.avg*w(r),0)/W; const pr=rs.filter(r=>r.pass!=null); const pass=pr.length?pr.reduce((a,r)=>a+r.pass*w(r),0)/pr.reduce((a,r)=>a+w(r),0):null;
  return {avg,pass,n:rs.reduce((a,r)=>a+(r.n||0),0)||null,secs:rs.map(r=>r.section)}; }
function pearson(xs,ys){ const n=xs.length; if(n<3) return null; const mx=xs.reduce((a,b)=>a+b,0)/n, my=ys.reduce((a,b)=>a+b,0)/n; let sxy=0,sxx=0,syy=0; for(let i=0;i<n;i++){ const dx=xs[i]-mx, dy=ys[i]-my; sxy+=dx*dy; sxx+=dx*dx; syy+=dy*dy; } return sxx&&syy?sxy/Math.sqrt(sxx*syy):null; }
const rLabel=r=>r==null?"بيانات غير كافية":Math.abs(r)>=.5?(r>0?"علاقة طردية قوية":"علاقة عكسية قوية"):Math.abs(r)>=.3?(r>0?"علاقة طردية متوسطة":"علاقة عكسية متوسطة"):Math.abs(r)>=.1?"علاقة ضعيفة":"لا توجد علاقة تُذكر";
let IMP={assess:null};
function impactData(){
  const loaded=ASSESS.filter(a=>resultsOf(a).length); const assess=IMP.assess&&loaded.includes(IMP.assess)?IMP.assess:loaded[loaded.length-1]||null;
  const rows=assess?visibleTeachers().map(t=>{ const a=teacherAgg(t.id,"year",RR); const r=teacherResult(t.id,assess); return {t,a,r}; }).filter(x=>x.a.avg!=null&&x.r):[];
  return {loaded,assess,rows};
}

function teacherScore(tid){
  const vs=VIS().filter(v=>v.teacherId===tid&&counted(v)); const practice=avgOf(vs);
  const as=latestAssess(); const res=as?teacherResult(tid,as):null;
  const pds=PDS().filter(p=>p.teacherId===tid&&p.type==="ind"); const pdDone=pds.filter(p=>p.status==="done"||p.status==="verified").length; const pd=pds.length?pdDone/pds.length*100:null;
  const sup=vs.length?vs.reduce((a,v)=>a+((v.conf&&v.conf.date?1:0)+(v.status==="sent"?1:0)+(v.ack?1:0))/3,0)/vs.length*100:null;
  const W=Object.assign({},SC_DEF,S.cfg.scw||{}); const comp={practice,results:res?res.avg:null,pd};
  let tw=0,sum=0; Object.entries(comp).forEach(([k,v])=>{ if(v!=null&&W[k]>0){ tw+=W[k]; sum+=v*W[k]; } }); const index=tw?sum/tw:null;

function calibSessions(){ const by={}; VIS().filter(v=>v.calibId).forEach(v=>(by[v.calibId]=by[v.calibId]||[]).push(v)); return Object.entries(by).map(([id,vs])=>({id,vs,teacherId:vs[0].teacherId,date:vs[0].date,period:vs[0].period})).sort((a,b)=>(b.date||"").localeCompare(a.date||"")); }
function calibStats(vs){
  const done=vs.filter(v=>v.status==="closed"||v.status==="sent"); if(done.length<2) return {ready:false,done};
  let pairs=0,exact=0,adj=0; const perInd=IND.map(x=>{ const ls=done.map(v=>((v.ratings||{})[x.i]||{}).l).map(l=>l>=1&&l<=4?l:null);
    const vals=ls.filter(l=>l!=null); let cons=null; if(vals.length){ const cnt={}; vals.forEach(l=>cnt[l]=(cnt[l]||0)+1); const mx=Math.max(...Object.values(cnt)); const modes=Object.keys(cnt).filter(k=>cnt[k]===mx).map(Number).sort(); cons=modes.length===1?modes[0]:Math.round(modes.reduce((a,b)=>a+b,0)/modes.length); }
    let p=0,e=0,a=0; for(let i=0;i<ls.length;i++)for(let j=i+1;j<ls.length;j++){ if(ls[i]==null||ls[j]==null) continue; p++; if(ls[i]===ls[j]) e++; if(Math.abs(ls[i]-ls[j])<=1) a++; }
    pairs+=p; exact+=e; adj+=a; const spread=vals.length?Math.max(...vals)-Math.min(...vals):null; return {x,ls,cons,spread}; });
  const ppl=done.map((v,k)=>{ let d=0,n=0; perInd.forEach(o=>{ const l=o.ls[k]; if(l!=null&&o.cons!=null){ d+=PTS[l]-PTS[o.cons]; n++; } }); return {v,bias:n?d/n:null}; });
  return {ready:true,done,perInd,ppl,exact:pairs?exact/pairs*100:null,adj:pairs?adj/pairs*100:null};
}

function readSettings(){
  const c=SD; const g=id=>$("#"+id).value;
  c.school=g("s-school"); c.principal={name:g("s-pn"),email:g("s-pe").trim()};
  $$(".s-dn").forEach(e=>c.deputies[e.dataset.i].name=e.value); $$(".s-de").forEach(e=>c.deputies[e.dataset.i].email=e.value.trim());
  $$(".s-tg").forEach(e=>c.targets[e.dataset.r]=Math.max(0,+e.value||0)); $$(".s-th").forEach(e=>c.th[e.dataset.i]=+e.value); c.feedbackHours=+g("s-fb")||48;
  $$(".s-tn").forEach(e=>c.terms[e.dataset.i].name=e.value); $$(".s-tf").forEach(e=>c.terms[e.dataset.i].from=e.value); $$(".s-tt").forEach(e=>c.terms[e.dataset.i].to=e.value);
  $$(".s-dname").forEach(e=>c.depts[e.dataset.d].name=e.value); $$(".s-dcoord").forEach(e=>c.depts[e.dataset.d].coordEmail=e.value);
  $$(".s-sup").forEach(e=>c.depts[e.dataset.d].supervisor.name=e.value); $$(".s-supe").forEach(e=>c.depts[e.dataset.d].supervisor.email=e.value.trim());
  $$(".s-tname").forEach(e=>c.depts[e.dataset.d].teachers[e.dataset.t].name=e.value); $$(".s-temail").forEach(e=>c.depts[e.dataset.d].teachers[e.dataset.t].email=e.value.trim().toLowerCase());
  $$(".s-tsec").forEach(e=>c.depts[e.dataset.d].teachers[e.dataset.t].sections=e.value.split(/[،,\s]+/).map(s=>s.trim()).filter(Boolean));
}

  <div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>العام</th><th class="c">الأقسام</th><th class="c">المعلمون</th><th class="c">الزيارات</th><th class="c">الحالة</th><th>إجراءات</th></tr></thead><tbody>
  ${ys.map(y=>{const yr=R.years[y]; const nT=(yr.depts||[]).reduce((a,d)=>a+d.teachers.length,0); const nV=all.filter(v=>vy(v)===y).length; const st=y===R.activeYear?'<span class="chip st st-sent">العام الحالي</span>':yr.archived?'<span class="chip st st-planned">مؤرشف</span>':'<span class="chip st st-closed">مفتوح</span>';
   return `<tr${y===S.year?' style="background:var(--surface-2)"':""}><td><b>${esc(y)}</b>${y===S.year?' <span class="muted small">(معروض الآن)</span>':""}</td><td class="c n">${(yr.depts||[]).length}</td><td class="c n">${nT}</td><td class="c n">${nV}</td><td class="c">${st}</td><td class="row">${y!==S.year?`<button class="btn sm" data-yopen="${esc(y)}">عرض</button>`:""}${y!==R.activeYear?`<button class="btn sm" data-yact="${esc(y)}">تعيينه العام الحالي</button>`:""}${y!==R.activeYear?`<button class="btn sm" data-yarc="${esc(y)}">${yr.archived?"إلغاء الأرشفة":"أرشفة"}</button>`:""}${y!==R.activeYear&&!nV?`<button class="btn sm danger" data-ydel="${esc(y)}">حذف</button>`:""}</td></tr>`}).join("")}
  </tbody></table></div></div>`;
}

const normAr = s=>String(s||"").replace(/[إأآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[ًٌٍَُِّْـ]/g,"").replace(/\s+/g," ").trim();
async function readRows(file){
  const buf=await file.arrayBuffer();
  if(/\.csv$/i.test(file.name)||!window.XLSX){
    if(!/\.csv$/i.test(file.name)) throw new Error("مكتبة قراءة Excel لم تُحمَّل (تحتاج اتصالًا بالإنترنت). احفظ الكشف بصيغة CSV وارفعه.");
    const txt=new TextDecoder("utf-8").decode(buf).replace(/^\ufeff/,""); const lines=txt.split(/\r?\n/).filter(l=>l.trim());
    const split=l=>{const out=[];let cur="",q=false;for(const ch of l){if(ch==='"'){q=!q;continue}if((ch===","||ch===";"||ch==="\t")&&!q){out.push(cur);cur="";continue}cur+=ch}out.push(cur);return out.map(x=>x.trim())};
    const h=split(lines[0]); return lines.slice(1).map(l=>{const c=split(l);const o={};h.forEach((k,i)=>o[k]=c[i]||"");return o;});
  }
  const wb=XLSX.read(buf,{type:"array"}); const ws=wb.Sheets[wb.SheetNames[0]]; return XLSX.utils.sheet_to_json(ws,{defval:"",raw:false});
}
function staffFromRows(rows){
  if(!rows.length) throw new Error("الملف لا يحتوي صفوفًا.");
  const keys=Object.keys(rows[0]); const find=(...w)=>keys.find(k=>w.some(x=>normAr(k).includes(normAr(x))));
  const kD=find("الماده","القسم","subject"), kS=find("الصف","الشعبه","class"), kN=find("اسم المعلم","المعلم","الاسم","name"), kE=find("البريد","mail"), kC=find("منسق");
  if(!kD||!kN) throw new Error("لم أجد عمودَي «المادة» و«اسم المعلم» في الصف الأول من الكشف.");
  const out=new Map();
  rows.forEach(r=>{ const dn=String(r[kD]||"").trim(), nm=String(r[kN]||"").replace(/\s+/g," ").trim(); if(!dn||!nm) return;
    const em=String(kE?r[kE]:"").trim().toLowerCase(); const sec=String(kS?r[kS]:"").trim(); const isC=kC&&/نعم|yes|✓|1|x/i.test(String(r[kC]||""));
    const dk=normAr(dn); if(!out.has(dk)) out.set(dk,{name:dn,teachers:new Map(),coordEmail:""}); const d=out.get(dk);
    const tk=em||normAr(nm); if(!d.teachers.has(tk)) d.teachers.set(tk,{name:nm,email:em,sections:new Set()}); if(sec) d.teachers.get(tk).sections.add(sec.replace(/^0/,""));
    if(isC) d.coordEmail=em; });
  return out;
}
function applyStaff(parsed,mode){
  // معرّفات ثابتة عبر الأعوام: بالبريد ثم بالاسم
  const byEmail={}, byName={}, deptByName={};
  Object.values(S.root.years).forEach(yr=>(yr.depts||[]).forEach(d=>{ deptByName[normAr(d.name)]=deptByName[normAr(d.name)]||d.id; d.teachers.forEach(t=>{ if(t.email) byEmail[t.email]=t.id; byName[normAr(t.name)]=t.id; }); }));
  const cur=clone(S.cfg.depts); const curIds=new Set(cur.flatMap(d=>d.teachers.map(t=>t.id))); const curBy={}; cur.forEach(d=>curBy[normAr(d.name)]=d);
  let addT=0, addD=0; const res=mode==="replace"?[]:cur;
  parsed.forEach((pd,dk)=>{
    let d=mode==="replace"?null:curBy[dk];
    if(!d){ const old=curBy[dk]; d={id:(old&&old.id)||deptByName[dk]||"d"+uid(),name:pd.name,coordEmail:(old&&old.coordEmail)||"",supervisor:(old&&old.supervisor)||{name:"",email:""},teachers:[]}; res.push(d); if(!old) addD++; }
    if(pd.coordEmail) d.coordEmail=pd.coordEmail;
    pd.teachers.forEach(t=>{ const secs=[...t.sections]; let ex=d.teachers.find(x=>(t.email&&x.email===t.email)||normAr(x.name)===normAr(t.name));
      if(ex){ ex.sections=mode==="replace"?secs:[...new Set([...(ex.sections||[]),...secs])]; if(t.email) ex.email=t.email; }
      else { const nid=(t.email&&byEmail[t.email])||byName[normAr(t.name)]||"t"+uid(); d.teachers.push({id:nid,name:t.name,email:t.email,sections:secs}); if(!curIds.has(nid)) addT++; } });
    d.teachers.forEach(x=>x.sections.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})));
  });
  // حماية المعلمين الذين لديهم زيارات في هذا العام من الحذف
  let kept=0;
  if(mode==="replace"){ const ids=new Set(res.flatMap(d=>d.teachers.map(t=>t.id))); const vis=new Set(VIS().map(v=>v.teacherId));
    cur.forEach(od=>od.teachers.forEach(t=>{ if(!ids.has(t.id)&&vis.has(t.id)){ let d=res.find(x=>x.id===od.id); if(!d){ d=Object.assign(clone(od),{teachers:[]}); res.push(d);} d.teachers.push(t); kept++; } })); }
  return {depts:res,addT,addD,kept};
}
