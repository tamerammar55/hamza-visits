// استقبال البيانات من Chrome Extension
// ============================================================
async function checkExtensionData() {
    if (typeof chrome === 'undefined' || !chrome.storage) return;

    chrome.storage.local.get(['nqExtractedData', 'nqTimestamp'], async (res) => {
        if (!res.nqExtractedData) return;

        // Only process data newer than 30 seconds
        const age = Date.now() - (res.nqTimestamp || 0);
        if (age > 30000) return;

        try {
            const payload = JSON.parse(res.nqExtractedData);
            if (payload.source !== 'extension' || !payload.groups) return;

            const groups = payload.groups;
            if (!groups.length) return;

            const confirmed = confirm(
                'تم اكتشاف ' + groups.length + ' مجموعة من Extension نورسبيس!\n' +
                groups.map(g => '• ' + g.subject + ' / ' + g.grade).join('\n') +
                '\n\nهل تريد تحليلها وإضافتها للقائمة؟'
            );
            if (!confirmed) return;

            // Clear from storage
            chrome.storage.local.remove(['nqExtractedData', 'nqTimestamp']);

            // Process each group
            for (const group of groups) {
                const lessonsData_ext     = group.lessons?.lessons     || [];
                const assignmentsData_ext = (group.assignments?.assignments || []);

                // Set global state
                lessonsData         = lessonsData_ext;
                assignmentsData     = assignmentsData_ext;
                sectionsCorrections = extractSectionsCorrections(lessonsData);

                extractedInfo = { ...DEFAULT_INFO };
                extractedInfo.subject       = group.subject;
                extractedInfo.grade         = group.grade;
                extractedInfo.starsExists   = group.lessons?.starsExists   || false;
                extractedInfo.starsEnabled  = group.lessons?.starsEnabled  || false;
                extractedInfo.starsPlayerCount = group.lessons?.starsPlayerCount || 0;

                document.getElementById('subjectInput').value = group.subject;
                document.getElementById('gradeInput').value   = group.grade;

                // Match teacher from list
                if (teachersList.length > 0) {
                    const norm = s => (s||'').replace(/\s+/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');
                    const ns = norm(group.subject);
                    const gDigits = group.grade.match(/\d+/g) || [];
                    let best = null, bestScore = 0;
                    teachersList.forEach(t => {
                        const ts = norm(t.subject || '');
                        const tD = (t.grade||'').match(/\d+/g) || [];
                        if (!ns || !ts || (!ts.includes(ns) && !ns.includes(ts))) return;
                        if (!gDigits[0] || !tD[0] || String(parseInt(gDigits[0]||0)) !== String(parseInt(tD[0]||0))) return;
                        if (gDigits[1] && tD[1] && gDigits[1] !== tD[1]) return;
                        let score = 8;
                        if (gDigits[1] && tD[1] && gDigits[1] === tD[1]) score += 8;
                        if (score > bestScore) { bestScore = score; best = t; }
                    });
                    if (best && bestScore >= 8) {
                        extractedInfo.teacher = best.teacher || '';
                        extractedInfo.email   = best.email   || '';
                        document.getElementById('teacherInput').value = best.teacher || '';
                        document.getElementById('emailInput').value   = best.email   || '';
                    }
                }

                updateInfoFromFields();

                // Add to queue
                const entry = {
                    teacher:  extractedInfo.teacher || (group.subject + ' ' + group.grade),
                    subject:  group.subject,
                    grade:    group.grade,
                    email:    extractedInfo.email || '',
                    lessonsData:      JSON.parse(JSON.stringify(lessonsData)),
                    assignmentsData:  JSON.parse(JSON.stringify(assignmentsData)),
                    sectionsCorrections: JSON.parse(JSON.stringify(sectionsCorrections)),
                    extractedInfo:    JSON.parse(JSON.stringify(extractedInfo))
                };
                teacherQueue.push(entry);
                await new Promise(r => setTimeout(r, 50));
            }

            renderQueueList();
            document.getElementById('teacherQueue').style.display = 'block';
            alert('✅ تم إضافة ' + groups.length + ' مجموعة للقائمة بنجاح!');

        } catch(e) {
            console.error('Extension data error:', e);
        }
    });
}

// بيانات JSON القادمة من أداة بايثون القديمة: قراءتها للفئة غير موثوقة (تخرج فارغة)، فلا نعتمدها
// نُسقِط ملاحظة/علامة الفئة ونحسب الحالة من التسمية + نتاجات التعلم فقط (كما في الصفحات المباشرة)
function sanitizeLegacyAssignments(list) {
    return (list || []).map(a => {
        const isCatNote = n => /^\s*الفئة/.test(n || '');
        let notes = a.notes;
        if (Array.isArray(notes)) notes = notes.filter(n => !isCatNote(n));
        else if (typeof notes === 'string') notes = notes.split(/\s*\|\s*|\n/).filter(n => n && !isCatNote(n)).join(' | ');
        // أعد فحص التسمية بقاعدة المنصة الحالية (تقييم/واجب/غلق/اختبار أو ما يقابلها بالإنجليزية)
        const normN = (a.name || '').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[\u064B-\u065F\u0640]/g,'');
        const nameOkNow = /واجب|تقييم|غلق|اختبار/.test(normN) ||
            /formative\s+assessment|weekly\s+(assignment|homework|task|quiz)|homework\s+\d|summative\s+(assessment|test|exam)|final\s+(assessment|test|exam)|closing\s+assessment/.test((a.name || '').toLowerCase());
        if (nameOkNow) {
            a = Object.assign({}, a, { namingOk: '✅', suggestedName: '' });
            if (Array.isArray(notes)) notes = notes.filter(n => !/^\s*التسمية/.test(n || ''));
            else if (typeof notes === 'string') notes = notes.split(/\s*\|\s*|\n/).filter(n => n && !/^\s*التسمية/.test(n)).join(' | ');
        }
        const hasName = a.namingOk === '✅', hasGraph = a.linkedToOutcomes === '✅';
        return Object.assign({}, a, {
            categoryOk: '✅', category: a.category || 'لم تُفحص (JSON قديم)', categoryUnverified: true,
            notes: notes,
            status: (hasName && hasGraph) ? '✅ مكتمل' : '⚠️ يحتاج مراجعة'
        });
    });
}

// استيراد ملفات JSON متعددة (Python Scraper)
// ============================================================
async function importMultiJSON(input) {
    const files = [...input.files];
    if (!files.length) return;

    const statusEl  = document.getElementById('jsonImportStatus');
    const warnEl    = document.getElementById('teachersWarning');

    // Show warning if teachers not loaded
    if (teachersList.length === 0 && warnEl) {
        warnEl.style.display = 'block';
    } else if (warnEl) {
        warnEl.style.display = 'none';
    }

    statusEl.textContent = `⏳ جاري قراءة ${files.length} ملف...`;

    let totalGroups = 0, totalAdded = 0;

    for (const file of files) {
        try {
            const text   = await file.text();
            const payload = JSON.parse(text);
            // Handle both formats: {groups:[...]} and {nq_key: {...}}
            let groups = [];
            if (payload.groups) {
                groups = payload.groups;
            } else {
                // Old format: object of nq_ keys
                groups = Object.values(payload).filter(v => v && v.subject);
            }
            totalGroups += groups.length;

            for (const g of groups) {
                if (!g.lessons && !g.assignments) continue;
                lessonsData         = (g.lessons?.lessons)         || [];
                assignmentsData     = sanitizeLegacyAssignments(g.assignments?.assignments);
                sectionsCorrections = extractSectionsCorrections(lessonsData);
                extractedInfo = { ...DEFAULT_INFO };
                extractedInfo.subject          = g.subject;
                extractedInfo.grade            = g.grade;
                extractedInfo.starsExists      = g.lessons?.starsExists      || false;
                extractedInfo.starsEnabled     = g.lessons?.starsEnabled     || false;
                extractedInfo.starsPlayerCount = g.lessons?.starsPlayerCount || 0;
                document.getElementById('subjectInput').value = g.subject;
                document.getElementById('gradeInput').value   = g.grade;
                // Match teacher — handle "الصف 09/8" vs "9/8" format differences
                if (teachersList.length > 0) {
                    const nr  = s => (s||'').replace(/\s+/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');
                    const ns  = nr(g.subject);
                    // Extract digits from grade: "الصف 09/8" → ['09','8'] → num=9, sec=8
                    const gRaw = (g.grade||'').replace(/الصف\s*/,'');
                    const gD   = gRaw.match(/\d+/g) || [];
                    const gNum = gD[0] ? String(parseInt(gD[0], 10)) : ''; // "09"→"9"
                    const gSec = gD[1] || '';

                    let best = null, bestScore = 0;
                    teachersList.forEach(t => {
                        const ts  = nr(t.subject||'');
                        const tRaw = (t.grade||'').replace(/الصف\s*/,'');
                        const tD   = tRaw.match(/\d+/g) || [];
                        const tNum = tD[0] ? String(parseInt(tD[0], 10)) : '';
                        const tSec = tD[1] || '';

                        // Subject must match
                        if (!ns || !ts || (!ts.includes(ns) && !ns.includes(ts))) return;
                        // Grade number must match
                        if (!gNum || !tNum || gNum !== tNum) return;
                        // Section must match if both present
                        if (gSec && tSec && gSec !== tSec) return;

                        let score = 8;
                        if (gSec && tSec && gSec === tSec) score += 8;
                        if (score > bestScore) { bestScore = score; best = t; }
                    });
                    if (best && bestScore >= 8) {
                        extractedInfo.teacher = best.teacher || '';
                        extractedInfo.email   = best.email   || '';
                        document.getElementById('teacherInput').value = best.teacher || '';
                        document.getElementById('emailInput').value   = best.email   || '';
                    }
                }
                updateInfoFromFields();
                // فقط أضف للقائمة إذا تمت المطابقة مع Excel
                // إذا لم تُرفع قائمة المعلمين → أضف الكل
                // إذا رُفعت ولم يتطابق → تجاهل (لا تضف)
                const teacherName = extractedInfo.teacher || g.teacherName || g.teacher || '';
                if (teachersList.length > 0 && !teacherName) {
                    // لم يُطابَق — تجاهل هذه المجموعة
                    continue;
                }

                teacherQueue.push({
                    teacher: teacherName || g.subject + ' ' + g.grade,
                    subject:g.subject, grade:g.grade, email:extractedInfo.email||'',
                    lessonsData:      JSON.parse(JSON.stringify(lessonsData)),
                    assignmentsData:  JSON.parse(JSON.stringify(assignmentsData)),
                    sectionsCorrections: JSON.parse(JSON.stringify(sectionsCorrections)),
                    extractedInfo:    JSON.parse(JSON.stringify(extractedInfo))
                });
                totalAdded++;
                await new Promise(r=>setTimeout(r,20));
            }
        } catch(e) {
            console.warn('JSON import error:', file.name, e);
        }
    }

    if (totalAdded > 0) {
        renderQueueList();
        document.getElementById('teacherQueue').style.display = 'block';
        const needsMatch = teachersList.length === 0;
        statusEl.innerHTML = `<span style="color:#155724">✅ تم استيراد ${totalAdded} مجموعة من ${files.length} ملف</span>` +
            `<br><span style="color:#856404">ℹ️ فئة التقييم لم تُفحص لأن ملفات JSON القديمة لا تحمل قراءة موثوقة لها</span>` +
            (needsMatch ? `<br><span style="color:#856404">⚠️ ارفع Excel المعلمين لمطابقة الأسماء</span>` : '');
    } else {
        statusEl.innerHTML = `<span style="color:#721c24">❌ لم يتم التعرف على البيانات — تأكد من الملفات</span>`;
    }
    input.value = '';
}

// استيراد البيانات من localStorage (Bookmarklet)
// ============================================================
function scanBrowserData() {
    const groups = {};
    for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key || !key.startsWith('nq_')) continue;
        if (key === 'nq_last') continue;
        try {
            const item = JSON.parse(localStorage.getItem(key));
            if (!item || !item.type || !item.subject) continue;
            const gKey = item.subject + '|' + item.grade;
            if (!groups[gKey]) groups[gKey] = { subject: item.subject, grade: item.grade };
            groups[gKey][item.type] = item;
        } catch(e) {}
    }
    return groups;
}

function checkBrowserData() {
    const groups  = scanBrowserData();
    const keys    = Object.keys(groups);
    const matched = keys.filter(k => groups[k].lessons && groups[k].assignments);

    const box = document.getElementById('browserImportBox');
    if (!box) return;

    if (keys.length === 0) { box.style.display = 'none'; return; }

    box.style.display = 'block';
    const summary = document.getElementById('importSummary');
    summary.innerHTML =
        '<strong>' + keys.length + '</strong> مجموعة في المتصفح ' +
        '(<span style="color:#155724">' + matched.length + ' مكتملة</span>' +
        (keys.length - matched.length > 0
            ? ' + <span style="color:#856404">' + (keys.length-matched.length) + ' ناقصة</span>' : '') + ')<br>' +
        keys.map(k => {
            const g = groups[k];
            const hasL = !!g.lessons, hasA = !!g.assignments;
            return (hasL&&hasA?'✅':'⚠️') + ' ' + g.subject + ' — ' + g.grade;
        }).join('  |  ');
}

                    var tL=e.lessonsData.length, oL=e.lessonsData.filter(function(l){return l.status==='✅ مكتمل';}).length;
                    var tA=e.assignmentsData.length, oA=e.assignmentsData.filter(function(a){return a.status==='✅ مكتمل';}).length;
                    var pL=tL?Math.round(oL/tL*100):0;
                    var bg=pL>=80?'#d4edda':pL>=60?'#fff3cd':'#f8d7da';
                    return '<tr style="background:'+bg+'"><td style="padding:6px 8px;border:1px solid #ddd">'+e.grade+'</td>' +
                        '<td style="padding:6px 8px;border:1px solid #ddd;text-align:center">'+oL+'/'+tL+'</td>' +
                        '<td style="padding:6px 8px;border:1px solid #ddd;text-align:center;font-weight:bold">'+pL+'%</td>' +
                        '<td style="padding:6px 8px;border:1px solid #ddd;text-align:center">'+oA+'/'+tA+'</td>' +
                        '<td style="padding:6px 8px;border:1px solid #ddd;text-align:center">'+(pL>=80?'✅ جيد':pL>=60?'⚠️ متابعة':'❌ تدخل')+'</td></tr>';
                }).join('') +
                '</tbody></table>';
        container.appendChild(coverEl);
        await new Promise(function(r){setTimeout(r,200);});
        await addPage(coverEl);

        // ── صفحة لكل صف ──────────────────────────────────────
        for (var ei = 0; ei < entries.length; ei++) {
            var entry = entries[ei];
            var tL = entry.lessonsData.length;
            var oL = entry.lessonsData.filter(function(l){return l.status==='✅ مكتمل';}).length;
            var tA = entry.assignmentsData.length;
            var oA = entry.assignmentsData.filter(function(a){return a.status==='✅ مكتمل';}).length;
            var pL = tL ? Math.round(oL/tL*100) : 0;
            var pA = tA ? Math.round(oA/tA*100) : 0;
            var sec = entry.sectionsCorrections.length;

            var lRowsArr = entry.lessonsData.map(function(l){
                return '<tr class="'+(l.status==='✅ مكتمل'?'row-ok':'row-warn')+'">' +
                    '<td class="c" style="font-size:10px">'+l.num+'</td>' +
                    '<td style="font-size:10px">'+l.name+'</td>' +
                    '<td class="c" style="font-size:10px">'+(l.lessonDate||'—')+(l.optional?'<br><span style="font-size:8px;color:#6a1b9a">(اختياري)</span>':'')+'</td>' +
                    '<td class="c">'+(l.orderOk===false?'❌':l.orderOk===null?'—':'✅')+'</td>' +
                    '<td class="c">'+l.image+'</td>' +
                    '<td class="c">'+l.hasLearningOutcomes+'</td>' +
                    '<td class="c">'+l.hasObjectives+'</td>' +
                    '<td class="c">'+secCountCell(l.sections)+'</td>' +
                    '<td class="c">'+l.sectionsNaming+'</td>' +
                    '<td class="c"><span class="status-badge '+(l.status==='✅ مكتمل'?'ok':'warn')+'" style="font-size:9px">'+l.status+'</span></td>' +
                    '</tr>';
            });

            // ⭐ حالة لعبة نجوم المادة
            var xi = entry.extractedInfo || {};
            var starsLabel, starsSub, starsBg, starsFg;
            if (!xi.starsExists)        { starsLabel = 'لا يوجد';   starsSub = 'نجوم المادة (قسم غير موجود)'; starsBg = '#eceff1'; starsFg = '#455a64'; }
            else if (xi.starsEnabled)   { starsLabel = 'مُفعَّلة ✅'; starsSub = 'نجوم المادة · ' + (xi.starsPlayerCount || 0) + ' لاعب'; starsBg = '#e8f5e9'; starsFg = '#155724'; }
            else                        { starsLabel = 'غير مفعّلة ❌'; starsSub = 'نجوم المادة'; starsBg = '#fdecea'; starsFg = '#b71c1c'; }
            var starsBoxHtml = '<div style="flex:1;background:'+starsBg+';border-radius:6px;padding:7px;text-align:center;"><div style="font-size:13px;font-weight:bold;color:'+starsFg+'">⭐ '+starsLabel+'</div><div style="font-size:10px;color:'+starsFg+'">'+starsSub+'</div></div>';

            var recs = [];
            if (xi.starsExists && !xi.starsEnabled) recs.push('تفعيل لعبة نجوم المادة.');
            if (pL < 80) recs.push('تصحيح '+(tL-oL)+' درساً.');
            if (pA < 80) recs.push('مراجعة '+(tA-oA)+' تقييماً.');
            if (sec > 0) recs.push('تصحيح '+sec+' قسماً (التسميات المقترحة في الصفحة التالية).');
            var catBad = entry.assignmentsData.filter(function(a){ return a.categoryOk !== '✅'; }).length;
            if (catBad > 0) recs.push('ضبط فئة '+catBad+' تقييماً على «التقييمات البنائية / الختامية».');
            if (lowSectionsText(entry.lessonsData)) recs.push(lowSectionsText(entry.lessonsData));
            if (assignCountText(entry.assignmentsData)) recs.push(assignCountText(entry.assignmentsData));
            if (recs.length === 0) recs.push('الأداء جيد.');

            var deputy  = (entry.extractedInfo && entry.extractedInfo.deputy)  || 'أ/ أحمد أبو النور';
            var manager = (entry.extractedInfo && entry.extractedInfo.manager) || 'أ/ تامر عمار';

            // ── بناء صفحات الصف مع ترقيم تلقائي: كل الدروس + التقييمات (صفحات متعددة عند الحاجة) ──
            var MAXB = 1123 - 68;   // الحد الأدنى لأسفل المحتوى داخل الصفحة (هامش سفلي)
            var st = { el: null };
            var secTitleStyle = 'font-size:11px;font-weight:bold;color:#1a2a4a;margin:6px 0 4px;border-bottom:1px solid #dee2e6;padding-bottom:3px;';
            var bottomOf = function(el) { var c = el.lastElementChild; return c ? (c.offsetTop + c.offsetHeight) : 0; };
            var waitImgs = async function(el) {
                var imgs = Array.prototype.slice.call(el.querySelectorAll('img'));
                await Promise.all(imgs.map(function(im) {
                    return (im.decode ? im.decode() : Promise.resolve()).catch(function(){});
                }));
            };
            var openPage = async function(sub) {
                var el = document.createElement('div');
                el.className = 'report-page';
                el.innerHTML = HDR +
                    '<div style="text-align:center;font-size:12px;font-weight:bold;color:#8B1A1A;margin-bottom:6px;">'+teacher+' — '+entry.grade+(sub ? ' — '+sub : '')+'</div>';
                container.innerHTML = '';
                container.appendChild(el);
                await waitImgs(el);
                st.el = el;
                return el;
            };
            var flushPage = async function() {
                await new Promise(function(r){setTimeout(r,120);});
                await addPage(st.el);
            };
            // يضيف جدولاً بصفوفه ويكمله على صفحات تالية عند الامتلاء
            var addTable = async function(title, thead, rowsArr, emptyMsg) {
                var makeWrap = function(ttl) {
                    var w = document.createElement('div');
                    w.innerHTML = '<div style="'+secTitleStyle+'">'+ttl+'</div>' +
                        '<table class="data-table" style="font-size:9px;margin-bottom:6px;">'+thead+'<tbody></tbody></table>';
                    st.el.appendChild(w);
                    return w;
                };
                if (!rowsArr.length) {
                    var w0 = document.createElement('div');
                    w0.innerHTML = '<div style="'+secTitleStyle+'">'+title+'</div><div style="font-size:10px;color:#6c757d;padding:6px;text-align:center;">'+(emptyMsg||'—')+'</div>';
                    st.el.appendChild(w0);
                    if (bottomOf(st.el) > MAXB) { st.el.removeChild(w0); await flushPage(); await openPage('تابع'); st.el.appendChild(w0); }
                    return;
                }
                var wrap = makeWrap(title), tb = wrap.querySelector('tbody');
                for (var ri = 0; ri < rowsArr.length; ri++) {
                    tb.insertAdjacentHTML('beforeend', rowsArr[ri]);
                    if (bottomOf(st.el) > MAXB) {
                        if (tb.rows.length === 1) {
                            // لا يتسع حتى عنوان الجدول + أول صف: انقل الجدول كله لصفحة جديدة
                            st.el.removeChild(wrap);
                            await flushPage(); await openPage('تابع');
                            wrap = makeWrap(title + ' (تابع)'); tb = wrap.querySelector('tbody');
                            tb.insertAdjacentHTML('beforeend', rowsArr[ri]);
                        } else {
                            tb.deleteRow(tb.rows.length - 1);
                            await flushPage(); await openPage('تابع');
                            wrap = makeWrap(title + ' (تابع)'); tb = wrap.querySelector('tbody');
                            tb.insertAdjacentHTML('beforeend', rowsArr[ri]);
                        }
                    }
                }
            };
            // يضيف كتلة HTML؛ إن لم تتسع تنتقل لصفحة جديدة
            var addBlock = async function(html) {
                var d = document.createElement('div');
                d.innerHTML = html;
                st.el.appendChild(d);
                if (bottomOf(st.el) > MAXB) {
                    st.el.removeChild(d);
                    await flushPage(); await openPage('تابع');
                    st.el.appendChild(d);
                }
            };

            // ── الصفحة الأولى: عنوان + مؤشرات + بداية جدول الدروس ──
            var firstEl = document.createElement('div');
            firstEl.className = 'report-page';
            firstEl.innerHTML = HDR +
                '<div style="text-align:center;font-size:12px;font-weight:bold;color:#8B1A1A;margin-bottom:6px;">'+teacher+' — '+entry.grade+'</div>' +
                '<div style="display:flex;gap:8px;margin-bottom:8px;">' +
                    '<div style="flex:1;background:#e8f5e9;border-radius:6px;padding:7px;text-align:center;"><div style="font-size:15px;font-weight:bold;color:#155724">'+pL+'%</div><div style="font-size:10px;color:#155724">دروس '+oL+'/'+tL+'</div></div>' +
                    '<div style="flex:1;background:#e3f2fd;border-radius:6px;padding:7px;text-align:center;"><div style="font-size:15px;font-weight:bold;color:#0d47a1">'+pA+'%</div><div style="font-size:10px;color:#0d47a1">تقييمات '+oA+'/'+tA+'</div></div>' +
                    '<div style="flex:1;background:'+(sec>0?'#fff3cd':'#e8f5e9')+';border-radius:6px;padding:7px;text-align:center;"><div style="font-size:15px;font-weight:bold;color:'+(sec>0?'#856404':'#155724')+'">'+sec+'</div><div style="font-size:10px">أقسام تصحيح</div></div>' +
                    starsBoxHtml +
                '</div>';
            container.innerHTML = '';
            container.appendChild(firstEl);
            await waitImgs(firstEl);
            st.el = firstEl;

            var lessonsThead = '<thead><tr>' +
                '<th style="width:4%">#</th><th style="width:26%">الدرس</th>' +
                '<th style="width:9%">التاريخ</th><th style="width:6%">ترتيب</th>' +
                '<th style="width:5%">صورة</th><th style="width:7%">نتاجات</th>' +
                '<th style="width:6%">أهداف</th><th style="width:5%">أقسام</th>' +
                '<th style="width:7%">تسمية</th><th style="width:15%">الحالة</th>' +
                '</tr></thead>';
            await addTable('Lessons Review — الدروس (' + tL + ')', lessonsThead, lRowsArr, 'لا توجد دروس');

            // ── التقييمات ──
            var aRowsArr = entry.assignmentsData.map(function(a) {
                var ok = a.status === '✅ مكتمل';
                return '<tr class="'+(ok?'row-ok':'row-warn')+'">' +
                    '<td class="c" style="font-size:9px">'+a.num+'</td>' +
                    '<td style="font-size:9px;max-width:120px;overflow:hidden">'+a.name+'</td>' +
                    '<td class="c" style="font-size:9px">'+a.type+'</td>' +
                    '<td class="c">'+a.namingOk+'</td>' +
                    '<td class="c">'+a.categoryOk+'</td>' +
                    '<td class="c">'+a.linkedToOutcomes+'</td>' +
                    '<td class="c"><span class="status-badge '+(ok?'ok':'warn')+'" style="font-size:8px">'+a.status+'</span></td>' +
                    ((a.suggestedName || a.categoryOk !== '✅')
                        ? '<td style="font-size:8px;color:#856404">'+(a.suggestedName || '')+(a.suggestedName && a.categoryOk !== '✅' ? '<br>' : '')+(a.categoryOk !== '✅' ? 'الفئة ← التقييمات البنائية / الختامية' : '')+'</td>'
                        : '<td></td>') +
                    '</tr>';
            });
            var assessThead = '<thead><tr>' +
                '<th style="width:4%">#</th><th style="width:30%">التقييم</th>' +
                '<th style="width:10%">النوع</th><th style="width:7%">تسمية</th>' +
                '<th style="width:7%">الفئة</th><th style="width:7%">نتاجات</th>' +
                '<th style="width:15%">الحالة</th><th style="width:20%">اقتراح</th>' +
                '</tr></thead>';
            await addTable('Assessments Review — التقييمات (' + tA + ')', assessThead, aRowsArr, 'لا توجد تقييمات مسندة');

            // ── التوصيات والتوقيعات ──
            await addBlock(
                '<div style="background:#fff8e1;border-right:4px solid #ffc107;padding:7px 10px;font-size:10px;border-radius:0 5px 5px 0;margin:6px 0 12px;">' +
                    '<strong>التوصيات:</strong> '+recs.map(function(r,i){return (i+1)+'. '+r;}).join(' — ') +
                '</div>' +
                '<div style="display:flex;justify-content:space-between;font-size:10px;margin-top:6px;">' +
                    '<div style="text-align:center;width:30%"><div>النائب الأكاديمي</div><div style="font-weight:bold">'+deputy+'</div><div style="border-top:1px dotted #999;padding-top:3px;color:#888;margin-top:14px">التوقيع</div></div>' +
                    '<div style="text-align:center;width:30%"><div>مسؤول المشاريع</div><div style="font-weight:bold">'+manager+'</div><div style="border-top:1px dotted #999;padding-top:3px;color:#888;margin-top:14px">التوقيع</div></div>' +
                    '<div style="text-align:center;width:30%"><div>معلم المادة</div><div style="font-weight:bold">'+teacher+'</div><div style="border-top:1px dotted #999;padding-top:3px;color:#888;margin-top:14px">التوقيع</div></div>' +
                '</div>');
            await flushPage();

            // ── صفحات مقترحات أسماء الأقسام لهذا الصف ───────────
            if (sec > 0) {
                var secPer = 20, secList = entry.sectionsCorrections;
                for (var si = 0; si < secList.length; si += secPer) {
                    var chunk = secList.slice(si, si + secPer);
                    var secRowsHtml = chunk.map(function(c) {
                        return '<tr class="row-warn">' +
                            '<td class="c" style="font-size:10px">'+c.lessonNum+'</td>' +
                            '<td style="font-size:9px;color:#555">'+(c.lessonName||'')+'</td>' +
                            '<td style="font-size:10px">'+c.currentName+'</td>' +
                            '<td class="c" style="font-size:9px">'+c.type+'</td>' +
                            '<td style="font-size:10px;color:#0d47a1;font-weight:bold">'+c.suggestedName+'</td>' +
                            '</tr>';
                    }).join('');
                    var secEl = document.createElement('div');
                    secEl.className = 'report-page';
                    secEl.innerHTML = HDR +
                        '<div style="text-align:center;font-size:12px;font-weight:bold;color:#8B1A1A;margin-bottom:6px;">'+teacher+' — '+entry.grade+' — مقترحات تسمية الأقسام'+(si>0?' (تابع)':'')+' ('+secList.length+' قسماً)</div>' +
                        '<div style="background:#fff8e1;border-right:4px solid #ffc107;padding:7px 10px;font-size:10px;border-radius:0 5px 5px 0;margin-bottom:10px;line-height:1.8;">' +
                            '<strong>قاعدة التسمية:</strong> يبدأ اسم القسم بنوعه ثم الموضوع: «العرض التقديمي - …» ، «نشاط تفاعلي - …» ، «الدرس المصور - …» أو «فيديو - …» ، «تقييم ختامي - …» ، «رابط إثرائي - …» ، «واجب أسبوعي [رقم] - [المادة]».' +
                        '</div>' +
                        '<table class="data-table" style="font-size:9px;"><thead><tr>' +
                            '<th style="width:5%">#</th><th style="width:22%">الدرس</th>' +
                            '<th style="width:28%">اسم القسم الحالي</th><th style="width:10%">النوع</th>' +
                            '<th style="width:35%">التسمية المقترحة</th>' +
                        '</tr></thead><tbody>'+secRowsHtml+'</tbody></table>';
                    container.innerHTML = '';
                    container.appendChild(secEl);
                    await new Promise(function(r){setTimeout(r,200);});
                    await addPage(secEl);
                }
            }
        }

        document.body.removeChild(container);
        measureStyle.remove();
        return pdf;
    } catch(e) {
        document.querySelectorAll('style[data-neo-measure]').forEach(function(x){ x.remove(); });
        console.error('buildMultiGradePdf error:', e);
        try { document.body.removeChild(container); } catch(x) {}
        return null;
    }
}

// ============================================================
// تقرير PDF مجمّع لقسم (مادة) — جميع معلميها
// ============================================================
async function buildSubjectPdf(subject, entries, dateStr) {
    const container = document.createElement('div');
    container.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:794px;background:white;direction:rtl;font-family:Arial,sans-serif;';
    document.body.appendChild(container);

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    let firstPage = true;

    async function addPage(el) {
        el.style.fontFamily = "Arial, 'Noto Sans Arabic', sans-serif";
        el.querySelectorAll('*').forEach(function(e) { e.style.fontFamily = "Arial, 'Noto Sans Arabic', sans-serif"; });
        const canvas = await html2canvas(el, {
            scale: 2, useCORS: true, backgroundColor: '#ffffff',
            width: 794, height: 1123, windowWidth: 794, windowHeight: 1123,
            onclone: function(d) {
                const s = d.createElement('style');
                s.textContent = '* { font-family: Arial, "Noto Sans Arabic", sans-serif !important; }';
                d.head.appendChild(s);
            }
        });
        if (!firstPage) pdf.addPage();
        firstPage = false;
        pdf.addImage(canvas.toDataURL('image/jpeg', 0.88), 'JPEG', 0, 0,
            pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight());
    }

    const LOGO = '<img src="' + HEADER_IMG_SRC + '" style="width:100%;max-height:72px;object-fit:contain;display:block;" alt="">';
    const HDR_DIV = '<div style="border-bottom:2px solid #8B1A1A;margin-bottom:10px;padding-bottom:6px;">' + LOGO + '</div>';

    // ── Cover page ──────────────────────────────────────────
    const totL = entries.reduce(function(s,e){return s+e.lessonsData.length;},0);
    const okL  = entries.reduce(function(s,e){return s+e.lessonsData.filter(function(l){return l.status==='✅ مكتمل';}).length;},0);
    const totA = entries.reduce(function(s,e){return s+e.assignmentsData.length;},0);
    const okA  = entries.reduce(function(s,e){return s+e.assignmentsData.filter(function(a){return a.status==='✅ مكتمل';}).length;},0);
    const pctL = totL ? Math.round(okL/totL*100) : 0;
    const pctA = totA ? Math.round(okA/totA*100) : 0;

    const tableRows = entries.map(function(e) {
        const tL = e.lessonsData.length;
        const oL = e.lessonsData.filter(function(l){return l.status==='✅ مكتمل';}).length;
        const tA = e.assignmentsData.length;
        const oA = e.assignmentsData.filter(function(a){return a.status==='✅ مكتمل';}).length;
        const pL = tL ? Math.round(oL/tL*100) : 0;
        const stars = !e.extractedInfo.starsExists ? '—' : e.extractedInfo.starsEnabled ? '✅' : '❌';
        const bg = pL >= 80 ? '#d4edda' : pL >= 60 ? '#fff3cd' : '#f8d7da';
        const status = pL >= 80 ? '✅ جيد' : pL >= 60 ? '⚠️ متابعة' : '❌ تدخل';
        return '<tr style="background:' + bg + '">' +
            '<td style="padding:5px 8px;border:1px solid #ddd">' + e.teacher + '</td>' +
            '<td style="padding:5px 8px;border:1px solid #ddd;text-align:center">' + e.grade + '</td>' +
            '<td style="padding:5px 8px;border:1px solid #ddd;text-align:center">' + oL + '/' + tL + '</td>' +
            '<td style="padding:5px 8px;border:1px solid #ddd;text-align:center;font-weight:bold">' + pL + '%</td>' +
            '<td style="padding:5px 8px;border:1px solid #ddd;text-align:center">' + oA + '/' + tA + '</td>' +
            '<td style="padding:5px 8px;border:1px solid #ddd;text-align:center">' + stars + '</td>' +
            '<td style="padding:5px 8px;border:1px solid #ddd;text-align:center">' + status + '</td>' +
            '</tr>';
    }).join('');

    const recsCover = [];
    if (pctL < 80) recsCover.push('تصحيح تسمية أقسام الدروس التي تحتاج مراجعة.');
    if (pctA < 80) recsCover.push('ربط التقييمات بنتاجات التعلم.');
    if (entries.some(function(e){return e.extractedInfo.starsExists && !e.extractedInfo.starsEnabled;}))
        recsCover.push('تفعيل نجوم المادة للمعلمين غير المفعّلة.');
    const lowSecN = entries.filter(function(e){return lowSectionLessons(e.lessonsData).length > 0;}).length;
    if (lowSecN) recsCover.push('دروس عدد الأقسام فيها أقل من 2 لدى ' + lowSecN + ' صفاً (التفاصيل في تقرير كل صف).');
    const cntBad = entries.filter(function(e){return assignCountText(e.assignmentsData);});
    if (cntBad.length) recsCover.push('عدد التقييمات المسندة خارج المطلوب (6 أو 7) في: ' + cntBad.map(function(e){return e.grade + ' (' + e.assignmentsData.length + ')';}).join('، ') + '.');
    recsCover.push('مراجعة دورية لجودة المحتوى التعليمي.');

    const coverEl = document.createElement('div');
    coverEl.className = 'report-page';
    coverEl.innerHTML = HDR_DIV +
        '<div style="text-align:center;font-size:13px;font-weight:bold;color:#8B1A1A;margin-bottom:12px;">' +
            'Subject تقرير مراجعة الجودة — ' + subject + '</div>' +

function buildCoordinatorReport(queue, dateStr) {

    const summaryHeader = [
        'المعلم', 'المادة', 'الصف', 'إجمالي الدروس', 'دروس مكتملة', '% الاكتمال',
        'إجمالي التقييمات', 'تقييمات مكتملة', '% التقييمات',
        'أقسام تحتاج تصحيح', 'نجوم المادة', 'الحالة العامة'

    const summaryRows = queue.map(entry => {
        const totalL    = entry.lessonsData.length;
        const okL       = entry.lessonsData.filter(l => l.status === '✅ مكتمل').length;
        const totalA    = entry.assignmentsData.length;

        const pctA      = totalA ? Math.round(okA / totalA * 100) : 0;

            ? (entry.extractedInfo.starsEnabled ? '✅ مفعّل' : '❌ غير مفعّل')

        const overall   = pctL >= 80 && pctA >= 80 && secIssues === 0 ? '✅ جيد' :
                          pctL >= 60 ? '⚠️ يحتاج متابعة' : '❌ يحتاج تدخل';

            totalL, okL, pctL + '%',

    return wb;

const batchFiles = { lessons: {}, assignments: {} };

function parseBatchTitle(title) {
    const parts = title.split(' - ');
    if (parts.length < 2) return null;
    const subjectGrade = parts[1].trim();
    const sgMatch = subjectGrade.match(/^(.+?)\s+(\d{1,2})(?:[\/\-_](\d+))?$/);
    const subject = sgMatch ? sgMatch[1].trim() : subjectGrade;
    const grade   = sgMatch ? 'الصف ' + parseInt(sgMatch[2]) + (sgMatch[3] ? '/' + sgMatch[3] : '') : subjectGrade;
    const key     = (subject + '_' + grade).replace(/\s+/g, '_');
    return { subject, grade, key };
}

document.getElementById('batchFilesInput').addEventListener('change', (e) => processBatchFiles([...e.target.files]));

async function processBatchFiles(files, opts) {
    opts = opts || {};
    if (!files.length) return;

    const statusEl   = document.getElementById('batchStatus');
    const matchEl    = document.getElementById('batchMatchList');
    const analyzeBtn = document.getElementById('batchAnalyzeBtn');

    statusEl.innerHTML = `⏳ جاري قراءة ${files.length} ملف...`;
    matchEl.innerHTML  = '';
    analyzeBtn.style.display = 'none';

    Object.keys(batchFiles.lessons).forEach(k => delete batchFiles.lessons[k]);
    Object.keys(batchFiles.assignments).forEach(k => delete batchFiles.assignments[k]);

    for (const file of files) {
        try {
            const text  = await readFileAsText(file);
            const doc   = new DOMParser().parseFromString(text, 'text/html');
            const title = (doc.querySelector('title')?.textContent || '').trim();
            const info  = parseBatchTitle(title);
            if (!info) continue;
            if (opts.bundle) { const idm = file.name.match(/^(\d+)_/); if (idm) info.key += '_' + idm[1]; }
            const pageType = title.split(' - ').pop().trim();
            if (pageType === 'الدروس' || pageType.includes('درس')) {
                batchFiles.lessons[info.key] = { file, ...info };
            } else if (pageType === 'التقييمات' || pageType.includes('تقييم')) {
                batchFiles.assignments[info.key] = { file, ...info };
            }
        } catch(err) { console.warn('Error reading', file.name, err); }
    }

    const allKeys = new Set([...Object.keys(batchFiles.lessons), ...Object.keys(batchFiles.assignments)]);
    const matched = [], unmatched = [];
    allKeys.forEach(key => {
        const L = batchFiles.lessons[key];
        const A = batchFiles.assignments[key];
        if (L && A) matched.push({ key, subject: L.subject, grade: L.grade, lessonFile: L.file, assignFile: A.file });
        else if (L) unmatched.push({ subject: L.subject, grade: L.grade, type: 'لا يوجد تقييمات' });
        else if (A) unmatched.push({ subject: A.subject, grade: A.grade, type: 'لا يوجد دروس' });
    });

    let html = '';
    if (matched.length) {
        html += `<div style="font-weight:bold;color:#155724;font-size:12px;margin-bottom:6px;">✅ ${matched.length} مجموعة مكتملة:</div>`;
        matched.forEach(m => { html += `<div style="background:#d4edda;border-radius:5px;padding:4px 8px;margin-bottom:3px;font-size:11px;">✅ <strong>${m.subject}</strong> — ${m.grade}</div>`; });
    }
    if (unmatched.length) {
        html += `<div style="font-weight:bold;color:#856404;font-size:12px;margin-top:6px;margin-bottom:4px;">⚠️ ${unmatched.length} غير مكتملة:</div>`;
        unmatched.forEach(u => { html += `<div style="background:#fff3cd;border-radius:5px;padding:4px 8px;margin-bottom:3px;font-size:11px;">⚠️ <strong>${u.subject}</strong> — ${u.grade} — ${u.type}</div>`; });
    }

    matchEl.innerHTML  = html;
    statusEl.innerHTML = `📊 <strong>${files.length} ملف</strong>: ${matched.length} مجموعة كاملة، ${unmatched.length} غير مكتملة`;

    if (matched.length > 0) {
        analyzeBtn.style.display = 'block';
        analyzeBtn.textContent   = `🚀 تحليل ${matched.length} مجموعة وإضافتها للقائمة`;
        analyzeBtn._matched = matched;
    }
}

// ── حزم NEO من جامع الصفحات (neo_collector.js): ملفات .neo.gz أو .json ──
async function readBundleFile(file) {
    let text;
    if (/\.gz$/i.test(file.name) || /\.neo$/i.test(file.name)) {
        if (typeof DecompressionStream === 'undefined') throw new Error('المتصفح لا يدعم فك الضغط، استخدم Chrome أو Edge حديث');
        const stream = file.stream().pipeThrough(new DecompressionStream('gzip'));
        text = await new Response(stream).text();
    } else {
        text = await readFileAsText(file);
    }
    const b = JSON.parse(text);
    if (!b || !Array.isArray(b.items)) throw new Error('ملف حزمة غير صالح: ' + file.name);
    return b.items;
}

document.getElementById('neoBundleInput').addEventListener('change', async (e) => {
    const bundles = [...e.target.files];
    if (!bundles.length) return;
    const statusEl = document.getElementById('batchStatus');
    try {
        statusEl.innerHTML = `⏳ جاري فك ${bundles.length} حزمة...`;
        const files = [];
        const pyJson = [];
        for (const bf of bundles) {
            if (/\.json$/i.test(bf.name)) {                       // JSON قديم من أداة بايثون ({groups})
                const peek = JSON.parse(await readFileAsText(bf));
                if (!Array.isArray(peek.items)) { pyJson.push(bf); continue; }
            }
            const items = await readBundleFile(bf);
            items.forEach(it => {
                files.push(new File([it.lessons.html],     `${it.id}_lessons.html`,     { type: 'text/html' }));
                files.push(new File([it.assignments.html], `${it.id}_assignments.html`, { type: 'text/html' }));
            });
        }
        if (pyJson.length) await importMultiJSON({ files: pyJson, value: '' });
        if (files.length) await processBatchFiles(files, { bundle: true });
    } catch (err) {
        statusEl.innerHTML = '❌ ' + err.message;
        console.error(err);
    }
    e.target.value = '';
});

document.getElementById('batchAnalyzeBtn').addEventListener('click', async () => {
    const btn     = document.getElementById('batchAnalyzeBtn');
    const matched = btn._matched || [];
    if (!matched.length) return;

    btn.disabled = true;

    for (let i = 0; i < matched.length; i++) {
        const m = matched[i];
        btn.textContent = `⏳ ${i + 1}/${matched.length} — ${m.subject} ${m.grade}`;

        // Load files
        const lessonsHtml     = await readFileAsText(m.lessonFile);
        const assignmentsHtml = await readFileAsText(m.assignFile);

        // Set extractedInfo
        extractedInfo = { ...DEFAULT_INFO };
        extractedInfo.subject = m.subject;
        extractedInfo.grade   = m.grade;

        // Set input fields so updateInfoFromFields() reads them
        document.getElementById('subjectInput').value = m.subject;
        document.getElementById('gradeInput').value   = m.grade;
        document.getElementById('teacherInput').value = '';
        document.getElementById('emailInput').value   = '';

        // Auto-extract from lesson file (teacher name, email)
        await autoExtractFromFile(m.lessonFile, 'lessons');

        // Match teacher from Excel list if available
        if (teachersList.length > 0) {
            const norm = s => (s||'').replace(/\s+/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');
            const ns = norm(m.subject);
            const ng = norm(m.grade);
            const gradeDigits = m.grade.match(/\d+/g) || [];
            let best = null, bestScore = 0;
            teachersList.forEach(t => {
                const ts = norm(t.subject || '');
                const tDigits = (t.grade || '').match(/\d+/g) || [];
                
                // المادة يجب أن تتطابق أولاً — شرط أساسي
                const subjectMatch = ns && ts && (ts.includes(ns) || ns.includes(ts));
                if (!subjectMatch) return; // تجاهل هذا السجل إذا المادة لا تتطابق
                
                let score = 4; // نقاط المادة
                // مطابقة رقم الصف
                if (gradeDigits[0] && tDigits[0] && String(parseInt(gradeDigits[0]||0)) === String(parseInt(tDigits[0]||0))) score += 4;
                else return; // رقم الصف لا يتطابق = تجاهل
                // الشعبة — حاسمة للتمييز بين 7/1 و7/2 و7/3
                if (gradeDigits[1] && tDigits[1]) {
                    if (gradeDigits[1] === tDigits[1]) score += 8;
                    else return; // شعبة مختلفة = استبعاد قاطع
                }
                if (score > bestScore) { bestScore = score; best = t; }
            });
            if (best && bestScore >= 2) {
                if (!document.getElementById('teacherInput').value) document.getElementById('teacherInput').value = best.teacher || '';
                if (!document.getElementById('emailInput').value)   document.getElementById('emailInput').value   = best.email   || '';
            }
        }

        updateInfoFromFields();

        // Analyze
        const currentSubjectVal = extractedInfo.subject;
        lessonsData         = analyzeLessons(lessonsHtml);
        assignmentsData     = analyzeAssignments(assignmentsHtml, currentSubjectVal);
        sectionsCorrections = extractSectionsCorrections(lessonsData);

        // Add to queue
        const entry = {
            teacher          : extractedInfo.teacher || (m.subject + ' ' + m.grade),
            subject          : extractedInfo.subject,
            grade            : extractedInfo.grade,
            email            : extractedInfo.email,
            lessonsData      : JSON.parse(JSON.stringify(lessonsData)),
            assignmentsData  : JSON.parse(JSON.stringify(assignmentsData)),
            sectionsCorrections: JSON.parse(JSON.stringify(sectionsCorrections)),
            extractedInfo    : JSON.parse(JSON.stringify(extractedInfo))
        };
        teacherQueue.push(entry);
        await new Promise(r => setTimeout(r, 100));
    }

    // Show queue
    renderQueueList();
    document.getElementById('teacherQueue').style.display = 'block';

    btn.disabled = false;
    btn.textContent = `✅ تمت إضافة ${matched.length} مجموعة للقائمة`;

    // Reset batch UI
    document.getElementById('batchStatus').innerHTML =
        `✅ <strong>${matched.length} مجموعة</strong> جاهزة — اضغط "تنزيل جميع التقارير" أو أرسل لكل معلم`;
});

const teacherQueue = [];

// ── ملاحظات إضافية: عدد الأقسام < 2، وعدد التقييمات المسندة يجب أن يكون 6 أو 7 ──
function lowSectionLessons(ld) { return (ld || []).filter(l => (Number(l.sections) || 0) < 2); }
function lowSectionsText(ld) {
    const low = lowSectionLessons(ld);
    if (!low.length) return '';
    const nums = low.slice(0, 12).map(l => l.num).join('، ') + (low.length > 12 ? ' …' : '');
    return 'عدد الأقسام أقل من 2 في ' + (low.length === 1 ? 'درس واحد' : low.length === 2 ? 'درسين' : low.length + ' دروس') + ' (رقم: ' + nums + ').';
}
function assignCountText(ad) {
    const n = (ad || []).length;
    if (n === 6 || n === 7) return '';
    if (n === 0) return 'لا توجد تقييمات مسندة — المطلوب 6 أو 7 تقييمات.';
    return 'عدد التقييمات المسندة ' + n + (n < 6 ? ' (ينقص ' + (6 - n) + ')' : ' (زيادة ' + (n - 7) + ')') + ' — المطلوب 6 أو 7 تقييمات.';
}
function secCountCell(v) { return (Number(v) || 0) < 2 ? '<span style="color:#c62828;font-weight:bold;">' + v + ' ⚠️</span>' : v; }

// ============================================================
// ملخص المواد والمعلمين: مرتّب حسب المادة، مع نسب إكمال الدروس والتقييمات
// ============================================================
function buildMasterSummaryData() {
    const done = (arr, key) => arr.filter(x => x[key] === '✅ مكتمل').length;
    const rows = teacherQueue.map((e, i) => {
        const tL = (e.lessonsData || []).length,     oL = done(e.lessonsData || [], 'status');
        const tA = (e.assignmentsData || []).length, oA = done(e.assignmentsData || [], 'status');
        return {
            subject: (e.subject || 'غير محدد').trim(),
            teacher: (e.teacher && !/^معلم \d+$/.test(e.teacher)) ? e.teacher.trim() : '—',
            grade: e.grade || '',
            tL, oL, tA, oA,
            pL: tL ? Math.round(oL / tL * 100) : null,
            pA: tA ? Math.round(oA / tA * 100) : null
        };
    });
    const subjects = {};
    rows.forEach(r => { (subjects[r.subject] = subjects[r.subject] || []).push(r); });
    const ar = (a, b) => a.localeCompare(b, 'ar');
    const pct = (o, t) => t ? Math.round(o / t * 100) : null;
    return Object.keys(subjects).sort(ar).map(name => {
        // كل معلم بصفوفه معًا (المعلم المجهول '—' يُعامل كل صف منه بمفرده)
        const byT = {};
        subjects[name].forEach(r => { const k = r.teacher === '—' ? '—|' + r.grade + '|' + Math.random() : r.teacher; (byT[k] = byT[k] || []).push(r); });
        const teachers = Object.values(byT).map(rs => {
            rs.sort((a, b) => ar(a.grade, b.grade));
            const tL = rs.reduce((s, r) => s + r.tL, 0), oL = rs.reduce((s, r) => s + r.oL, 0);
            const tA = rs.reduce((s, r) => s + r.tA, 0), oA = rs.reduce((s, r) => s + r.oA, 0);
            return { name: rs[0].teacher, rows: rs, tL, oL, tA, oA, pL: pct(oL, tL), pA: pct(oA, tA) };
        }).sort((a, b) => ((b.pL ?? -1) - (a.pL ?? -1)) || ((b.pA ?? -1) - (a.pA ?? -1)) || ar(a.name, b.name));
        const list = teachers.flatMap(t => t.rows);
        const tL = list.reduce((s, r) => s + r.tL, 0), oL = list.reduce((s, r) => s + r.oL, 0);
        const tA = list.reduce((s, r) => s + r.tA, 0), oA = list.reduce((s, r) => s + r.oA, 0);
        return { name, teachers, list, tL, oL, tA, oA, pL: pct(oL, tL), pA: pct(oA, tA) };
    });
}

async function subjectPdfFile(group, dateStr) {
    const pdf = await buildSummaryPdf([group], dateStr, 'ملخص مراجعة الجودة — قسم ' + group.name);

    const safe = group.name.replace(/[\\/:*?"<>|]/g, '_');
    return new File([blob], 'جودة_' + safe + '.pdf', { type: 'application/pdf' });
}

    const data = buildMasterSummaryData();

    const allPL = all.tL ? Math.round(all.oL / all.tL * 100) : null, allPA = all.tA ? Math.round(all.oA / all.tA * 100) : null;

            '<div style="text-align:center;font-size:11px;color:#555;margin-bottom:4px;">' + dateStr + ' · مرتّب حسب المادة، ثم نسبة إكمال الدروس تنازليًا</div>' +
            kpi + '<table style="width:100%;border-collapse:collapse;margin-top:6px;">' + tableHead + pages[p] + '</table>' +
            '<div style="position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:9px;color:#888;">صفحة ' + (p + 1) + ' من ' + pages.length + '</div>';
        container.appendChild(el);
        const canvas = await html2canvas(el, { scale: 2, useCORS: true, backgroundColor: '#ffffff', width: 794, height: 1123, windowWidth: 794, windowHeight: 1123 });
        if (p > 0) pdf.addPage();
        pdf.addImage(canvas.toDataURL('image/jpeg', 0.88), 'JPEG', 0, 0, pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight());
        container.removeChild(el);
    }
    document.body.removeChild(container);
    return pdf;
}

// إرسال بريد لمجموعة صفوف معلم
// ── مسودة بريد (.eml) يرفق الملف مباشرة: يفتحها Outlook/Mail كرسالة جاهزة بالمرفق والمستلم ──
function nqBlobToBase64(blob) {
    return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(String(r.result).split(',')[1] || '');
        r.onerror = () => rej(r.error);
        r.readAsDataURL(blob);
    });
}
function nqB64Wrap(b64) { return (b64.match(/.{1,76}/g) || []).join('\r\n'); }
function nqUtf8B64(str) {
    const bytes = new TextEncoder().encode(str); let bin = '';
    bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin);
}
async function nqBuildEml({ to, subject, body, file }) {
    const bnd = '----=_NQ_' + Date.now().toString(36);
    const fileB64 = await nqBlobToBase64(file);
    const encName = '=?UTF-8?B?' + nqUtf8B64(file.name) + '?=';
    const lines = [
        'X-Unsent: 1',
        'To: ' + (to || ''),
        'Subject: =?UTF-8?B?' + nqUtf8B64(subject) + '?=',
        'MIME-Version: 1.0',
        'Content-Type: multipart/mixed; boundary="' + bnd + '"',
        '',
        '--' + bnd,
        'Content-Type: text/plain; charset=UTF-8',
        'Content-Transfer-Encoding: base64',
        '',
        nqB64Wrap(nqUtf8B64(body.replace(/\r?\n/g, '\r\n'))),
        '',
        '--' + bnd,
        'Content-Type: ' + (file.type || 'application/octet-stream') + '; name="' + encName + '"',
        'Content-Transfer-Encoding: base64',
        'Content-Disposition: attachment; filename="' + encName + '"; filename*=UTF-8\'\'' + encodeURIComponent(file.name),
        '',
        nqB64Wrap(fileB64),
        '',
        '--' + bnd + '--',
        ''
    ];
    return new Blob([lines.join('\r\n')], { type: 'message/rfc822' });
}
// يرسل ملفًا مرفقًا: مشاركة الجهاز (الجوال) أو مسودة .eml بالمرفق (الحاسوب)
async function nqSendWithAttachment({ to, subject, body, file, emlName }) {
    const mobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
    if (mobile && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: subject, text: body });
        return 'share';
    }
    const eml = await nqBuildEml({ to, subject, body, file });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(eml); a.download = (emlName || 'رسالة_التقرير') + '.eml';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return 'eml';
}

// يجهّز رسالة معلم (موضوع/نص/ملف PDF) من مجموعة صفوفه
async function nqBuildGroupMail(indices) {
    const entries = indices.map(i => teacherQueue[i]).filter(Boolean);
    if (!entries.length) return null;
    const entry = entries[0];
    const gradeTxt = e => ((/^الصف/.test(e.grade || '') ? '' : 'الصف ') + (e.grade || ''));
    const allNotes = entries.flatMap(e => {
        const notes = [];
        const tL = e.lessonsData.length, oL = e.lessonsData.filter(l=>l.status==='✅ مكتمل').length;
        const tA = e.assignmentsData.length, oA = e.assignmentsData.filter(a=>a.status==='✅ مكتمل').length;
        if (oL < tL) notes.push(gradeTxt(e) + ': ' + (tL-oL) + ' درساً تحتاج مراجعة');
        if (oA < tA) notes.push(gradeTxt(e) + ': ' + (tA-oA) + ' تقييماً تحتاج مراجعة');
        const lowS = lowSectionsText(e.lessonsData); if (lowS) notes.push(gradeTxt(e) + ': ' + lowS);
        const cntA = assignCountText(e.assignmentsData); if (cntA) notes.push(gradeTxt(e) + ': ' + cntA);
        return notes;
    });
    const school = entry.extractedInfo?.school || 'مدرسة حمزة بن عبد المطلب الإعدادية للبنين';
    const deputy = entry.extractedInfo?.deputy || 'أ/ أحمد أبو النور';
    const gradesStr = entries.map(e=>e.grade).join(', ');
    const subject = entry.subject || '';
    const NL = '\n';
    const body =
        'السلام عليكم ورحمة الله وبركاته،' + NL + NL +
        'الأستاذ / ' + entry.teacher + NL +
        'المادة: ' + subject + ' | الصفوف: ' + gradesStr + NL + NL +
        'مرفق تقرير مراجعة جودة الدروس والتقييمات.' + NL + NL +
        (allNotes.length > 0
            ? 'الملاحظات المطلوب العمل عليها:' + NL + allNotes.map((n,i)=>(i+1)+'. '+n).join(NL)
            : 'الأداء جيد — شكراً على الالتزام.') +
        NL + NL + 'مع خالص التحية،' + NL + deputy + NL + school;
    const dateStr = document.getElementById('dateInput')?.value ||
        new Date().toLocaleDateString('ar-QA', {year:'numeric',month:'long',day:'numeric'});
    const pdf = await buildMultiGradePdf(entry.teacher, subject, entries, dateStr);
    if (!pdf) throw new Error('تعذّر إنشاء تقرير ' + entry.teacher);
    const grades = entries.map(e => (e.grade || '').replace('الصف ','').replace('/','_')).join('-');
    const safeName = (entry.teacher + '_' + grades).replace(/\s+/g,'_').replace(/[/\\:*?"<>|]/g,'');
    const file = new File([pdf.output('blob')], safeName + '.pdf', { type: 'application/pdf' });
    return { entry, to: entry.email || '', subject: 'تقرير مراجعة جودة الدروس — ' + subject, body, file, safeName };
}

// زر واحد: مسودات بريد لجميع المعلمين (مرفق بكل مسودة تقريره) في ملف ZIP
async function prepareAllEmailDrafts() {
    if (!teacherQueue.length) { alert('القائمة فارغة'); return; }
    const groups = {};
    teacherQueue.forEach((e, i) => {
        const key = (e.teacher || '?') + '||' + (e.subject || '');
        (groups[key] = groups[key] || []).push(i);
    });
    const list = Object.values(groups);
    const btn = document.getElementById('draftsAllBtn');
    const orig = btn ? btn.textContent : '';
    const zip = new JSZip(); const index = []; let noMail = 0;
    try {
        for (let i = 0; i < list.length; i++) {
            if (btn) { btn.disabled = true; btn.textContent = '⏳ ' + (i + 1) + '/' + list.length + ' — ' + (teacherQueue[list[i][0]].teacher || ''); }
            const m = await nqBuildGroupMail(list[i]);
            const eml = await nqBuildEml({ to: m.to, subject: m.subject, body: m.body, file: m.file });
            const num = String(i + 1).padStart(2, '0');
            zip.file('mail_' + num + '.eml', eml);
            if (!m.to) noMail++;
            index.push('mail_' + num + '.eml = ' + m.entry.teacher + ' — ' + m.entry.subject + ' — ' + (m.to || '(بلا بريد)'));
            await new Promise(r => setTimeout(r, 30));
        }
        zip.file('index.txt', '﻿' + index.join('\r\n'));
        const blob = await zip.generateAsync({ type: 'blob' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'drafts_all_teachers.zip';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        alert('✅ جُهّزت ' + list.length + ' مسودة بريد (كل مسودة بتقرير معلمها مرفقًا).\n\nفك الضغط، ثم حدّد كل ملفات .eml واضغط Enter لفتحها دفعة واحدة في Outlook، وبعدها أرسل كل رسالة.' +
              (noMail ? '\n\n⚠️ ' + noMail + ' معلم بلا بريد محدد — اكتب بريده في المسودة قبل الإرسال (راجع index.txt).' : ''));
    } catch (e) { console.error(e); alert('❌ ' + (e.message || e)); }
    if (btn) { btn.disabled = false; btn.textContent = orig; }
}

    const teacherGroups = {};
    teacherQueue.forEach(entry => {
        const key = (entry.teacher || '') + '|' + (entry.subject || '');
        if (!teacherGroups[key]) {
            teacherGroups[key] = {
                teacher: entry.teacher,
                subject: entry.subject,
                email:   entry.email,
                entries: []
            };
        }
        teacherGroups[key].entries.push(entry);
    });

    let gi = 0;

    for (const group of groupList) {

        btn.textContent = '⏳ ' + gi + '/' + groupList.length + ' — ' + group.teacher;

        const subjectFolder = (group.subject || 'بدون مادة')
            .replace(/[/\\:*?"<>|]/g, '').replace(/\s+/g, '_');
        const teacherSafe = (group.teacher || 'معلم')
            .replace(/[/\\:*?"<>|]/g, '').replace(/\s+/g, '_');
        const folder = zip.folder(subjectFolder).folder(teacherSafe);

        // ── PDF موحّد لجميع صفوف المعلم ──────────────────────
        try {
            if (group.entries.length === 1) {
                // صف واحد — PDF عادي
                const entry = group.entries[0];
                lessonsData         = entry.lessonsData;
                assignmentsData     = entry.assignmentsData;
                sectionsCorrections = entry.sectionsCorrections;
                extractedInfo       = Object.assign({}, entry.extractedInfo);
                document.getElementById('teacherInput').value = entry.teacher;
                document.getElementById('subjectInput').value = entry.subject;
                document.getElementById('gradeInput').value   = entry.grade;
                document.getElementById('emailInput').value   = entry.email || '';
                const pdf     = await createPdfBlob();
                const pdfData = pdf.output('arraybuffer');
                folder.file(group.teacher + '-' + entry.grade + '.pdf', pdfData);
            } else {
                // صفوف متعددة — PDF مجمّع
                const pdf = await buildMultiGradePdf(group.teacher, group.subject, group.entries, dateStr);
                if (pdf) {
                    const pdfData = pdf.output('arraybuffer');
                    const grades  = group.entries.map(e => e.grade).join('+');
                    folder.file(group.teacher + '-' + grades + '.pdf', pdfData);
                }
            }
        } catch(e) { console.warn('PDF error for ' + group.teacher, e); }

        // ── Excel لكل صف (أو مجمّع) ───────────────────────────
        for (const entry of group.entries) {
            try {
                lessonsData         = entry.lessonsData;
                assignmentsData     = entry.assignmentsData;
                sectionsCorrections = entry.sectionsCorrections;
                extractedInfo       = Object.assign({}, entry.extractedInfo);
                document.getElementById('teacherInput').value = entry.teacher;
                document.getElementById('subjectInput').value = entry.subject;
                document.getElementById('gradeInput').value   = entry.grade;
                document.getElementById('emailInput').value   = entry.email || '';
                const xlsxBlob = await generateExcelBlob();
                const xlData   = await xlsxBlob.arrayBuffer();
                folder.file(group.teacher + '-' + entry.grade + '.xlsx', xlData);
            } catch(e) { console.warn('Excel error', e); }
        }

        await new Promise(r => setTimeout(r, 200));
    }


    // ── تقارير PDF للأقسام (مادة مادة) ────────────────────────
    btn.textContent = '⏳ جاري إنشاء تقارير الأقسام...';
    try {
        const bySubject = {};
        teacherQueue.forEach(entry => {
            const subj = (entry.subject || 'بدون مادة').trim();
            if (!bySubject[subj]) bySubject[subj] = [];
            bySubject[subj].push(entry);
        });

        for (const [subject, entries] of Object.entries(bySubject)) {
            btn.textContent = `⏳ تقرير قسم: ${subject}`;
            const subjectPdf = await buildSubjectPdf(subject, entries, dateStr);
            if (subjectPdf) {
                const subjectFolder = subject.replace(/[/\\:*?"<>|]/g,'').replace(/\s+/g,'_');
                const subjectPdfName = 'تقرير-قسم-' + subjectFolder + '-' + dateStr.replace(/\//g,'-') + '.pdf';
                const pdfData = subjectPdf.output('arraybuffer');
                zip.folder(subjectFolder).file(subjectPdfName, pdfData);
            }
            await new Promise(r => setTimeout(r, 100));
        }
    } catch(e) { console.warn('Subject PDF error:', e); }

    // ── تقرير المنسق المجمّع ──────────────────────────────────
    btn.textContent = '⏳ جاري إنشاء تقرير المنسق...';
    try {
        const summaryWb = buildCoordinatorReport(teacherQueue, dateStr);
        const summaryData = XLSX.write(summaryWb, { bookType: 'xlsx', type: 'array' });

        });

        zip.file(summaryName, await summaryBlob.arrayBuffer());
    } catch(e) { console.warn('Coordinator report error:', e); }

    // Generate ZIP
    btn.textContent = '⏳ جاري ضغط الملفات...';
    const zipBlob = await zip.generateAsync({type: 'blob'});
    const zipUrl  = URL.createObjectURL(zipBlob);
    const za = document.createElement('a');
    za.href = zipUrl;
    za.download = 'تقارير_مراجعة_الدروس_' + dateStr.replace(/\//g, '-') + '.zip';
    document.body.appendChild(za); za.click();
    document.body.removeChild(za);
    setTimeout(() => URL.revokeObjectURL(zipUrl), 3000);

    btn.disabled = false;
    btn.textContent = '✅ تم التنزيل — ' + teacherQueue.length + ' معلم';

    // إضافة زر مسح يدوي + إبقاء القائمة لإرسال البريد
    const queueEl = document.getElementById('teacherQueue');
    const clearBtn = document.createElement('button');
    clearBtn.textContent = '🗑 مسح القائمة';
    clearBtn.style.cssText = 'background:#6c757d;color:white;border:none;border-radius:6px;padding:6px 14px;cursor:pointer;font-family:Cairo,sans-serif;font-size:12px;margin-top:8px;width:100%';
    clearBtn.onclick = () => {
        teacherQueue.length = 0;
        queueEl.style.display = 'none';
        document.getElementById('queueList').innerHTML = '';
        btn.textContent = '🚀 تنزيل جميع التقارير (ZIP)';
        btn.disabled = false;
        clearBtn.remove();
    };

    // إعادة رسم القائمة مع أزرار الإرسال

});

/**
 * runAutoExtract(data)
 * تُستدعى من Power Automate Desktop لتمرير بيانات معلم واحد
 * وتشغيل التحليل تلقائياً وعرض النتائج.
 *
 * data = {
 *   teacher: { name, subject, grade, section },
 *   lessonsHtml: "<html>...",
 *   assessmentsHtml: "<html>..."
 * }
 */
window.runAutoExtract = async function(data) {
    try {
        console.log('🤖 Power Automate: بدء الاستخراج التلقائي لـ', data.teacher.name);

        // ملء حقول المعلم
        const subjectInput = document.getElementById('subjectInput');
        const gradeInput   = document.getElementById('gradeInput');

        if (subjectInput) subjectInput.value = data.teacher.subject || '';
        if (gradeInput)   gradeInput.value   = (data.teacher.grade + '/' + data.teacher.section) || '';

        // إذا كان هناك قائمة معلمين، اختر المعلم المناسب
        if (teacherSelect) {
            const options = Array.from(teacherSelect.options);
            const match   = options.find(o =>
                o.text.includes(data.teacher.name) ||
                o.value.includes(data.teacher.name)
            );
            if (match) teacherSelect.value = match.value;
        }

        const currentSubjectVal = data.teacher.subject || '';

        // تحليل البيانات
        lessonsData        = analyzeLessons(data.lessonsHtml);
        assignmentsData    = analyzeAssignments(data.assessmentsHtml, currentSubjectVal);
        sectionsCorrections = extractSectionsCorrections ? extractSectionsCorrections(lessonsData) : [];

        // عرض النتائج
        displayResults();

        // الانتقال لتبويب النتائج إن وُجد
        const resultsTab = document.querySelector('[data-tab="results"], .tab-btn[data-tab="report"]');
        if (resultsTab) resultsTab.click();

        console.log('✅ Power Automate: اكتمل التحليل');
        console.log('NEO_AUTO_EXTRACT_DONE'); // علامة لـ Power Automate ليكتشف الاكتمال

        return { ok: true, lessons: lessonsData.length, assignments: assignmentsData.length };

    } catch (err) {
        console.error('❌ Power Automate خطأ:', err);
        console.log('NEO_AUTO_EXTRACT_ERROR:' + err.message);
        return { ok: false, error: err.message };
    }
};

function buildTeacherWhatsappMsg(entry) {
    const lessons     = entry.lessonsData || [];
    const assignments = entry.assignmentsData || [];
    const totalL  = lessons.length;
    const okL     = lessons.filter(l => l.status === '✅ مكتمل').length;
    const needL   = totalL - okL;
    const totalA  = assignments.length;
    const okA     = assignments.filter(a => a.status === '✅ مكتمل').length;
    const needA   = totalA - okA;
    const secFix  = (entry.sectionsCorrections || []).length;
    const pctL    = totalL ? Math.round(okL / totalL * 100) : 0;
    const school  = (entry.extractedInfo && entry.extractedInfo.school) ||
                    'مدرسة حمزة بن عبد المطلب الإعدادية للبنين';

    // Collect notes from lessons
    const lessonNotes = [];
    if (needL > 0) lessonNotes.push(`• ${needL} درساً تحتاج مراجعة من أصل ${totalL}`);
    if (secFix > 0) lessonNotes.push(`• تصحيح تسمية ${secFix} قسماً في بعض الدروس`);
    lessons.forEach(l => {
        if (l.image === '❌') lessonNotes.push(`• درس "${l.name}": الصورة المصغّرة غير محددة`);
        if (l.hasLearningOutcomes === '❌') lessonNotes.push(`• درس "${l.name}": نتاجات التعلم غير مرتبطة`);
        if (l.orderOk === false) lessonNotes.push(`• ترتيب الدروس: ${l.orderIssue || 'غير مرتب زمنياً'}`);
    });

    // Collect notes from assignments
    const assignNotes = [];
    if (needA > 0) assignNotes.push(`• ${needA} تقييماً يحتاج مراجعة من أصل ${totalA}`);
    assignments.forEach(a => {
        if (a.namingOk === '❌' && a.suggestedName)
            assignNotes.push(`• "${a.name}" ← التسمية المقترحة: "${a.suggestedName}"`);
        else if (a.namingOk === '❌')
            assignNotes.push(`• تسمية غير صحيحة: "${a.name}"`);
        if (a.categoryOk === '❌')
            assignNotes.push(`• "${a.name}": يرجى تغيير الفئة إلى "التقييمات البنائية / الختامية"`);
        if (a.linkedToOutcomes === '❌')
            assignNotes.push(`• "${a.name}": ربط بنتاجات التعلم مطلوب`);
    });

    const dateStr = new Date().toLocaleDateString('ar-QA', {year:'numeric', month:'long', day:'numeric'});

    let msg = `السلام عليكم ورحمة الله وبركاته،

`;
    msg += `الأستاذ / ${entry.teacher}
`;
    msg += `*المادة:* ${entry.subject} | *الصف:* ${entry.grade}

`;
    msg += `تحية طيبة، نفيدكم بأنه تم إرسال إيميل إليكم يتضمن تقريراً شاملاً لمراجعة جودة الدروس والتقييمات الخاصة بمادتكم.

`;
    msg += `*📊 ملخص النتائج:*
`;
    msg += `• الدروس: ${okL}/${totalL} مكتملة (${pctL}%)
`;
    msg += `• التقييمات: ${okA}/${totalA} مكتملة
`;

    if (lessonNotes.length > 0 || assignNotes.length > 0) {
        msg += `
*📋 الملاحظات المطلوب العمل عليها:*
`;
        [...[lowSectionsText(lessons), assignCountText(assignments)].filter(Boolean).map(t => '• ' + t), ...lessonNotes, ...assignNotes].slice(0, 9).forEach(n => { msg += n + '\n'; });
    }

    msg += `
يُرجى الاطلاع على التقرير المرسل عبر البريد الإلكتروني والعمل على تصحيح الملاحظات المذكورة في أقرب وقت ممكن.

`;
    msg += `مع خالص التحية،
${entry.extractedInfo?.deputy || 'أ/ أحمد أبو النور'} — النائب الأكاديمي
${school}
📅 ${dateStr}`;

    return msg;
}

function buildCoordinatorWhatsappMsg(subject, entries) {
    const school  = (entries[0]?.extractedInfo?.school) ||
                    'مدرسة حمزة بن عبد المطلب الإعدادية للبنين';
    const dateStr = new Date().toLocaleDateString('ar-QA', {year:'numeric', month:'long', day:'numeric'});

    const totalL  = entries.reduce((s,e) => s + e.lessonsData.length, 0);
    const okL     = entries.reduce((s,e) => s + e.lessonsData.filter(l=>l.status==='✅ مكتمل').length, 0);
    const totalA  = entries.reduce((s,e) => s + e.assignmentsData.length, 0);
    const okA     = entries.reduce((s,e) => s + e.assignmentsData.filter(a=>a.status==='✅ مكتمل').length, 0);
    const pctL    = totalL ? Math.round(okL/totalL*100) : 0;
    const pctA    = totalA ? Math.round(okA/totalA*100) : 0;

    let msg = `السلام عليكم ورحمة الله وبركاته،

`;
    msg += `*منسق مادة ${subject}*

`;
    msg += `تحية طيبة، نفيدكم بأنه تم إرسال تقارير مراجعة جودة الدروس والتقييمات لجميع معلمي قسم *${subject}* عبر البريد الإلكتروني.

`;
    msg += `*📊 ملخص القسم (${entries.length} معلم):*
`;
    msg += `• الدروس: ${okL}/${totalL} مكتملة (${pctL}%)
`;
    msg += `• التقييمات: ${okA}/${totalA} مكتملة (${pctA}%)

`;
    msg += `*👨‍🏫 تفاصيل المعلمين:*
`;
    entries.forEach(e => {
        const tL = e.lessonsData.length;
        const oL = e.lessonsData.filter(l=>l.status==='✅ مكتمل').length;
        const pL = tL ? Math.round(oL/tL*100) : 0;
        const status = pL >= 80 ? '✅' : pL >= 60 ? '⚠️' : '❌';
        msg += `${status} ${e.teacher} (${e.grade}): ${pL}%
`;
    });
    msg += `
يُرجى متابعة معلمي القسم للعمل على الملاحظات المذكورة في تقاريرهم وإعلامنا بالنتائج.

`;
    msg += `مع خالص التحية،
${entries[0]?.extractedInfo?.deputy || 'أ/ أحمد أبو النور'} — النائب الأكاديمي
${school}
📅 ${dateStr}`;

    return msg;
}

` + buildCoordinatorWhatsappMsg(subj, entries);
    }).join('\n\n' + '═'.repeat(40) + '\n\n');

    try {
        await navigator.clipboard.writeText(allMsgs);
        const statusEl = document.getElementById('whatsappStatus');
        statusEl.style.display = 'block';
        statusEl.textContent = `✅ تم نسخ رسائل ${Object.keys(bySubject).length} منسق — الصقها في واتساب`;
        setTimeout(() => { statusEl.style.display = 'none'; }, 4000);
    } catch(e) {
        const ta = document.createElement('textarea');
        ta.value = allMsgs;
        ta.style.cssText = 'position:fixed;top:10%;left:5%;width:90%;height:75%;z-index:9999;font-size:12px;direction:rtl;padding:10px;border-radius:8px;border:2px solid #128C7E;';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        const closeBtn = document.createElement('button');
        closeBtn.textContent = '✖ إغلاق';
        closeBtn.style.cssText = 'position:fixed;top:10%;right:5%;z-index:10000;background:#dc3545;color:white;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;font-family:Cairo,sans-serif;';
        closeBtn.onclick = () => { document.body.removeChild(ta); document.body.removeChild(closeBtn); };
        document.body.appendChild(closeBtn);
    }
}

<\/script>

  return arr.sort((a, b) => DEPTS.findIndex(d => d.k === a.dept) - DEPTS.findIndex(d => d.k === b.dept) || a.name.localeCompare(b.name, 'ar'));

}
function nameMatch(a, b) {

/* ======================= استيراد تقارير النظام الرسمية ======================= */
function hdrIdx(hdr, ...keys) { const H = hdr.map(x => norm(x)); for (const k of keys) { const i = H.findIndex(x => x.includes(norm(k))); if (i >= 0) return i; } return -1; }
async function importOfficialFiles(files) {
  let nL = 0, nA = 0, nT = 0, nS = 0, nU = 0;
  const weeks = +S.settings.weeks || 6;
  const getRow = (subject, section) => { let r = officialRow(subject, section); if (!r) { r = { subject, section: secNorm(section), teacher: '', nisab: 4, reqL: 0, linked: '', upL: 0, visL: 0, hidL: 0, withSec: 0, withOut: 0, countedL: 0, curDate: '', reqA: weeks, totA: 0, asgA: 0, unasgA: 0, subs: 0, solvePct: 0, outA: 0, corrA: 0, uncorrA: 0, corrPct: 0 }; S.official.sections.push(r); } return r; };
  for (const f of files) {
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array', cellDates: true });
    for (const sn of wb.SheetNames) {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: '', raw: false });
      let hi = -1; for (let i = 0; i < Math.min(8, rows.length); i++) { const j = rows[i].map(norm).join('|'); if ((j.includes('الشعبه') || j.includes('اسم المعلم') || j.includes('اسم الطالب') || j.includes('اخر نشاط')) && rows[i].filter(Boolean).length >= 4) { hi = i; break; } }
      if (hi < 0) continue;
      const H = rows[hi]; const body = rows.slice(hi + 1).filter(r => r.some(Boolean));
      const iSub = hdrIdx(H, 'المادة الدراسية', 'المادة'), iGr = hdrIdx(H, 'الصف'), iSh = hdrIdx(H, 'الشعبة'), iT = hdrIdx(H, 'اسم المعلم');
      const isLessons = hdrIdx(H, 'عدد الدروس الظاهرة') >= 0, isAssess = hdrIdx(H, 'التقييمات المسندة') >= 0;
      const secOf = r => { const sh = String(r[iSh] || ''); return /\//.test(sh) ? secNorm(sh) : secNorm((r[iGr] || '') + '/' + sh); };
      if ((isLessons || isAssess) && iSub >= 0 && iSh >= 0) {
        body.forEach(r => {
          if (!deptOf(r[iSub])) return; const row = getRow(String(r[iSub]).trim(), secOf(r)); if (iT >= 0 && r[iT]) row.teacher = String(r[iT]).trim();
          const n = k => { const i = hdrIdx(H, k); return i >= 0 ? (parseFloat(String(r[i]).replace('%', '')) || 0) : null; };
          if (isLessons) {
            const nis = n('نصاب المادة'); if (nis) row.nisab = nis;
            const req = n('عدد الدروس المطلوبة'); row.reqL = req || row.nisab * weeks;
            row.upL = n('عدد الدروس المرفوعة') ?? n('عدد الدروس') ?? row.upL; row.visL = n('عدد الدروس الظاهرة') ?? row.visL; row.hidL = n('عدد الدروس المخفية') ?? row.hidL;
            row.withSec = n('تحتوي على اقسام') ?? n('على أقسام') ?? row.withSec; row.withOut = n('المرتبطة بنتاجات') ?? row.withOut; row.countedL = n('المحسوبة') ?? row.visL;
            const id = hdrIdx(H, 'تاريخ الدرس الحالي'); if (id >= 0) row.curDate = String(r[id]).slice(0, 10); const il = hdrIdx(H, 'مربوطة بالجدول'); if (il >= 0) row.linked = String(r[il]).trim(); nL++;
          } else {

            row.totA = n('عدد التقييمات') ?? row.totA; row.asgA = n('التقييمات المسندة') ?? row.asgA; row.unasgA = n('غير المسندة') ?? row.unasgA; row.subs = n('عدد التسليمات') ?? row.subs;
            row.solvePct = n('نسبة حل التقييمات') ?? row.solvePct; row.outA = n('المرتبطة بنتاجات') ?? row.outA; row.corrA = n('التقييمات المصححة') ?? row.corrA; row.uncorrA = n('غير المصححة') ?? row.uncorrA; row.corrPct = n('نسبة إتمام') ?? row.corrPct; nA++;
          }

      const iP = hdrIdx(H, 'النقاط'), iLv = hdrIdx(H, 'المستوى');

      const iSt = hdrIdx(H, 'اسم الطالب');

}

function lessonIssues(l) {
  const out = [];

  if (l.lessonDate === '' || l.lessonDate === null) out.push('تاريخ الدرس'); if (l.orderOk === false) out.push('الترتيب الزمني');
  return out;
}
function teacherRecs(t, s) {
  const R = [];
  if (s.lp !== null && s.lp < 100) R.push('استكمال نشر الدروس المطلوبة وفق الخطة الفصلية، وإضافة كل درس قبل موعده بيومين على الأقل وربطه بالجدول الدراسي (ص26-27).');
  if (s.rows.some(r => r.om.hidden)) R.push('مراجعة الدروس المخفية وإظهار ما يلزم للطلبة.');
  if (s.ap !== null && s.ap < 100) R.push('إسناد تقييم ختامي واحد أسبوعيًا بمهلة أسبوع للطلبة، وتحديد تاريخ البدء والاستحقاق والفئة (ص29-30).');
  if (s.sp !== null && s.sp < 70) R.push('تحفيز الطلبة على حل التقييمات عبر «نجوم المادة» والتواصل مع أولياء الأمور.');
  const nms = s.rows.filter(r => r.nm).map(r => r.nm);
  if (nms.some(n => n.fix)) R.push('تصحيح تسمية أقسام الدروس بصيغة (نوع المصدر - موضوع المحتوى) وفق الجدول المقترح.');
  if (nms.some(n => n.lowSec)) R.push('ألا يقل عدد أقسام الدرس عن قسمين مع التنوع: عرض تقديمي، فيديو من الدروس المصورة، نشاط تفاعلي.');
  if (nms.some(n => !n.aCountOk)) R.push('ضبط عدد التقييمات المسندة ليكون 6 أو 7 تقييمات.');
  if (nms.some(n => n.stars === false)) R.push('تفعيل لعبة «نجوم المادة» ومنح الطلبة النقاط والشارات (ص27).');
  if (nms.some(n => (n.lq ?? 100) < 100)) R.push('رفع صورة معبرة لكل درس وكتابة الأهداف في الوصف وربط الدروس بنتاجات التعلم.');

  return R;
}
