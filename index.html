  if(!rows.length) throw new Error("الملف لا يحتوي صفوفًا.");
  const keys=Object.keys(rows[0]); const find=(...w)=>keys.find(k=>w.some(x=>normAr(k).includes(normAr(x))));
  const kN=find("الاسم","name"), kD=find("الماده","القسم"), kR=find("الوظيفه","الدور","role"), kU=find("اسم المستخدم","user"), kP=find("كلمه المرور","password");
  if(!kN||!kR||!kU||!kP) throw new Error("الأعمدة المطلوبة: الاسم، الوظيفة، اسم المستخدم، كلمة المرور (والمادة للمنسق والمعلم).");
  const out=[]; const bad=[];
  rows.forEach((r,i)=>{ const name=String(r[kN]||"").replace(/\s+/g," ").trim(), role=ROLE_FROM_AR(String(r[kR]||"")), u=String(r[kU]||"").trim().toLowerCase().replace(/@.*$/,""), p=String(r[kP]??"").trim(), dept=String(kD?r[kD]:"").trim();
    if(!name&&!u) return; if(!name||!role||!u||!p){ bad.push(i+2); return; } out.push({name,role,u,p,dept}); });
  if(!out.some(a=>a.role==="admin")) throw new Error("يجب وجود مستخدم واحد على الأقل بوظيفة «مدير النظام».");
  const dup=out.map(a=>a.u).filter((x,i,a)=>a.indexOf(x)!==i); if(dup.length) throw new Error("أسماء مستخدمين مكررة: "+[...new Set(dup)].join("، "));
  return {out,bad};
}
async function importAccounts(list){
  const accts=[]; for(const a of list){ accts.push({u:a.u,name:a.name,role:a.role,dept:a.dept,h:await sha(a.u+"|"+a.p)}); }
  S.root.accounts=accts;
  // تحديث منسقي الأقسام في العام المعروض من الحسابات
  let setC=0; accts.filter(a=>a.role==="coord").forEach(a=>{ const r=resolveAcct(a); if(r.teacherId&&r.deptId){ const d=S.cfg.depts.find(d=>d.id===r.deptId); if(d&&d.coordEmail!==r.email){ d.coordEmail=r.email; setC++; } } });
  splitBack(); await persistRoot(); return setC;
}

async function impHandleFiles(list){ if(IMV.busy) return; IMV.busy=true; IMV.errors=[]; const files=[];

    setP("جارٍ تجهيز الملفات…");
    for(const f of list){ const n=f.name.toLowerCase();
      if(n.endsWith(".zip")){ const z=await JSZip.loadAsync(await f.arrayBuffer()); for(const e of Object.values(z.files)){ const en=e.name.toLowerCase(); if(e.dir||en.includes("__macosx")||!/\.(pdf|xlsx|xlsm|xls)$/.test(en)) continue; files.push({name:e.name.split("/").pop(),path:e.name,buf:await e.async("arraybuffer")}); } }
      else if(/\.(pdf|xlsx|xlsm|xls)$/.test(n)) files.push({name:f.name,path:f.webkitRelativePath||f.name,buf:await f.arrayBuffer()}); }
    if(!files.length){ toast("لا توجد ملفات Excel أو PDF في الاختيار"); return; }

    for(let k=0;k<files.length;k++){ const f=files[k]; setP(`جارٍ قراءة ${k+1} من ${files.length}: ${f.name}`);

        if(!recs.length) IMV.errors.push(`${f.name}: لا توجد زيارات مسجلة في الملف`); IMV.raw.push(...recs); added+=recs.length; }
      catch(e){ IMV.errors.push(`${f.name}: ${e.message||e}`); } }
    IMV.prog=`قُرئت ${files.length} ملفًا وتم التعرف على ${added} زيارة.`; logAct("قراءة ملفات زيارات سابقة",`${files.length} ملف – ${added} زيارة`);

  V.forEach(v=>{ IND.forEach(x=>{ const q=(v.ratings||{})[x.i]; if(!q||!(q.l>=1&&q.l<=4)) return; const o=inds[x.i]; o.rated++; o.lv[q.l]++;
      if(q.l>=3){ o.need++; o.teachers.add(v.teacherId); o.depts[v.deptId]=(o.depts[v.deptId]||0)+1; }
      if(q.l>=2) String(q.rec||"").split("\n").map(recNorm).filter(s=>s.length>8).forEach(s=>{ const k=x.i+"|"+s; const r=recs[k]=recs[k]||{t:s,i:x.i,n:0,teachers:new Set(),depts:new Set(),lv:{2:0,3:0,4:0}}; r.n++; r.teachers.add(v.teacherId); r.depts.add(v.deptId); r.lv[q.l]++; o.recs[s]=(o.recs[s]||0)+1; }); }); });
  const indList=inds.filter(o=>o.rated).map(o=>Object.assign(o,{tn:o.teachers.size,tp:tids.length?o.teachers.size/tids.length*100:0,np:o.rated?o.need/o.rated*100:0,top:Object.entries(o.recs).sort((a,b)=>b[1]-a[1]).slice(0,2).map(e=>e[0])}))
    .sort((a,b)=>b.tn-a.tn||b.np-a.np);
  const recList=Object.values(recs).map(r=>Object.assign(r,{tn:r.teachers.size})).sort((a,b)=>b.tn-a.tn||b.n-a.n);
  return {V,tids,indList,recList}; }
// خبراء داخليون: أعلى المعلمين في المؤشر (مستكملة غالبًا) ليكونوا مقدّمي الورشة أو نموذجًا للمشاهدة
function recExperts(i,exclude){ const by={}; scopeVisits(PER).filter(counted).forEach(v=>{ const q=(v.ratings||{})[i]; if(!q||!(q.l>=1&&q.l<=4)) return; const b=by[v.teacherId]=by[v.teacherId]||{s:0,n:0}; b.s+=PTS[q.l]; b.n++; });
  return Object.entries(by).filter(([t,b])=>b.n>=1&&b.s/b.n>=90&&!exclude.has(t)).sort((a,b)=>b[1].s/b[1].n-a[1].s/a[1].n||b[1].n-a[1].n).slice(0,2).map(([t])=>T(t)).filter(Boolean); }
function recsPlan(d){ const start=RCS.start||addDays(today(),7); const items=d.indList.filter(o=>o.tn>0).slice(0,RCS.n);
  return items.map((o,k)=>{ const ex=recExperts(o.x.i,o.teachers); const pr=o.tp>=40?"عالية":o.tp>=20?"متوسطة":"منخفضة";
    const target=[...o.teachers].map(T).filter(Boolean).sort((a,b)=>a.dept.localeCompare(b.dept,"ar"));
    const depts=[...new Set(target.map(t=>t.dept))];
    return {k:k+1,o,title:"ورشة: "+o.x.t.replace(/[.،]+$/,""),domain:DOMAINS[o.x.d],pr,target,depts,ex,date:addDays(start,k*RCS.gap),
      focus:o.top.length?o.top:[o.x.r3||o.x.g||""].filter(Boolean),
      kpi:`خفض نسبة المستويين 3 و4 في المؤشر ${o.x.i+1} من ${Math.round(o.np)}% إلى ${Math.max(0,Math.round(o.np/2))}% أو أقل في زيارات الفترة التالية`,
      follow:`زيارة مركّزة (15–20 دقيقة) على المؤشر ${o.x.i+1} لكل معلم مستهدف خلال 3 أسابيع من الورشة`}; }); }
function recsView(vs){ const deps=visibleDepts(); if(RCS.dept&&!deps.some(d=>d.id===RCS.dept)) RCS.dept=""; const d=recsData(vs,RCS.dept); const plan=recsPlan(d);
  const scopeTxt=RCS.dept?`قسم ${(D(RCS.dept)||{}).name}`:"المدرسة"; const totalRecs=d.recList.reduce((a,r)=>a+r.n,0);
  if(!d.V.length) return `<div class="row" style="margin-bottom:12px">${recsScopeSel(deps)}</div><div class="empty">لا توجد زيارات معتمدة في النطاق المحدد.</div>`;
  return `<div class="row" style="margin-bottom:12px;justify-content:space-between">${recsScopeSel(deps)}<div class="row"><button class="btn" id="rc-csv">Excel (CSV)</button>${can("export.pdf")?`<button class="btn pri" id="rc-pdf">تقرير PDF</button>`:""}</div></div>
  <div class="kpis"><div class="kpi"><span>زيارات محللة</span><b class="num">${d.V.length}</b><small>${esc(scopeTxt)}</small></div><div class="kpi"><span>معلمون مزارون</span><b class="num">${d.tids.length}</b></div><div class="kpi"><span>توصيات مسجلة</span><b class="num">${totalRecs}</b><small>${d.recList.length} توصية مختلفة</small></div><div class="kpi warn"><span>أعلى احتياج جماعي</span><b class="num">${d.indList[0]&&d.indList[0].tn?pct(d.indList[0].tp):"—"}</b><small>${d.indList[0]&&d.indList[0].tn?`من المعلمين في المؤشر ${d.indList[0].x.i+1}`:"لا احتياجات"}</small></div></div>
  <div class="card"><h3>المؤشرات الأعلى احتياجًا (${esc(scopeTxt)})</h3><p class="muted small" style="margin:2px 0 8px">مرتبة بعدد المعلمين الذين حصلوا على المستوى 3 أو 4 في المؤشر؛ هذه هي احتياجات التطوير المهني الجماعية.</p>
   <div class="tbl-wrap"><table><thead><tr><th>#</th><th>المؤشر</th><th>المجال</th><th class="c">معلمون بحاجة</th><th style="min-width:120px">نسبة المعلمين</th><th class="c">نسبة 3 و4 في التقديرات</th><th>أكثر توصية تكرارًا</th></tr></thead><tbody>
   ${d.indList.filter(o=>o.tn).slice(0,10).map(o=>`<tr><td class="num">${o.x.i+1}</td><td>${esc(o.x.t)}</td><td class="small">${esc(DOM_SHORT[o.x.d])}</td><td class="c num">${o.tn} / ${d.tids.length}</td><td><div class="bar ${o.tp>=40?"low":o.tp>=20?"mid":"ok"}"><i style="width:${Math.min(100,o.tp)}%"></i></div><span class="small num">${pct(o.tp)}</span></td><td class="c num">${pct(o.np)}</td><td class="small">${esc(o.top[0]||"—")}</td></tr>`).join("")||`<tr><td colspan="7" class="muted">لا توجد مؤشرات بمستوى 3 أو 4 في النطاق.</td></tr>`}</tbody></table></div></div>
  <div class="card" style="margin-top:14px"><h3>أكثر التوصيات تكرارًا</h3><div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>التوصية</th><th>المؤشر</th><th class="c">مرات التكرار</th><th class="c">عدد المعلمين</th>${RCS.dept?"":`<th>الأقسام</th>`}</tr></thead><tbody>
   ${d.recList.slice(0,15).map(r=>`<tr><td>${esc(r.t)}</td><td class="small">${r.i+1}. ${esc(IND[r.i].t.slice(0,48))}${IND[r.i].t.length>48?"…":""}</td><td class="c num">${r.n}</td><td class="c num">${r.tn}</td>${RCS.dept?"":`<td class="small">${[...r.depts].map(x=>esc((D(x)||{}).name||"")).join("، ")}</td>`}</tr>`).join("")||`<tr><td colspan="5" class="muted">لا توجد توصيات مسجلة.</td></tr>`}</tbody></table></div></div>
  ${RCS.dept?"":`<div class="card" style="margin-top:14px"><h3>أعلى 3 احتياجات في كل قسم</h3><div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>القسم</th><th class="c">زيارات</th><th>الاحتياج 1</th><th>الاحتياج 2</th><th>الاحتياج 3</th></tr></thead><tbody>
   ${deps.map(dp=>{ const dd=recsData(vs,dp.id); if(!dd.V.length) return ""; const top=dd.indList.filter(o=>o.tn).slice(0,3); return `<tr><td><b>${esc(dp.name)}</b></td><td class="c num">${dd.V.length}</td>${[0,1,2].map(k=>top[k]?`<td class="small">${top[k].x.i+1}. ${esc(top[k].x.t.slice(0,44))}${top[k].x.t.length>44?"…":""} <span class="lv lv4 num">${top[k].tn}/${dd.tids.length}</span></td>`:`<td class="muted small">—</td>`).join("")}</tr>`; }).join("")}</tbody></table></div></div>`}
  <div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between;align-items:flex-end"><div><h3>خطة ورش العمل المقترحة</h3><p class="muted small" style="margin:2px 0 0">تُبنى تلقائيًا من أعلى الاحتياجات؛ المستهدفون هم من حصلوا على المستوى 3 أو 4، والمقدّم المقترح من المعلمين المتميزين في المؤشر نفسه.</p></div>
    <div class="row"><label class="f" style="width:110px">عدد الورش<select id="rc-n">${[3,4,5,6,8].map(n=>`<option ${RCS.n===n?"selected":""}>${n}</option>`).join("")}</select></label><label class="f" style="width:150px">بداية الخطة<input type="date" id="rc-start" value="${esc(RCS.start||addDays(today(),7))}"></label><label class="f" style="width:120px">الفاصل<select id="rc-gap">${[[7,"أسبوع"],[14,"أسبوعان"],[21,"3 أسابيع"]].map(([n,t])=>`<option value="${n}" ${RCS.gap===n?"selected":""}>${t}</option>`).join("")}</select></label></div></div>
   ${plan.length?`<div class="ws-list">${plan.map(p=>`<div class="ws"><div class="ws-h"><span class="ws-n num">${p.k}</span><div style="flex:1;min-width:0"><b>${esc(p.title)}</b><div class="muted small">${esc(p.domain)} · المؤشر ${p.o.x.i+1} · ${fmtD(p.date)}</div></div><span class="chip ${p.pr==="عالية"?"st-draft":""}" style="background:${p.pr==="عالية"?"var(--l4-bg);color:var(--l4)":p.pr==="متوسطة"?"var(--l3-bg);color:var(--l3)":"var(--l1-bg);color:var(--l1)"}">أولوية ${p.pr}</span></div>
      <div class="ws-g"><div><span class="ws-k">المستهدفون (${p.target.length})</span>${esc(p.target.map(t=>t.name).join("، "))}<div class="muted small">${esc(p.depts.join(" · "))}</div></div>
      <div><span class="ws-k">محاور الورشة</span>${p.focus.map(f=>`<div class="small">• ${esc(f.replace(/^(أوصي بـ:|يوصى)\s*/,""))}</div>`).join("")}</div>
      <div><span class="ws-k">مقدّم / نموذج مقترح</span>${p.ex.length?esc(p.ex.map(t=>t.name).join("، ")):`<span class="muted">المنسق أو الموجه التربوي</span>`}</div>
      <div><span class="ws-k">مؤشر النجاح والمتابعة</span><div class="small">${esc(p.kpi)}</div><div class="small muted">${esc(p.follow)}</div></div></div></div>`).join("")}</div>
   ${can("pd.manage")&&!RO()?`<div class="row" style="margin-top:12px;justify-content:space-between"><span class="muted small">اعتماد الخطة يضيف لكل معلم مستهدف إجراء «حضور الورشة وتطبيقها» في خطة تطويره المهني بموعد الورشة.</span><button class="btn gold" id="rc-pd">اعتماد الخطة وإضافتها لخطط التطوير</button></div>`:""}`:`<p class="muted">لا توجد احتياجات جماعية تستدعي ورشًا في هذا النطاق.</p>`}</div>`; }
function recsScopeSel(deps){ return `<label class="f" style="max-width:300px">النطاق<select id="rc-dept"><option value="">${S.user.role==="coord"?"القسم":"المدرسة كاملة"}</option>${deps.length>1||S.user.role!=="coord"?deps.map(x=>`<option value="${x.id}" ${RCS.dept===x.id?"selected":""}>قسم ${esc(x.name)}</option>`).join(""):""}</select></label>`; }
function recsPdfBlocks(vs){ const d=recsData(vs,RCS.dept); const plan=recsPlan(d); const scopeTxt=RCS.dept?`قسم ${(D(RCS.dept)||{}).name}`:"المدرسة";
  const meta=`${PER==="year"?"العام الأكاديمي "+S.year:PER+" – "+S.year} · ${scopeTxt} · ${d.V.length} زيارة · ${d.tids.length} معلمًا`;
  const out=[wrapR(docHead()+`<div style="text-align:center;margin:8px 0"><div style="font-size:21px;font-weight:bold;color:${OFF.maroon}">تقرير احتياجات التطوير المهني الجماعية</div><div style="font-size:12px;color:${OFF.gray}">التوصيات الأكثر تكرارًا وخطة ورش العمل · ${esc(meta)} · صدر في <span dir="ltr">${fmtD(today())}</span></div></div>`
   +secTitle("المؤشرات الأعلى احتياجًا","عدد المعلمين بمستوى 3 أو 4")+`<table width="100%" style="border-collapse:collapse"><tr>${TH("width:6%")}#</th>${TH()}المؤشر</th>${TH("text-align:center;width:13%")}المعلمون</th>${TH("width:20%")}النسبة</th>${TH()}أكثر توصية تكرارًا</th></tr>
   ${d.indList.filter(o=>o.tn).slice(0,10).map(o=>`<tr>${TD("text-align:center")}${o.x.i+1}</td>${TD()}${esc(o.x.t)}</td>${TD("text-align:center")}${o.tn} / ${d.tids.length}</td>${TD()}${hbar(o.tp,o.tp>=40?OFF.lv[4][0]:o.tp>=20?OFF.lv[3][0]:OFF.lv[1][0])}<span style="font-size:10px">${pct(o.tp)}</span></td>${TD("font-size:10.5px")}${esc(o.top[0]||"—")}</td></tr>`).join("")}</table>`
   +secTitle("أكثر التوصيات تكرارًا")+`<table width="100%" style="border-collapse:collapse"><tr>${TH()}التوصية</th>${TH("width:10%")}المؤشر</th>${TH("text-align:center;width:10%")}التكرار</th>${TH("text-align:center;width:10%")}المعلمون</th></tr>
   ${d.recList.slice(0,15).map(r=>`<tr>${TD()}${esc(r.t)}</td>${TD("text-align:center")}${r.i+1}</td>${TD("text-align:center")}${r.n}</td>${TD("text-align:center")}${r.tn}</td></tr>`).join("")}</table>`)];
  if(plan.length) out.push(wrapR(secTitle("خطة ورش العمل المقترحة",`${plan.length} ورش`)+plan.map(p=>`<table class="pdf-keep" width="100%" style="border-collapse:collapse;margin-bottom:10px"><tr><td colspan="2" style="background:#F7F1F0;border:1px solid #d9cfcd;padding:6px 8px"><b style="color:${OFF.maroon}">${p.k}. ${esc(p.title)}</b> <span style="font-size:10.5px;color:${OFF.gray}">· ${esc(p.domain)} · الموعد المقترح <span dir="ltr">${fmtD(p.date)}</span> · أولوية ${p.pr}</span></td></tr>
    <tr>${TD("width:24%;font-weight:bold")}المستهدفون (${p.target.length})</td>${TD()}${esc(p.target.map(t=>t.name).join("، "))}</td></tr>
    <tr>${TD("font-weight:bold")}محاور الورشة</td>${TD()}${p.focus.map(f=>"• "+esc(f.replace(/^(أوصي بـ:|يوصى)\s*/,""))).join("<br>")}</td></tr>
    <tr>${TD("font-weight:bold")}مقدّم / نموذج مقترح</td>${TD()}${p.ex.length?esc(p.ex.map(t=>t.name+" ("+t.dept+")").join("، ")):"المنسق أو الموجه التربوي"}</td></tr>
    <tr>${TD("font-weight:bold")}مؤشر النجاح</td>${TD()}${esc(p.kpi)}</td></tr><tr>${TD("font-weight:bold")}المتابعة</td>${TD()}${esc(p.follow)}</td></tr></table>`).join("")));
  return out; }
function bindRecs(){
  const ds=$("#rc-dept"); if(ds) ds.onchange=()=>{ RCS.dept=ds.value; render(); };
  const n=$("#rc-n"); if(n) n.onchange=()=>{ RCS.n=+n.value; render(); };
  const st=$("#rc-start"); if(st) st.onchange=()=>{ RCS.start=st.value; render(); };
  const gp=$("#rc-gap"); if(gp) gp.onchange=()=>{ RCS.gap=+gp.value; render(); };
  const pdf=$("#rc-pdf"); if(pdf) pdf.onclick=async()=>{ const b=busy("إنشاء تقرير احتياجات التطوير المهني"); try{ const doc=await htmlListToPdf(recsPdfBlocks(rptVis()),`PD needs report - ${S.year}`,(i,n)=>b.set(i,n)); await saveFile(`تقرير-احتياجات-التطوير-${RCS.dept?(D(RCS.dept)||{}).name:"المدرسة"}-${today()}.pdf`,doc.output("blob"),"application/pdf"); logAct("تقرير احتياجات التطوير",RCS.dept||"المدرسة"); }catch(e){ toast(e.message||String(e)); } finally{ b.done(); } };
  const csv=$("#rc-csv"); if(csv) csv.onclick=()=>{ const d=recsData(rptVis(),RCS.dept); const plan=recsPlan(d); const q=s=>'"'+String(s??"").replace(/"/g,'""')+'"';
    const L=[q(S.cfg.school),q(`تقرير احتياجات التطوير المهني – ${RCS.dept?"قسم "+(D(RCS.dept)||{}).name:"المدرسة"} – العام ${S.year}`),"",
      ["المؤشر","نص المؤشر","المجال","معلمون بحاجة","نسبة المعلمين %","نسبة 3 و4 %","أكثر توصية"].map(q).join(","),
      ...d.indList.filter(o=>o.tn).map(o=>[o.x.i+1,o.x.t,DOMAINS[o.x.d],o.tn,Math.round(o.tp),Math.round(o.np),o.top[0]||""].map(q).join(",")),"",
      ["التوصية","المؤشر","التكرار","عدد المعلمين"].map(q).join(","),...d.recList.map(r=>[r.t,r.i+1,r.n,r.tn].map(q).join(",")),"",
      ["#","الورشة","الموعد","الأولوية","المستهدفون","المقدم المقترح","مؤشر النجاح"].map(q).join(","),...plan.map(p=>[p.k,p.title,p.date,p.pr,p.target.map(t=>t.name).join("، "),p.ex.map(t=>t.name).join("، "),p.kpi].map(q).join(","))];
    saveFile(`احتياجات-التطوير-${today()}.csv`,"﻿"+L.join("\r\n"),"text/csv"); };
  const pd=$("#rc-pd"); if(pd) pd.onclick=()=>{ const plan=recsPlan(recsData(rptVis(),RCS.dept)); const n=plan.reduce((a,p)=>a+p.target.length,0);
    confirmBox(`سيُضاف ${n} إجراء تطوير (حضور الورشة وتطبيقها) لـ ${new Set(plan.flatMap(p=>p.target.map(t=>t.id))).size} معلمًا. متابعة؟`,async()=>{ let k=0; const now=new Date().toISOString();
      for(const p of plan){ const key=`ws|${S.year}|${p.o.x.i}`; for(const t of p.target){ if(PDS().some(x=>x.wsKey===key&&x.teacherId===t.id)) continue;
        await put("pd",{id:uid(),type:"ws",wsKey:key,year:S.year,teacherId:t.id,deptId:t.deptId,visitId:null,ind:p.o.x.i,level:null,text:`حضور ${p.title} (${fmtD(p.date)}) وتطبيق محاورها في الحصص، مع زيارة متابعة مركّزة على المؤشر ${p.o.x.i+1}`,priority:false,due:addDays(p.date,21),status:"open",progress:"",createdBy:S.user.key,createdAt:now}); k++; } }
      logAct("اعتماد خطة ورش العمل",`${plan.length} ورش – ${k} إجراء`); toast(`أُضيف ${k} إجراء تطوير لخطط المعلمين`); render(); },"اعتماد"); };
}
